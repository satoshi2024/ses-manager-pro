        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/contract-statuses/count:
    get:
      tags: [contract-status]
      operationId: countContractStatuses
      summary: Count candidate contract statuses
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.contract-status.read
      x-data-scope: tenant + legal entity + contract/project allow-list
      x-command-permission: integration.contract-status.read
      parameters:
