components:
  securitySchemes:
    publicClientAuthentication:
      type: http
      scheme: bearer
      bearerFormat: candidate-client-credential
      description: >
        Non-anonymous dedicated public-client authentication boundary. Concrete OAuth2 client credentials or
        signed service account verification remains an OWNER_GATE and is not approved by this candidate.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Client supplied correlation ID subject to validation; server generates one when omitted.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Candidate bounded page size. Final SLA and limit are unapproved.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: >
        Opaque cursor bound server-side to client, granted scope, data scope, tenant, as-of, filter, stable sort,
        and expiry. Database IDs and offset state are not public contract.
    AsOf:
      name: asOf
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Candidate server-time snapshot binding. Timezone and historical policy are unapproved.
    PublicEngineerId:
      name: publicEngineerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
    PublicProjectId:
      name: publicProjectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
    PublicContractId:
      name: publicContractId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
    PublicInvoiceId:
      name: publicInvoiceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
  headers:
    CorrelationId:
      description: Server correlation ID for safe support tracing.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    BadRequest:
      description: Stable validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Stable authentication error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Stable authorization error with non-enumeration policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Stable non-enumerating resource error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Stable rate limit error
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: Stable safe server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    EngineerAvailability:
      type: object
      additionalProperties: false
      required: [publicEngineerId, availabilityStatus]
      x-allow-list-fields: [publicEngineerId, availabilityStatus, availableFrom, availableTo, skillTagCode]
      x-deny-fields:
        - internalDatabaseId
        - engineerName
        - email
        - phone
        - cost
        - grossProfit
        - unitPrice
        - password
        - token
        - apiKey
      properties:
        publicEngineerId:
          type: string
        availabilityStatus:
          type: string
          enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]
        availableFrom:
          type: string
          format: date
          nullable: true
        availableTo:
          type: string
          format: date
          nullable: true
        skillTagCode:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
    Project:
      type: object
      additionalProperties: false
      required: [publicProjectId, status]
      x-allow-list-fields: [publicProjectId, status, startDate, endDate, publicCustomerId]
      x-deny-fields:
        - internalDatabaseId
        - customerName
        - customerEmail
        - engineerName
        - documentBody
        - cost
        - grossProfit
        - unitPrice
        - providerRawBody
      properties:
        publicProjectId:
          type: string
        status:
          type: string
          maxLength: 64
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        publicCustomerId:
          type: string
          nullable: true
    ContractStatus:
      type: object
      additionalProperties: false
      required: [publicContractId, status]
      x-allow-list-fields: [publicContractId, publicProjectId, status, startDate, endDate, renewalStatus]
      x-deny-fields:
        - internalDatabaseId
        - contractAmount
        - cost
        - grossProfit
        - unitPrice
        - customerName
        - providerRawBody
        - stack
        - sql
      properties:
        publicContractId:
          type: string
        publicProjectId:
          type: string
          nullable: true
        status:
          type: string
          maxLength: 64
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        renewalStatus:
          type: string
          maxLength: 64
          nullable: true
    InvoiceStatus:
      type: object
      additionalProperties: false
      required: [publicInvoiceId, status]
      x-allow-list-fields: [publicInvoiceId, publicContractId, status, issueDate, dueDate, paidAt, settlementStatus]
      x-deny-fields:
        - internalDatabaseId
        - amount
        - accountNumber
        - customerName
        - documentBody
        - password
        - token
        - providerRawBody
        - stack
        - sql
      properties:
        publicInvoiceId:
          type: string
        publicContractId:
          type: string
          nullable: true
        status:
          type: string
          maxLength: 64
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        settlementStatus:
          type: string
          maxLength: 64
          nullable: true
    EngineerAvailabilityList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EngineerAvailability'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    ContractStatusList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractStatus'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    InvoiceStatusList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceStatus'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    CountResponse:
      type: object
      additionalProperties: false
      required: [count, asOf]
      properties:
        count:
          type: integer
          minimum: 0
        asOf:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, retryable]
      x-allow-list-fields: [code, message, correlationId, retryable, fieldErrors]
      x-deny-fields: [stack, sql, internalId, providerRawBody, dlqInternalReason, secret, token, apiKey, pii]
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_FAILED
            - FORBIDDEN_SCOPE
            - RESOURCE_NOT_FOUND
            - REQUEST_INVALID
            - CURSOR_INVALID
            - RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
          maxLength: 256
        correlationId:
          type: string
          minLength: 16
          maxLength: 128
        retryable:
          type: boolean
        fieldErrors:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
                maxLength: 64
              code:
                type: string
                maxLength: 64
