openapi: 3.0.3
info:
  title: SES Manager Pro Integration Hub Public API
  version: 1.0.0-candidate
  description: >
    DG-05承認前の非公開candidate契約。公開対象、認証方式、SLA、field inventoryは未承認であり、
    この文書をproduction APIまたはapproved OpenAPIとして扱ってはならない。
    /external-api/v1/** はinternal管理chain、portal chain、anonymous webhook例外から分離された
    dedicated machine-to-machine security boundaryである。匿名アクセス、internal role偽装、entity直列化、
    command API、export APIは許可しない。
  x-approval-status: UNAPPROVED
  x-security-boundary: dedicated-public-client-chain
  x-default-deny-surfaces:
    - command
    - export
  x-version-retirement-policy: >
    Candidate rule only: deprecation noticeは後継versionとmigration planを添えて180日以上前に通知し、
    retirementはDG-05 Owner承認とsecurity review PASS後にだけ行う。最終SLAは未承認。
servers:
  - url: https://api.example.invalid
    description: Candidate placeholder server; production endpoint is not approved.
security:
  - publicClientAuthentication: []
paths:
  /external-api/v1/engineer-availability:
    get:
      tags: [engineer-availability]
      operationId: listEngineerAvailability
      summary: List candidate engineer availability
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.availability.read
      x-data-scope: tenant + legal entity + engineer allow-list
      x-command-permission: integration.engineer-availability.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Candidate allow-list response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineerAvailabilityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/engineer-availability/{publicEngineerId}:
    get:
      tags: [engineer-availability]
      operationId: getEngineerAvailability
      summary: Get candidate engineer availability
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.availability.read
      x-data-scope: tenant + legal entity + engineer allow-list
      x-command-permission: integration.engineer-availability.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PublicEngineerId'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Candidate allow-list response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineerAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/engineer-availability/count:
    get:
      tags: [engineer-availability]
      operationId: countEngineerAvailability
      summary: Count candidate engineer availability
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.availability.read
      x-data-scope: tenant + legal entity + engineer allow-list
      x-command-permission: integration.engineer-availability.read
      description: >
        Count uses exactly the list predicate and must not reveal scope-excluded population.
        Final non-enumeration behavior is DG-05 Owner approval gate.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Candidate count response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/projects:
    get:
      tags: [project]
