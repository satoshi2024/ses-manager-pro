        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/projects/count:
    get:
      tags: [project]
      operationId: countProjects
      summary: Count candidate projects
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.project.read
      x-data-scope: tenant + legal entity + project/customer allow-list
      x-command-permission: integration.project.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Candidate count response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/contract-statuses:
    get:
      tags: [contract-status]
      operationId: listContractStatuses
      summary: List candidate contract statuses
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.contract-status.read
      x-data-scope: tenant + legal entity + contract/project allow-list
      x-command-permission: integration.contract-status.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Candidate allow-list response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractStatusList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/contract-statuses/{publicContractId}:
    get:
      tags: [contract-status]
      operationId: getContractStatus
      summary: Get candidate contract status
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.contract-status.read
      x-data-scope: tenant + legal entity + contract/project allow-list
      x-command-permission: integration.contract-status.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PublicContractId'
      responses:
        '200':
          description: Candidate allow-list response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
