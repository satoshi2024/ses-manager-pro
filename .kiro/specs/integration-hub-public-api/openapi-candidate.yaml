openapi: 3.0.3
info:
  title: SES Manager Pro Integration Hub Public API
  version: 1.0.0-candidate
  description: >
    DG-05承認済みのPlan Review用非公開candidate契約。F1 persistence基盤の入力として使用できるが、
    この文書だけでproduction API endpointをenableしてはならない。
    /external-api/v1/** はinternal管理chain、portal chain、anonymous webhook例外から分離された
    dedicated machine-to-machine security boundaryである。匿名アクセス、internal role偽装、entity直列化、
    command API、export APIは許可しない。
  x-approval-status: APPROVED_FOR_PLAN_ONLY
  x-security-boundary: dedicated-public-client-chain
  x-default-deny-surfaces:
    - command
    - export
  x-version-retirement-policy: >
    retirementは後継versionとmigration planを添えて180日以上前に通知し、security review PASS後に行う。
    月間99.9%、p95 500ms等の承認SLAを満たさないenablementは禁止する。
  x-error-status-code-map:
    '400': [REQUEST_INVALID, CURSOR_INVALID]
    '401': [AUTHENTICATION_FAILED]
    '403': [FORBIDDEN_SCOPE]
    '404': [RESOURCE_NOT_FOUND]
    '409': [INBOUND_PAYLOAD_CONFLICT]
    '429': [RATE_LIMITED]
    '500': [INTERNAL_ERROR]
  x-non-enumeration-rule: >
    Scope外のdetail targetは存在しないtargetと同じ404/RESOURCE_NOT_FOUNDへ収束させる。
    list/countではscope外rowを母集団へ含めず、error、cursor、件数から存在を推測できないようにする。
servers:
  - url: https://api.example.invalid
    description: Non-production example; public endpoint enablement is not approved by this scope.
security:
  - publicClientAuthentication: []
paths:
  /external-api/v1/engineer-availability:
    get:
      tags: [engineer-availability]
      operationId: listEngineerAvailability
      summary: List candidate engineer availability
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.availability.read
      x-data-scope: tenant + legal entity + engineer allow-list
      x-command-permission: integration.engineer-availability.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Candidate allow-list response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineerAvailabilityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/engineer-availability/{publicEngineerId}:
    get:
      tags: [engineer-availability]
      operationId: getEngineerAvailability
      summary: Get candidate engineer availability
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.availability.read
      x-data-scope: tenant + legal entity + engineer allow-list
      x-command-permission: integration.engineer-availability.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/PublicEngineerId'
      responses:
        '200':
          description: Candidate allow-list response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineerAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /external-api/v1/projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: List candidate projects
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.project.read
