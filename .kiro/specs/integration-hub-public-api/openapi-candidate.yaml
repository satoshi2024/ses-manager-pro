  /external-api/v1/invoice-statuses:
    get:
      tags: [invoice-status]
      operationId: listInvoiceStatuses
      summary: List candidate invoice statuses
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.invoice-status.read
      x-data-scope: tenant + legal entity + invoice/customer allow-list
      x-command-permission: integration.invoice-status.read
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
