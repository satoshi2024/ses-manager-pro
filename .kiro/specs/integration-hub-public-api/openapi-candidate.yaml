  /external-api/v1/webhooks/{provider}:
    post:
      tags: [inbound-webhook]
      operationId: receiveInboundWebhook
      summary: Receive an approved inbound provider webhook event
      security:
        - publicClientAuthentication: []
      x-required-client-scope: integration.webhook.receive
      x-data-scope: tenant + legal entity + approved inbound provider binding
      x-command-permission: integration.webhook.receive
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._~-]{1,100}$'
        - name: X-Provider-Event-ID
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventType]
              properties:
                eventType:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '200':
          description: Duplicate delivery of an already terminal inbound event
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhookResponse'
        '202':
          description: Accepted or still processing inbound event
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InboundConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    publicClientAuthentication:
      type: apiKey
      in: header
      name: X-Client-Signature
      description: >
        HMAC-SHA256 signed service account authentication. The canonical bytes include clientId,
        credentialVersion/keyId, timestamp, nonce, method, canonical path/query, and body SHA-256.
        Timestamp tolerance is plus or minus five minutes, nonce replay is rejected, and OAuth fallback is disabled.
      x-required-auth-headers: [X-Client-ID, X-Credential-Version, X-Key-ID, X-Timestamp, X-Nonce, X-Client-Signature]
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Client supplied correlation ID subject to validation; server generates one when omitted.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Candidate bounded page size within the approved SLA and payload limit.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: >
        Opaque cursor bound server-side to client, granted scope, data scope, tenant, as-of, filter, stable sort,
        and expiry. Database IDs and offset state are not public contract.
    PublicEngineerId:
      name: publicEngineerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
    PublicProjectId:
      name: publicProjectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
    PublicContractId:
      name: publicContractId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
    PublicInvoiceId:
      name: publicInvoiceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Opaque client-bound public identifier; never an internal database ID.
  headers:
    CorrelationId:
      description: Server correlation ID for safe support tracing.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    BadRequest:
      description: Stable validation error
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    Unauthorized:
      description: Stable authentication error
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    Forbidden:
      description: Stable authorization error with non-enumeration policy
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    InboundConflict:
      description: Stable inbound payload hash conflict for the same provider event ID
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InboundConflictError'
    NotFound:
      description: Stable non-enumerating resource error for nonexistent or scope-excluded targets
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    RateLimited:
      description: Stable rate limit error
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
    ServerError:
      description: Stable safe server error
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
  schemas:
    EngineerAvailability:
      type: object
      additionalProperties: false
      required: [publicEngineerId, availabilityStatus]
      x-allow-list-fields: [publicEngineerId, availabilityStatus, availableFrom, availableTo, skillTagCode]
      x-deny-fields:
        - internalDatabaseId
        - engineerName
        - email
        - phone
        - cost
        - grossProfit
        - unitPrice
        - password
        - token
        - apiKey
      properties:
        publicEngineerId:
          type: string
        availabilityStatus:
          type: string
          enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]
        availableFrom:
          type: string
          format: date
          nullable: true
        availableTo:
          type: string
          format: date
          nullable: true
        skillTagCode:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
    Project:
      type: object
      additionalProperties: false
      required: [publicProjectId, status]
      x-allow-list-fields: [publicProjectId, status, startDate, endDate, publicCustomerId]
      x-deny-fields:
        - internalDatabaseId
        - customerName
        - customerEmail
        - engineerName
        - documentBody
        - cost
        - grossProfit
        - unitPrice
        - providerRawBody
      properties:
        publicProjectId:
          type: string
        status:
          type: string
          maxLength: 64
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        publicCustomerId:
          type: string
          nullable: true
    ContractStatus:
      type: object
      additionalProperties: false
      required: [publicContractId, status]
      x-allow-list-fields: [publicContractId, publicProjectId, status, startDate, endDate, renewalStatus]
      x-deny-fields:
        - internalDatabaseId
        - contractAmount
        - cost
        - grossProfit
        - unitPrice
        - customerName
        - providerRawBody
        - stack
        - sql
      properties:
        publicContractId:
          type: string
        publicProjectId:
          type: string
          nullable: true
        status:
          type: string
          maxLength: 64
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        renewalStatus:
          type: string
          maxLength: 64
          nullable: true
    InvoiceStatus:
      type: object
      additionalProperties: false
      required: [publicInvoiceId, status]
      x-allow-list-fields: [publicInvoiceId, publicContractId, status, issueDate, dueDate, paidAt, settlementStatus]
      x-deny-fields:
        - internalDatabaseId
        - amount
        - accountNumber
        - customerName
        - documentBody
        - password
        - token
        - providerRawBody
        - stack
        - sql
      properties:
        publicInvoiceId:
          type: string
        publicContractId:
          type: string
          nullable: true
        status:
          type: string
          maxLength: 64
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        settlementStatus:
          type: string
          maxLength: 64
          nullable: true
    EngineerAvailabilityList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EngineerAvailability'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    ContractStatusList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractStatus'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    InvoiceStatusList:
      type: object
      additionalProperties: false
      required: [items, hasMore, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceStatus'
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        asOf:
          type: string
          format: date-time
    CountResponse:
