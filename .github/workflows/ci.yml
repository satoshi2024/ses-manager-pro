name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-test:
    name: fast tests (H2 / unit / MVC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # JsSyntaxCheckTest（全JSモジュールの node --check）に必要。
      # CI=true のときは「Nodeが無ければskipではなく失敗」する契約になっている。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 既定profileはmysql/performance tagを明示的に除外する。環境依存skipではない。
      - name: Run fast tests
        run: mvn -B clean test

      - name: Ensure no tests were skipped
        run: |
          skipped_files=$(grep -l 'skipped="[1-9]' target/surefire-reports/*.xml || true)
          if [ -n "$skipped_files" ]; then
            echo "Error: Fast tests were skipped."
            echo "$skipped_files"
            exit 1
          fi

      - name: Upload fast-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-fast
          path: target/surefire-reports/
          retention-days: 7

  mysql-test:
    name: MySQL integration / Flyway (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker is available (required by Testcontainers tests)
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "Error: Docker is not available. Flyway migration smoke tests would be silently skipped."
            exit 1
          fi
          docker version --format 'Docker Engine {{.Server.Version}} / API {{.Server.APIVersion}}'

      - name: Run MySQL tests
        run: |
          tests=$(paste -sd, "scripts/test-suites/mysql-shard-${{ matrix.shard }}.txt")
          mvn -B clean test -Pmysql-tests -Dtest="$tests"

      # 「skipされたテストが1件も無いこと」がCIの契約。
      # Docker/Node/フォント等の環境差でテストが静かに消えるのを防ぐ。
      - name: Ensure no tests were skipped
        run: |
          skipped_files=$(grep -l 'skipped="[1-9]' target/surefire-reports/*.xml || true)
          if [ -n "$skipped_files" ]; then
            echo "Error: Tests were skipped. This is not allowed to prevent silent regressions."
            echo "$skipped_files"
            echo ""
            exit 1
          fi

      - name: Upload MySQL-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-mysql-${{ matrix.shard }}
          path: target/surefire-reports/
          retention-days: 7

  performance-test:
    name: performance regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run performance tests without JaCoCo instrumentation
        run: mvn -B clean test -Pperformance-tests

      - name: Ensure no tests were skipped
        run: |
          skipped_files=$(grep -l 'skipped="[1-9]' target/surefire-reports/*.xml || true)
          if [ -n "$skipped_files" ]; then
            echo "Error: Performance tests were skipped."
            echo "$skipped_files"
            exit 1
          fi

      - name: Upload performance-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-performance
          path: target/surefire-reports/
          retention-days: 7

  # HFP-03-011: 実 MySQL（source/target 別コンテナ）での PITR integration suite。
  # Docker が無ければ失敗する（skip/BLOCKED は認めない契約）。
  backup-integration:
    name: backup integration (real MySQL PITR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "Error: Docker is not available. backup integration suite would be skipped."
            exit 1
          fi

      # preflight -> full -> checkpoint -> PITR restore -> validate（before/after marker 照合）
      - name: Run backup integration suite
        run: bash ops/backup/tests/run-integration.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-integration-evidence
          path: ops/backup/tests/.integration-work/evidence/
          retention-days: 7
