# dev プロファイル専用設定。
# R3_SCALE_300 シード（V100の基礎データ + V134/V135の現行module補助データ）を
# 通常起動（spring.profiles.active=dev）でも自動適用する。
# 他のプロファイル（test/prod）には影響しない。
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/migration-dev

# ローカル開発の単一tenant（V2のadminと権限groupのtenant = default）。環境変数を設定すればそちらが優先される。
# prod は application-dev.yml を読まないため、従来どおり両方を明示設定しないと起動を拒否する（deploy-runbook §1.0 の5・26）。
app:
  accounting:
    tenants:
      # 空だと AccountingTenantInventoryStartupValidator がtest以外の全profileで起動を止める。
      ids: ${ACCOUNTING_TENANT_IDS:default}
  security:
    oidc:
      # local loginのprincipalはこの値をtenantにする（sys_user.tenant_id は使わない）。空だとlogin後の全画面・APIが
      # 403 TENANT_CONTEXT_REQUIRED（InternalTenantContextFilter）になる。
      tenant-id: ${OIDC_TENANT_ID:default}

integration:
  hub:
    public-api:
      enabled: false
      public-id-key: ${INTEGRATION_HUB_PUBLIC_ID_KEY:}
      cursor-ttl-seconds: 300
    external-transport:
      enabled: false
      batch-size: 32
      lease-seconds: 60
      fixed-delay-ms: 1000
      connect-timeout-ms: 3000
      read-timeout-ms: 3000
    provider:
      mode: MOCK
