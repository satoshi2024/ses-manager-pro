# ========================================
# SES Manager Pro - 本番環境プロファイル設定
# `--spring.profiles.active=prod` または `SPRING_PROFILES_ACTIVE=prod` で有効化。
# application.yml の値をこのファイルで上書きする。
# ========================================

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  # 配備決定P-3: 本番のmigrationは全停止中に専用Flyway job（mvn -Pprod-migrate、設定は
  # ops/flyway/flyway-prod.conf）だけが実行し、アプリinstanceは起動時にmigrateしない。
  # enabled=true にしても ProductionSchemaGuardConfiguration がmigrateを拒否して起動を止める。
  # locations は起動時schema guard（ProductionSchemaVersionGuard）がartifactのmigrationを解決する範囲で、
  # jobのflyway.locationsと同じ値に固定する（ProductionFlywayJobConfigurationTestが一致を確認する）。
  flyway:
    enabled: false
    locations: classpath:db/migration,classpath:db/migration-prod

# 実プロバイダ実装は未配線のため、prod は明示設定なしで fail-closed provider を使う。
external-account:
  provider: ${EXTERNAL_ACCOUNT_PROVIDER:none}

integration:
  hub:
    # production enablementは本Decisionで禁止。validatorもtrue/非MOCKを拒否する。
    public-api:
      enabled: false
      public-id-key: ${INTEGRATION_HUB_PUBLIC_ID_KEY:}
      cursor-ttl-seconds: 300
    external-transport:
      enabled: false
      batch-size: 32
      lease-seconds: 60
      fixed-delay-ms: 1000
      connect-timeout-ms: 3000
      read-timeout-ms: 3000
    provider:
      mode: MOCK

# ===== ログ（本番はSQL・パラメータ・パスワードハッシュ等の機密情報を残さない） =====
logging:
  level:
    root: WARN
    com.ses: INFO
    com.baomidou.mybatisplus: WARN
    org.springframework.security: WARN
    # ECS/ALB 排水時のネイティブ Tomcat GracefulShutdown を CloudWatch に残す（カスタム reporter 不要）
    org.springframework.boot.web.embedded.tomcat.GracefulShutdown: INFO

app:
  security:
    require-https: true
    oidc:
      enabled: ${OIDC_ENABLED:true}
      local-login-enabled: ${LOCAL_LOGIN_ENABLED:false}
      break-glass-login-enabled: ${BREAK_GLASS_LOGIN_ENABLED:true}
      require-mfa-assurance: ${OIDC_REQUIRE_MFA_ASSURANCE:true}
      break-glass-usernames: ${BREAK_GLASS_USERNAMES:}
      issuer-uri: ${OIDC_ISSUER_URI:}
      authorization-uri: ${OIDC_AUTHORIZATION_URI:}
      token-uri: ${OIDC_TOKEN_URI:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      user-info-uri: ${OIDC_USER_INFO_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      connect-timeout-millis: ${OIDC_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${OIDC_READ_TIMEOUT_MILLIS:5000}
    mfa:
      enabled: ${MFA_ENABLED:true}
      required-for-break-glass: ${MFA_REQUIRED_FOR_BREAK_GLASS:true}
      current-key-version: ${MFA_CURRENT_KEY_VERSION:v1}
      keyring: {}
      encryption-key: ${MFA_ENCRYPTION_KEY:}
    session:
      enabled: ${PERSISTENT_SESSION_ENABLED:true}
      allow-untracked-sessions: ${ALLOW_UNTRACKED_SESSIONS:false}
      hash-key: ${SESSION_HASH_KEY:}
    # 本番初回起動の期限付きbootstrap mode（既定OFF）。enabled=true には期限（offset付きISO-8601、
    # 現在から24時間以内）が必須で、未設定・期限切れ・24時間超は起動を拒否する。期限を過ぎると再起動しなくても
    # bootstrap login・bootstrap sessionを拒否する。初回bootstrapの完了後（m_system_config:
    # security.bootstrap.completed-at が有る状態）に再び有効化するには、承認済みの変更ticket（reopen-ticket）も必要で、
    # 無ければ起動を拒否する。再開は必須監査 BOOTSTRAP_REOPENED に残る。手順: .kiro/specs/production-launch/deploy-runbook.md §5
    bootstrap:
      enabled: ${SECURITY_BOOTSTRAP_ENABLED:false}
      expires-at: ${SECURITY_BOOTSTRAP_EXPIRES_AT:}
      reopen-ticket: ${SECURITY_BOOTSTRAP_REOPEN_TICKET:}
  # 一括操作 preview token HMAC（未設定は起動 fail-fast）
  batch:
    token-secret: ${BATCH_TOKEN_SECRET:}
  pwa:
    context-secret: ${PWA_CONTEXT_SECRET:}
  # デジタルインボイス（JP PINT / Peppol。sandbox 未取得時は none で fail-closed）
  digital-invoice:
    # prod 既定は mock 禁止。実 AP 配線まで none（FailClosedDigitalInvoiceProvider）。
    provider: ${DIGITAL_INVOICE_PROVIDER:none}
    webhook-hmac-secret: ${DIGITAL_INVOICE_WEBHOOK_HMAC_SECRET:}
  # 機能スイッチ（段階公開）。本番も既定は全てOFF。デプロイ後に1機能ずつ環境変数でONにする（再起動で反映）。
  # 手順: .kiro/specs/production-launch/feature-switches.md
  features:
    nf01:
      enabled: ${FEATURE_NF01_ENABLED:false}
    nf02:
      enabled: ${FEATURE_NF02_ENABLED:false}
    # NF-02の子（顧客ポータルの問い合わせ）。初回リリースはOFF（B-NF02-2）
    nf02-customer-portal:
      enabled: ${FEATURE_NF02_CUSTOMER_PORTAL_ENABLED:false}
      # 未設定ならportal起票の問い合わせだけをportalへ出す（初回リリース中の社内登録分を出さない）
      visible-since: ${FEATURE_NF02_CUSTOMER_PORTAL_VISIBLE_SINCE:}
    nf03:
      enabled: ${FEATURE_NF03_ENABLED:false}
    # NF-03の子（資格番号の入力）。DG-07承認までOFF（B-NF03-1）
    nf03-certification-pii:
      enabled: ${FEATURE_NF03_CERTIFICATION_PII_ENABLED:false}
    nf04:
      enabled: ${FEATURE_NF04_ENABLED:false}
    # NF-06（取込センターAPI）。ONにする場合はapp.import-center.admissionの署名済み承認設定が必須（不備は起動失敗）
    nf06:
      enabled: ${FEATURE_NF06_ENABLED:false}
    nf10:
      enabled: ${FEATURE_NF10_ENABLED:false}

# ===== freee連携（HFP-01） =====
# 本番はFREEE_CLIENT_ID/SECRET/REDIRECT_URI/TOKEN_ENCRYPTION_KEYをsecret storeから供給する。
# redirect-uri はHTTPS固定。URLのHTTPS・公式host検証とclient-id有時の一式検証はコード側(FreeeIntegrationServiceImpl)で実施。
# client-id未設定でも起動は可能（接続状態はMISCONFIGURED、認可開始時に日本語で拒否）。
freee:
  redirect-uri: ${FREEE_REDIRECT_URI:}
