# ========================================
# SES Manager Pro - 本番環境プロファイル設定
# `--spring.profiles.active=prod` または `SPRING_PROFILES_ACTIVE=prod` で有効化。
# application.yml の値をこのファイルで上書きする。
# ========================================

server:
  # 転送ヘッダーの清浄化filterはframeworkのときだけ有効（FWD-SANITIZE）。native/noneは起動時に拒否する。
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

spring:
  # 配備決定P-3: 本番のmigrationは全停止中に専用Flyway job（mvn -Pprod-migrate、設定は
  # ops/flyway/flyway-prod.conf）だけが実行し、アプリinstanceは起動時にmigrateしない。
  # enabled=true にしても ProductionSchemaGuardConfiguration がmigrateを拒否して起動を止める。
  # locations は起動時schema guard（ProductionSchemaVersionGuard）がartifactのmigrationを解決する範囲で、
  # jobのflyway.locationsと同じ値に固定する（ProductionFlywayJobConfigurationTestが一致を確認する）。
  flyway:
    enabled: false
    locations: classpath:db/migration,classpath:db/migration-prod

# 実プロバイダ実装は未配線のため、prod は明示設定なしで fail-closed provider を使う。
external-account:
  provider: ${EXTERNAL_ACCOUNT_PROVIDER:none}

integration:
  hub:
    # 既定は両方向OFF・provider.mode=MOCK（現行DG-05は本番開放を禁止）。開放はinbound/outboundを別々に、
    # 署名済みDG-05決定（DG-05-IN-*/DG-05-OUT-*）と承認値を環境から注入し、方向別validatorを通過した場合だけ。
    # outboundはHTTPS・方向別承認・truststore・再開時隔離の全条件が必要。STUB/LOOPBACKは本番で常に拒否する。
    public-api:
      enabled: false
      public-id-key: ${INTEGRATION_HUB_PUBLIC_ID_KEY:}
      cursor-ttl-seconds: 300
    external-transport:
      enabled: false
      batch-size: 32
      lease-seconds: 60
      fixed-delay-ms: 1000
      connect-timeout-ms: 3000
      read-timeout-ms: 3000
      dns-timeout-ms: 2000
      truststore-path: ${INTEGRATION_HUB_TRUSTSTORE_PATH:}
      truststore-password: ${INTEGRATION_HUB_TRUSTSTORE_PASSWORD:}
      truststore-type: PKCS12
    provider:
      mode: MOCK

# ===== ログ（本番はSQL・パラメータ・パスワードハッシュ等の機密情報を残さない） =====
logging:
  level:
    root: WARN
    com.ses: INFO
    com.baomidou.mybatisplus: WARN
    org.springframework.security: WARN
    # ECS/ALB 排水時のネイティブ Tomcat GracefulShutdown を CloudWatch に残す（カスタム reporter 不要）
    org.springframework.boot.web.embedded.tomcat.GracefulShutdown: INFO
    # HttpClient5のwire/header logは署名・Idempotency-Key・payloadを出すため、障害調査でDEBUGを上げても出さない
    # （NF05 TLS P3-3）。NF08 Copilot送信も同じHttpClient5を使う。
    org.apache.hc.client5.http.wire: "OFF"
    org.apache.hc.client5.http.headers: "OFF"

app:
  security:
    require-https: true
    # ALBのsubnet CIDR（カンマ区切り）。TCP peerがこの範囲のときだけX-Forwarded-For/Proto/Portの右端1要素を使う。
    # 既定値は持たない（未設定なら転送ヘッダーを一切信頼しない）。本番では未設定・IPv4で/16より広い・IPv6で/48より広い指定、
    # private（10/8・172.16/12・192.168/16）とshared（100.64/10）以外のIPv4、IPv6のloopback・未指定・link-local・multicast、
    # host部にbitがあるCIDRを起動時に拒否する（ForwardedHeaderProductionValidator。VPCはRFC 1918または100.64/10で設計する前提。
    # 127.0.0.1は入れない。手順は .kiro/specs/production-launch/forwarded-header-sanitize-notes.md）。
    trusted-proxies: ${TRUSTED_PROXIES:}
    oidc:
      enabled: ${OIDC_ENABLED:true}
      local-login-enabled: ${LOCAL_LOGIN_ENABLED:false}
      break-glass-login-enabled: ${BREAK_GLASS_LOGIN_ENABLED:true}
      require-mfa-assurance: ${OIDC_REQUIRE_MFA_ASSURANCE:true}
      break-glass-usernames: ${BREAK_GLASS_USERNAMES:}
      issuer-uri: ${OIDC_ISSUER_URI:}
      authorization-uri: ${OIDC_AUTHORIZATION_URI:}
      token-uri: ${OIDC_TOKEN_URI:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      user-info-uri: ${OIDC_USER_INFO_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      connect-timeout-millis: ${OIDC_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${OIDC_READ_TIMEOUT_MILLIS:5000}
    mfa:
      enabled: ${MFA_ENABLED:true}
      required-for-break-glass: ${MFA_REQUIRED_FOR_BREAK_GLASS:true}
      current-key-version: ${MFA_CURRENT_KEY_VERSION:v1}
      keyring: {}
      encryption-key: ${MFA_ENCRYPTION_KEY:}
    session:
      enabled: ${PERSISTENT_SESSION_ENABLED:true}
      allow-untracked-sessions: ${ALLOW_UNTRACKED_SESSIONS:false}
      hash-key: ${SESSION_HASH_KEY:}
    # 本番初回起動の期限付きbootstrap mode（既定OFF）。enabled=true には期限（offset付きISO-8601、
    # 現在から24時間以内）が必須で、未設定・期限切れ・24時間超は起動を拒否する。期限を過ぎると再起動しなくても
    # bootstrap login・bootstrap sessionを拒否する。初回bootstrapの完了後（m_system_config:
    # security.bootstrap.completed-at が有る状態）に再び有効化するには、承認済みの変更ticket（reopen-ticket）も必要で、
    # 無ければ起動を拒否する。再開は必須監査 BOOTSTRAP_REOPENED に残る。手順: .kiro/specs/production-launch/deploy-runbook.md §5
    bootstrap:
      enabled: ${SECURITY_BOOTSTRAP_ENABLED:false}
      expires-at: ${SECURITY_BOOTSTRAP_EXPIRES_AT:}
      reopen-ticket: ${SECURITY_BOOTSTRAP_REOPEN_TICKET:}
  # 一括操作 preview token HMAC（未設定は起動 fail-fast）
  batch:
    token-secret: ${BATCH_TOKEN_SECRET:}
  pwa:
    context-secret: ${PWA_CONTEXT_SECRET:}
  # NF-06 preview・error exportの行参照HMAC鍵（開発用の既定値を引き継がない）。
  # 未設定・形式不正・開発用鍵なら NF-06 の開放の条件が成り立たず、NF-06 を開けない・開いていれば閉じる（起動は止めない。FE-B02）。
  import-center:
    row-reference:
      hmac-key: ${IMPORT_ROW_REFERENCE_HMAC_KEY:}
  # デジタルインボイス（JP PINT / Peppol。sandbox 未取得時は none で fail-closed）
  digital-invoice:
    # prod 既定は mock 禁止。実 AP 配線まで none（FailClosedDigitalInvoiceProvider）。
    provider: ${DIGITAL_INVOICE_PROVIDER:none}
    webhook-hmac-secret: ${DIGITAL_INVOICE_WEBHOOK_HMAC_SECRET:}
  # 機能の開放（feature-enablement-console design §3.1）。prod の開閉の源は DB（画面の申請と二人の承認で開く）。prod では database 以外を
  # 起動時に拒否する（FE-A08）。総スイッチ FEATURE_ENABLEMENT_ALLOWED は緊急の閉鎖だけに使う（true/false。既定 true）。
  # 段階 A〜D の間は、目録の DB 管理の印が無い開放単位は下の app.features.* 等の値を返す（go-live は段階 E の後。D-1）。
  feature-enablement:
    source: database
    allowed: ${FEATURE_ENABLEMENT_ALLOWED:true}
  # 機能スイッチ（段階公開）。段階 A で system の中（画面「機能の開放」の申請と二人の承認）で開閉する7件（NF01・NF02・NF02 顧客
  # ポータル・NF03・NF03 資格番号・NF04・NF10。FE-A11）の placeholder はここに置かない。それらの旧い環境変数（FEATURE_NF01_ENABLED 等）
  # を設定すると prod は起動しない（FeatureEnablementProductionValidator）。残りの機能は段階 B〜D で system の中へ移すまで、ここの値で
  # 開閉する（本番も既定は OFF。再起動で反映）。手順: .kiro/specs/production-launch/feature-switches.md
  # 段階 B: NF01 二者確認（FE-B01）も system の中で開閉し、Privacy 署名は画面で登録・確認する（placeholder を置かない。
  # FEATURE_NF01_DUAL_CONFIRMATION_ENABLED・FEATURE_NF01_DUAL_CONFIRMATION_PRIVACY_SIGN_OFF_REF を設定すると起動しない）。
  # 段階 B: NF06（FE-B02）も system の中で開閉し、admission の承認は署名 NF06_ADMISSION として画面で登録・確認する
  # （FEATURE_NF06_ENABLED・IMPORT_ADMISSION_* を設定すると起動しない）。
  # 段階 B: NF02 顧客ポータルの公開範囲（FE-B03）は承認で変える設定（画面「設定」tab の申請と別の管理者の承認）で、
  # FEATURE_NF02_CUSTOMER_PORTAL_VISIBLE_SINCE を設定すると起動しない。未設定ならportal起票の問い合わせだけを出す。
  # 段階 B の後、ここに置く app.features.* の placeholder は無い（NF05・NF07 は各自の property の名前空間）。

# ===== freee連携（HFP-01） =====
# prodの既定はOFF（FREEE_ENABLED=false）。OFFの間は認可の開始・code交換を行わず、client設定が無くても起動する。
# 使う場合だけ FREEE_ENABLED=true にし、FREEE_CLIENT_ID/SECRET/REDIRECT_URI(HTTPS)/TOKEN_ENCRYPTION_KEY の一式を
# secret storeから供給する（欠けると起動しない: FreeeAccountingProvider・FreeeIntegrationServiceImpl）。
# 公式host・HTTPSの検証はONでもOFFでも行う。一覧: .kiro/specs/production-launch/deploy-runbook.md §1.0。
freee:
  enabled: ${FREEE_ENABLED:false}
  redirect-uri: ${FREEE_REDIRECT_URI:}
