# NF08 AI外部送信gateの理由コード（BusinessExceptionのmessage keyとして解決される）
AI_EXTERNAL_SEND_APPROVAL_INCOMPLETE=AIの外部送信は承認設定が揃っていないため利用できません。
AI_EXTERNAL_SEND_PROVIDER_NOT_APPROVED=このAIプロバイダーへの外部送信は承認されていません。
AI_EXTERNAL_SEND_PURPOSE_NOT_APPROVED=この用途でのAI外部送信は承認されていません。
AI_EXTERNAL_SEND_NOT_APPROVED=AIの外部送信は現在承認されていません（承認の失効などによる）。
AI_EXTERNAL_SEND_DECISION_CHANGED=起動後に外部送信の承認内容が変更されました。新しい承認を有効にするには再起動が必要です。
AI_EXTERNAL_SEND_MODEL_NOT_APPROVED=設定されたAIモデルは外部送信の承認対象ではありません。
AI_EXTERNAL_SEND_DESTINATION_NOT_APPROVED=送信先は外部送信の承認対象ではありません。
AI_EXTERNAL_SEND_REQUEST_TOO_LARGE=送信内容が承認された上限サイズを超えています。
AI_EXTERNAL_SEND_REQUEST_COST_LIMIT=1回あたりの費用見積りが承認された上限を超えるため送信しません。
AI_EXTERNAL_SEND_REQUEST_SIZE_UNKNOWN=送信サイズを確認できず費用上限を判定できないため送信しません。
AI_EXTERNAL_SEND_OUTPUT_UNBOUNDED=出力トークンの上限が設定されておらず費用上限を判定できないため送信しません。
AI_EXTERNAL_SEND_COST_OVERFLOW=費用見積りを計算できないため送信しません。
AI_EXTERNAL_SEND_DAILY_COST_LIMIT=本日のAI外部送信の費用上限に達しました。翌日以降に再度お試しください。
AI_EXTERNAL_SEND_MONTHLY_COST_LIMIT=今月のAI外部送信の費用上限に達しました。
AI_EXTERNAL_SEND_AUDIT_UNAVAILABLE=送信の監査記録を保存できないため、AIの外部送信を中止しました。
AI_EXTERNAL_SEND_APPROVAL_DIGEST_MISMATCH=外部送信の承認内容が決定書の記載と一致しないため送信しません。
AI_EXTERNAL_SEND_FIELD_NOT_APPROVED=承認されていない項目が送信内容に含まれているため送信しません。
AI_EXTERNAL_SEND_UNMASKED_PII=送信内容にマスクされていない個人情報が含まれているため送信しません。
AI_EXTERNAL_SEND_UNTRUSTED_NOT_ALLOWED=承認済みAI外部送信では自由文を送信できません。
AI_EXTERNAL_SEND_PAYLOAD_SHAPE_INVALID=AI外部送信のテンプレートまたは項目形式が承認内容と一致しません。
AI_EXTERNAL_SEND_TRANSACTION_ACTIVE=トランザクション内ではAI外部送信を実行できません。
AI_EXTERNAL_SEND_PRIVACY_POLICY_NOT_ACTIVE=AI外部送信の根拠となるプライバシーポリシーが現在有効であることを確認できないため送信しません。
COPILOT_COST_BUDGET_EXCEEDED=費用見積りがこの要求の予算を超えるため送信しません。
COPILOT_COST_BUDGET_REQUIRED=AI処理の費用予算が指定されていないため実行できません。
