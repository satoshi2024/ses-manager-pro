# NF08 AI 외부 전송 게이트 사유 코드(BusinessException 메시지 키로 해석됨)
AI_EXTERNAL_SEND_APPROVAL_INCOMPLETE=승인 설정이 갖춰지지 않아 AI 외부 전송을 사용할 수 없습니다.
AI_EXTERNAL_SEND_PROVIDER_NOT_APPROVED=이 AI 제공자로의 외부 전송은 승인되지 않았습니다.
AI_EXTERNAL_SEND_PURPOSE_NOT_APPROVED=이 용도의 AI 외부 전송은 승인되지 않았습니다.
AI_EXTERNAL_SEND_NOT_APPROVED=AI 외부 전송은 현재 승인되지 않은 상태입니다(승인 만료 등).
AI_EXTERNAL_SEND_DECISION_CHANGED=시작 후 외부 전송 승인 내용이 변경되었습니다. 새 승인을 적용하려면 재시작이 필요합니다.
AI_EXTERNAL_SEND_MODEL_NOT_APPROVED=설정된 AI 모델은 외부 전송 승인 대상이 아닙니다.
AI_EXTERNAL_SEND_DESTINATION_NOT_APPROVED=전송 대상은 외부 전송 승인 대상이 아닙니다.
AI_EXTERNAL_SEND_REQUEST_TOO_LARGE=전송 내용이 승인된 최대 크기를 초과합니다.
AI_EXTERNAL_SEND_REQUEST_COST_LIMIT=1회당 비용 견적이 승인된 상한을 초과하여 전송하지 않습니다.
AI_EXTERNAL_SEND_REQUEST_SIZE_UNKNOWN=전송 크기를 확인할 수 없어 비용 상한을 판정할 수 없으므로 전송하지 않습니다.
AI_EXTERNAL_SEND_OUTPUT_UNBOUNDED=출력 토큰 상한이 설정되지 않아 비용 상한을 판정할 수 없으므로 전송하지 않습니다.
AI_EXTERNAL_SEND_COST_OVERFLOW=비용 견적을 계산할 수 없어 전송하지 않습니다.
AI_EXTERNAL_SEND_DAILY_COST_LIMIT=오늘의 AI 외부 전송 비용 상한에 도달했습니다. 내일 이후에 다시 시도해 주세요.
AI_EXTERNAL_SEND_MONTHLY_COST_LIMIT=이번 달 AI 외부 전송 비용 상한에 도달했습니다.
AI_EXTERNAL_SEND_AUDIT_UNAVAILABLE=전송 감사 기록을 저장할 수 없어 AI 외부 전송을 중지했습니다.
AI_EXTERNAL_SEND_APPROVAL_DIGEST_MISMATCH=외부 전송 승인 내용이 결정서 기재 내용과 일치하지 않아 전송하지 않습니다.
AI_EXTERNAL_SEND_FIELD_NOT_APPROVED=승인되지 않은 항목이 전송 내용에 포함되어 있어 전송하지 않습니다.
AI_EXTERNAL_SEND_UNMASKED_PII=전송 내용에 마스킹되지 않은 개인정보가 포함되어 있어 전송하지 않습니다.
AI_EXTERNAL_SEND_UNTRUSTED_NOT_ALLOWED=승인된 외부 AI 전송에서는 자유 텍스트를 보낼 수 없습니다.
AI_EXTERNAL_SEND_PAYLOAD_SHAPE_INVALID=외부 AI 전송 템플릿 또는 항목 형식이 승인된 계약과 일치하지 않습니다.
AI_EXTERNAL_SEND_TRANSACTION_ACTIVE=데이터베이스 트랜잭션 내에서는 외부 AI 전송을 실행할 수 없습니다.
AI_EXTERNAL_SEND_PRIVACY_POLICY_NOT_ACTIVE=외부 AI 전송의 근거가 되는 개인정보 정책이 현재 유효한지 확인할 수 없어 전송하지 않습니다.
COPILOT_COST_BUDGET_EXCEEDED=비용 견적이 이 요청의 예산을 초과하여 전송하지 않습니다.
COPILOT_COST_BUDGET_REQUIRED=AI 처리의 비용 예산이 지정되지 않아 실행할 수 없습니다.
