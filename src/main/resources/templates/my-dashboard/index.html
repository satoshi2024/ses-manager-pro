<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{my.dashboard.title}">マイダッシュボード</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-light"><i class="bi bi-speedometer2 me-2 text-primary"></i><th:block th:text="#{my.dashboard.title}">マイダッシュボード</th:block></h2>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card bg-card border-dark shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted small text-uppercase" th:text="#{my.dashboard.section.profile}">プロフィール</h6>
                    <h5 class="text-white" id="my-name">&mdash;</h5>
                    <p class="small text-muted mb-0" id="my-badge">&nbsp;</p>
                    <div class="mt-3">
                        <a th:href="@{/my/profile}" class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil me-1"></i><th:block th:text="#{my.dashboard.link.profile}">プロフィール・スキル申請</th:block></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-card border-dark shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted small text-uppercase" th:text="#{my.dashboard.section.work}">勤怠・作業</h6>
                    <ul class="list-unstyled mb-0">
                        <li class="mb-2"><a th:href="@{/my/timesheet}" class="text-decoration-none"><i class="bi bi-person-workspace me-2 text-primary"></i><th:block th:text="#{my.payroll.nav.timesheet}">勤怠・作業報告</th:block></a></li>
                        <li class="mb-2"><a th:href="@{/my/attendance}" class="text-decoration-none"><i class="bi bi-clock me-2 text-primary"></i><th:block th:text="#{my.payroll.nav.attendance}">勤怠入力</th:block></a></li>
                        <li class="mb-2"><a th:href="@{/my/leave}" class="text-decoration-none"><i class="bi bi-calendar-check me-2 text-primary"></i><th:block th:text="#{my.payroll.nav.leave}">休暇申請</th:block></a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-card border-dark shadow-sm h-100">
                <div class="card-body">
                    <h6 class="text-muted small text-uppercase" th:text="#{my.dashboard.section.self}">給与・経費・対話</h6>
                    <ul class="list-unstyled mb-0">
                        <li class="mb-2"><a th:href="@{/my/payroll}" class="text-decoration-none"><i class="bi bi-cash-stack me-2 text-primary"></i><th:block th:text="#{menu.myPayroll}">給与明細</th:block></a></li>
                        <li class="mb-2"><a th:href="@{/my/expenses}" class="text-decoration-none"><i class="bi bi-receipt me-2 text-primary"></i><th:block th:text="#{menu.myExpenses}">経費申請</th:block></a></li>
                        <li class="mb-2"><a th:href="@{/my/one-on-ones}" class="text-decoration-none"><i class="bi bi-chat-dots me-2 text-primary"></i><th:block th:text="#{menu.myOneOnOnes}">1on1</th:block></a></li>
                        <li class="mb-2"><a th:href="@{/my/surveys}" class="text-decoration-none"><i class="bi bi-ui-checks me-2 text-primary"></i><th:block th:text="#{menu.mySurveys}">サーベイ</th:block></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="card bg-card border-dark shadow-sm mb-3">
        <div class="card-body">
            <h6 class="text-muted small text-uppercase" th:text="#{my.dashboard.section.requests}">申請状況</h6>
            <div id="my-request-summary" class="text-muted small"><span th:text="#{my.dashboard.loading}">読み込み中…</span></div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script src="/js/modules/my-dashboard.js" th:src="@{/js/modules/my-dashboard.js}"></script>
</th:block>
</body>
</html>
