<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>法定文書台帳 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-3">
    <!-- ページヘッダー -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0 text-gray-800"><i class="bi bi-journal-check me-2 text-primary"></i>法定文書台帳</h1>
            <p class="text-muted small mb-0">電子帳簿保存法・各種法定要件に準拠した取引・契約文書の検索と保管履歴</p>
        </div>
    </div>

    <!-- 検索フィルターカード -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <h6 class="m-0 font-weight-bold text-primary"><i class="bi bi-funnel me-1"></i>検索条件設定</h6>
        </div>
        <div class="card-body">
            <form id="searchForm" class="row g-3">
                <div class="col-md-3">
                    <label for="searchDocumentType" class="form-label small">文書種別</label>
                    <select class="form-select form-select-sm" id="searchDocumentType" name="documentType">
                        <option value="">すべての種別</option>
                        <option value="CONTRACT">契約書</option>
                        <option value="INVOICE_OUT">請求書 (発行)</option>
                        <option value="INVOICE_IN">請求書 (受領)</option>
                        <option value="PURCHASE_ORDER">発注書</option>
                        <option value="TIMESHEET">作業報告書</option>
                        <option value="QUOTATION">見積書</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="searchCounterpartyName" class="form-label small">取引先名称</label>
                    <input type="text" class="form-control form-control-sm" id="searchCounterpartyName" name="counterpartyName" placeholder="取引先名で検索...">
                </div>
                <div class="col-md-3">
                    <label for="searchStartDate" class="form-label small">取引日 (開始)</label>
                    <input type="date" class="form-control form-control-sm" id="searchStartDate" name="startDate">
                </div>
                <div class="col-md-3">
                    <label for="searchEndDate" class="form-label small">取引日 (終了)</label>
                    <input type="date" class="form-control form-control-sm" id="searchEndDate" name="endDate">
                </div>

                <div class="col-md-3">
                    <label for="searchMinAmount" class="form-label small">最小金額 (円)</label>
                    <input type="number" class="form-control form-control-sm" id="searchMinAmount" name="minAmount" placeholder="0">
                </div>
                <div class="col-md-3">
                    <label for="searchMaxAmount" class="form-label small">最大金額 (円)</label>
                    <input type="number" class="form-control form-control-sm" id="searchMaxAmount" name="maxAmount" placeholder="無制限">
                </div>
                <div class="col-md-3">
                    <label for="searchStatus" class="form-label small">ステータス</label>
                    <select class="form-select form-select-sm" id="searchStatus" name="status">
                        <option value="">すべて</option>
                        <option value="DRAFT">下書き (DRAFT)</option>
                        <option value="CONFIRMED">確定 (CONFIRMED)</option>
                        <option value="AMENDED">訂正済 (AMENDED)</option>
                        <option value="CANCELLED">取消 (CANCELLED)</option>
                        <option value="DISPOSED">廃棄済 (DISPOSED)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="searchLegalHold" class="form-label small">法的ホールド</label>
                    <select class="form-select form-select-sm" id="searchLegalHold" name="legalHoldFlag">
                        <option value="">指定なし</option>
                        <option value="1">ホールド中のみ</option>
                        <option value="0">ホールドなし</option>
                    </select>
                </div>

                <div class="col-12 text-end">
                    <button type="button" class="btn btn-outline-secondary btn-sm me-2" onclick="resetSearch()"><i class="bi bi-x-circle me-1"></i>クリア</button>
                    <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-search me-1"></i>検索実行</button>
                </div>
            </form>
        </div>
    </div>

    <!-- テーブルカード -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="documentTable">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>文書種別</th>
                        <th>文書番号 / タイトル</th>
                        <th>取引先</th>
                        <th>取引日</th>
                        <th>金額</th>
                        <th>状態</th>
                        <th>保存期限</th>
                        <th>法的Hold</th>
                        <th class="text-center">操作</th>
                    </tr>
                    </thead>
                    <tbody id="documentTableBody">
                    <tr>
                        <td colspan="10" class="text-center py-4 text-muted">読み込み中...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
            <span id="paginationInfo" class="small text-muted">全 0 件</span>
            <nav id="paginationNav"></nav>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/document.js}"></script>
</th:block>
</body>
</html>
