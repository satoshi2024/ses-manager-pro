<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>文書詳細 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-3">
    <!-- ヘッダー -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small mb-1">
                    <li class="breadcrumb-item"><a th:href="@{/document/list}">法定文書台帳</a></li>
                    <li class="breadcrumb-item active">文書詳細</li>
                </ol>
            </nav>
            <h1 class="h3 mb-0 text-gray-800" id="docTitleHeader">文書詳細</h1>
        </div>
        <div>
            <button class="btn btn-outline-secondary btn-sm me-2" onclick="history.back()"><i class="bi bi-arrow-left me-1"></i>戻る</button>
            <button class="btn btn-warning btn-sm me-2" id="toggleHoldBtn" onclick="toggleLegalHold()"><i class="bi bi-shield-lock me-1"></i>法的Hold設定</button>
            <button class="btn btn-danger btn-sm" id="requestDisposalBtn" onclick="openDisposalModal()"><i class="bi bi-trash me-1"></i>廃棄申請</button>
        </div>
    </div>

    <input type="hidden" id="documentId" th:value="${documentId}">

    <div class="row g-4">
        <!-- 左側: メタデータカード -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white py-3">
                    <h6 class="m-0 font-weight-bold text-primary"><i class="bi bi-info-circle me-1"></i>基本メタデータ</h6>
                </div>
                <div class="card-body">
                    <table class="table table-borderless table-sm mb-0">
                        <tbody>
                        <tr>
                            <th class="text-muted w-35">文書ID:</th>
                            <td id="detailDocId">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">文書種別:</th>
                            <td id="detailDocType">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">文書番号:</th>
                            <td id="detailDocNo">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">タイトル:</th>
                            <td id="detailTitle">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">取引先:</th>
                            <td id="detailCounterparty">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">取引日:</th>
                            <td id="detailTransactionDate">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">金額:</th>
                            <td id="detailAmount">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">ステータス:</th>
                            <td id="detailStatus">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">保存期限:</th>
                            <td id="detailRetentionUntil">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">法的Hold:</th>
                            <td id="detailLegalHold">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 関連リンクカード -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h6 class="m-0 font-weight-bold text-primary"><i class="bi bi-link-45deg me-1"></i>業務エンティティ紐付け</h6>
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush" id="linkList">
                        <li class="list-group-item text-muted small">紐付け情報がありません</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 右側: バージョン履歴カード -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold text-primary"><i class="bi bi-clock-history me-1"></i>版履歴 (Append-Only)</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>版</th>
                                <th>ファイル名</th>
                                <th>サイズ</th>
                                <th>SHA-256</th>
                                <th>取得経路</th>
                                <th>スキャン</th>
                                <th class="text-center">操作</th>
                            </tr>
                            </thead>
                            <tbody id="versionTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">読み込み中...</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 廃棄申請モーダル -->
<div class="modal fade" id="disposalModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">文書廃棄申請</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted">保存期限が経過した文書の廃棄を申請します。管理者の承認後に物理削除が実行されます。</p>
                <div class="mb-3">
                    <label for="disposalReason" class="form-label">廃棄申請理由</label>
                    <textarea class="form-control" id="disposalReason" rows="3" placeholder="法定保存年数10年経過のため..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn btn-danger btn-sm" onclick="submitDisposalRequest()">申請送信</button>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/document.js}"></script>
</th:block>
</body>
</html>
