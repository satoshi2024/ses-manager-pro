<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{certGap.title}">資格・学習・スキルギャップ</title>
    <style>
        .cert-gap-table th, .cert-gap-table td { white-space: nowrap; }
        .cert-gap-summary { min-width: 180px; }
        @media (max-width: 390px) {
            .cert-gap-actions .btn-label, .cert-gap-table .optional-column { display: none; }
            .cert-gap-table th, .cert-gap-table td { font-size: .78rem; }
            .cert-gap-filter .col-6 { padding-left: .35rem; padding-right: .35rem; }
            .cert-gap-header { align-items: flex-start !important; gap: .5rem; }
            .cert-gap-header h2 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <span sec:authorize="hasAnyRole('管理者','HR')" id="cert-gap-cert-write" class="d-none"></span>
    <span sec:authorize="hasAnyRole('管理者','HR','マネージャー')" id="cert-gap-training-write" class="d-none"></span>
    <div class="d-flex justify-content-between align-items-center mb-4 cert-gap-header">
        <h2 class="h3 mb-0 text-light"><i class="bi bi-mortarboard me-2 text-primary"></i><span th:text="#{certGap.title}">資格・学習・スキルギャップ</span></h2>
        <div class="cert-gap-actions">
            <button type="button" class="btn btn-outline-secondary border-dark text-muted" onclick="exportCertificationLearningGap()">
                <i class="bi bi-filetype-csv me-1"></i><span class="btn-label" th:text="#{certGap.exportCsv}">CSV出力</span>
            </button>
        </div>
    </div>

    <div class="card bg-card border-dark shadow-sm mb-4">
        <div class="card-body">
            <form id="cert-gap-filter" class="row g-3 align-items-end cert-gap-filter" onsubmit="event.preventDefault(); loadCertificationLearningGap(1);">
                <div class="col-6 col-md-2">
                    <label for="cert-gap-name" class="form-label text-muted small" th:text="#{certGap.filter.engineerName}">要員名</label>
                    <input id="cert-gap-name" class="form-control bg-dark border-secondary text-light" type="search" maxlength="100">
                </div>
                <div class="col-6 col-md-2">
                    <label for="cert-gap-status" class="form-label text-muted small" th:text="#{certGap.filter.engineerStatus}">要員状態</label>
                    <select id="cert-gap-status" class="form-select bg-dark border-secondary text-light">
                        <option value="" th:text="#{common.all}">すべて</option><option value="稼動中" th:text="#{enum.engineerStatus.active}">稼動中</option><option value="Bench" th:text="#{enum.engineerStatus.bench}">Bench</option>
                        <option value="提案中" th:text="#{enum.engineerStatus.proposing}">提案中</option><option value="退場予定" th:text="#{enum.engineerStatus.retiring}">退場予定</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="cert-gap-lifecycle" class="form-label text-muted small" th:text="#{certGap.filter.lifecycle}">ライフサイクル</label>
                    <select id="cert-gap-lifecycle" class="form-select bg-dark border-secondary text-light">
                        <option value="" th:text="#{common.all}">すべて</option><option value="ACTIVE" th:text="#{certGap.lifecycle.active}">在籍</option><option value="ON_LEAVE" th:text="#{certGap.lifecycle.onLeave}">休職</option><option value="RESIGNED" th:text="#{certGap.lifecycle.resigned}">退職</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <label for="cert-gap-asof" class="form-label text-muted small" th:text="#{certGap.filter.asOf}">基準日</label>
                    <input id="cert-gap-asof" class="form-control bg-dark border-secondary text-light" type="date">
                </div>
                <div class="col-6 col-md-2">
                    <label for="cert-gap-project" class="form-label text-muted small" th:text="#{certGap.filter.projectId}">案件ID（ギャップ・AI）</label>
                    <input id="cert-gap-project" class="form-control bg-dark border-secondary text-light" type="number" min="1">
                </div>
                <div class="col-6 col-md-2">
                    <label for="cert-gap-demand" class="form-label text-muted small" th:text="#{certGap.filter.demandSource}">需要の出所</label>
                    <select id="cert-gap-demand" class="form-select bg-dark border-secondary text-light">
                        <option value="COMBINED" th:text="#{certGap.demand.combined}">案件＋ポジション</option><option value="PROJECT" th:text="#{certGap.demand.project}">案件</option><option value="POSITION" th:text="#{certGap.demand.position}">ポジション</option>
                    </select>
                </div>
                <div class="col-6 col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-filter me-1"></i><span th:text="#{common.filter}">絞り込み</span></button>
                </div>
            </form>
        </div>
    </div>

    <div class="card bg-card border-dark shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover table-striped mb-0 align-middle cert-gap-table">
                    <thead class="table-dark-header border-bottom border-dark">
                    <tr>
                        <th class="ps-4" th:text="#{certGap.col.engineer}">要員</th><th th:text="#{certGap.col.status}">状態</th><th th:text="#{certGap.filter.lifecycle}">ライフサイクル</th>
                        <th th:text="#{certGap.col.certifications}">資格</th><th th:text="#{certGap.col.trainings}">学習計画</th><th th:text="#{certGap.col.gap}">ギャップ</th><th class="text-end pe-4" th:text="#{common.actions}">操作</th>
                    </tr>
                    </thead>
                    <tbody id="cert-gap-table-body"><tr><td colspan="7" class="text-center text-muted py-4" th:text="#{common.loading}">読み込み中...</td></tr></tbody>
                </table>
            </div>
            <div class="card-footer border-dark bg-transparent py-3 d-flex justify-content-between align-items-center">
                <div id="cert-gap-page-info" class="text-muted small ps-2"></div>
                <nav th:aria-label="#{certGap.pagination}" aria-label="ページ移動"><ul id="cert-gap-pagination" class="pagination pagination-sm mb-0 pe-2"></ul></nav>
            </div>
        </div>
    </div>

    <div class="modal fade" id="cert-gap-detail-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content bg-card border-dark">
            <div class="modal-header border-dark"><h5 id="cert-gap-detail-title" class="modal-title text-light" th:text="#{common.detail}">詳細</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" th:aria-label="#{common.close}" aria-label="閉じる"></button></div>
    <div id="cert-gap-detail-body" class="modal-body text-light"></div>
        </div></div>
    </div>

    <div sec:authorize="hasAnyRole('管理者','HR')" id="cert-gap-catalog-panel" class="row g-3 mt-1">
        <div class="col-12 col-xl-6">
            <div class="card bg-card border-dark shadow-sm">
                <div class="card-header border-dark text-light d-flex justify-content-between align-items-center"><span th:text="#{certGap.master.title}">資格マスタ</span><button type="button" class="btn btn-sm btn-outline-primary" onclick="openCertificationMasterForm()" th:text="#{certGap.new}">新規登録</button></div>
                <div class="table-responsive"><table class="table table-dark table-sm mb-0"><thead><tr><th th:text="#{certGap.master.name}">資格名</th><th th:text="#{certGap.master.issuer}">発行元</th><th th:text="#{certGap.master.expiry}">期限</th><th th:text="#{certGap.col.status}">状態</th><th></th></tr></thead><tbody id="cert-gap-master-body"></tbody></table></div>
            </div>
        </div>
        <div class="col-12 col-xl-6">
            <div class="card bg-card border-dark shadow-sm">
                <div class="card-header border-dark text-light d-flex justify-content-between align-items-center"><span th:text="#{certGap.course.title}">研修コースカタログ</span><button type="button" class="btn btn-sm btn-outline-primary" onclick="openTrainingCourseForm()" th:text="#{certGap.new}">新規登録</button></div>
                <div class="table-responsive"><table class="table table-dark table-sm mb-0"><thead><tr><th th:text="#{certGap.col.course}">コース</th><th th:text="#{certGap.course.provider}">提供元</th><th th:text="#{certGap.course.cost}">費用</th><th th:text="#{certGap.course.skills}">対象スキル</th><th></th></tr></thead><tbody id="cert-gap-course-body"></tbody></table></div>
            </div>
        </div>
    </div>

    <div sec:authorize="hasAnyRole('管理者','HR')" class="modal fade" id="cert-gap-master-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content bg-card border-dark"><div class="modal-header border-dark"><h5 class="modal-title text-light" th:text="#{certGap.master.title}">資格マスタ</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" th:aria-label="#{common.close}" aria-label="閉じる"></button></div><div class="modal-body"><input id="cert-gap-master-id" type="hidden"><input id="cert-gap-master-name" class="form-control mb-2" th:placeholder="#{certGap.master.name}" placeholder="資格名" required><input id="cert-gap-master-issuer" class="form-control mb-2" th:placeholder="#{certGap.master.issuer}" placeholder="発行元"><input id="cert-gap-master-code" class="form-control mb-2" th:placeholder="#{certGap.master.externalCode}" placeholder="外部資格コード"><select id="cert-gap-master-expiry-type" class="form-select mb-2"><option value="NONE" th:text="#{certGap.master.expiryNone}">期限なし</option><option value="FIXED_MONTHS" th:text="#{certGap.master.expiryFixedMonths}">取得日から月数</option></select><input id="cert-gap-master-expiry-months" class="form-control mb-2" type="number" min="1" th:placeholder="#{certGap.master.expiryMonths}" placeholder="期限月数"><input id="cert-gap-master-rule-version" class="form-control mb-2" type="number" min="1" value="1" th:placeholder="#{certGap.master.ruleVersion}" placeholder="規則バージョン"><select id="cert-gap-master-active" class="form-select"><option value="1" th:text="#{certGap.active}">有効</option><option value="0" th:text="#{certGap.inactive}">無効</option></select></div><div class="modal-footer"><button type="button" class="btn btn-primary" onclick="saveCertificationMaster()" th:text="#{common.save}">保存</button></div></div></div></div>
    <div sec:authorize="hasAnyRole('管理者','HR')" class="modal fade" id="cert-gap-course-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg"><div class="modal-content bg-card border-dark"><div class="modal-header border-dark"><h5 class="modal-title text-light" th:text="#{certGap.course.title}">研修コースカタログ</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" th:aria-label="#{common.close}" aria-label="閉じる"></button></div><div class="modal-body"><input id="cert-gap-course-id" type="hidden"><div class="row g-2"><div class="col-md-6"><input id="cert-gap-course-name" class="form-control" th:placeholder="#{certGap.course.name}" placeholder="コース名" required></div><div class="col-md-6"><input id="cert-gap-course-provider" class="form-control" th:placeholder="#{certGap.course.provider}" placeholder="提供元" required></div><div class="col-md-4"><input id="cert-gap-course-cost" class="form-control" type="number" min="0" step="1" th:placeholder="#{certGap.course.costPlaceholder}" placeholder="税込費用（円）" required></div><div class="col-md-4"><input id="cert-gap-course-period" class="form-control" type="number" min="0" th:placeholder="#{certGap.course.periodDays}" placeholder="期間（日）"></div><div class="col-md-4"><input id="cert-gap-course-capacity" class="form-control" type="number" min="0" th:placeholder="#{certGap.course.capacity}" placeholder="定員"></div></div><textarea id="cert-gap-course-description" class="form-control my-2" th:placeholder="#{certGap.course.description}" placeholder="説明"></textarea><label for="cert-gap-course-skills" class="form-label text-muted small" th:text="#{certGap.course.skillsLabel}">対象スキル（複数選択）</label><select id="cert-gap-course-skills" class="form-select" multiple size="8"></select></div><div class="modal-footer"><button type="button" class="btn btn-primary" onclick="saveTrainingCourse()" th:text="#{common.save}">保存</button></div></div></div></div>
</div>
<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/certification-learning-skill-gap.js}"></script>
</th:block>
</body>
</html>
