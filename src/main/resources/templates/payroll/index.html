<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>給与情報</title></head>
<body>
<div layout:fragment="content" class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">給与情報</h1>
  </div>

  <!-- 接続状態 -->
  <section class="card mb-3" role="region" aria-label="freee接続状態">
    <div class="card-body">
      <h2 class="h6">freee接続</h2>
      <div id="payrollStatus" class="d-flex flex-wrap align-items-center gap-2"
           aria-live="polite" aria-atomic="true">
        <span class="badge bg-secondary" id="statusBadge">確認中...</span>
        <span id="companyName" class="fw-bold"></span>
        <span id="statusAction" class="text-muted small"></span>
      </div>
      <div class="mt-2 d-flex flex-wrap gap-2"
           th:if="${#authorization.expression('hasRole(''管理者'')')}">
        <button type="button" class="btn btn-primary btn-sm" id="connectBtn" hidden>接続</button>
        <button type="button" class="btn btn-warning btn-sm" id="reconnectBtn" hidden>再接続</button>
        <button type="button" class="btn btn-outline-danger btn-sm" id="disconnectBtn" hidden>接続解除</button>
      </div>
    </div>
  </section>

  <!-- 対応付け -->
  <section class="card mb-3" role="region" aria-label="freee従業員と内部要員の対応付け">
    <div class="card-body">
      <h2 class="h6">従業員対応付け</h2>
      <form id="linkForm" class="row g-2 align-items-end mb-2">
        <div class="col-12 col-md-4">
          <label for="linkEngineerId" class="form-label">内部要員</label>
          <select id="linkEngineerId" class="form-select" required>
            <option value="">選択してください</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label for="linkEmployeeId" class="form-label">freee従業員</label>
          <select id="linkEmployeeId" class="form-select" required>
            <option value="">選択してください</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <button type="submit" class="btn btn-primary">対応付け</button>
          <button type="button" class="btn btn-outline-danger" id="unlinkBtn">対応付け解除</button>
        </div>
      </form>
      <div id="payrollEmployees" class="table-responsive" aria-live="polite" aria-atomic="true"></div>
    </div>
  </section>

  <!-- 給与・賞与明細 -->
  <section class="card" role="region" aria-label="給与明細照会">
    <div class="card-body">
      <h2 class="h6">給与・賞与明細</h2>
      <form id="statementForm" class="row g-2 align-items-end">
        <div class="col-6 col-md-2">
          <label for="statementYear" class="form-label">年</label>
          <input id="statementYear" class="form-control" type="number" min="2000" max="2100" required>
        </div>
        <div class="col-6 col-md-2">
          <label for="statementMonth" class="form-label">月</label>
          <input id="statementMonth" class="form-control" type="number" min="1" max="12" required>
        </div>
        <div class="col-6 col-md-3">
          <label for="statementType" class="form-label">種別</label>
          <select id="statementType" class="form-select">
            <option value="salary">給与</option>
            <option value="bonus">賞与</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <button type="submit" class="btn btn-primary" id="statementFetchBtn">取得</button>
        </div>
      </form>
      <div id="statementMessage" class="mt-2 small" aria-live="polite"></div>
      <div id="payrollStatements" class="table-responsive mt-2" aria-live="polite" aria-atomic="true"></div>
    </div>
  </section>

  <!-- 明細modal -->
  <div class="modal fade" id="statementDetailModal" tabindex="-1"
       aria-labelledby="statementDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="statementDetailModalLabel">明細</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
        </div>
        <div class="modal-body" id="statementDetailBody"></div>
      </div>
    </div>
  </div>
</div>

<th:block layout:fragment="page-js">
<script th:src="@{/js/modules/payroll.js}"></script>
</th:block>
</body>
</html>
