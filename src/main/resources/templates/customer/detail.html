<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{customer.detail} + ' - ' + #{app.name}">顧客詳細 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-light">
            <a href="/customer/list" class="text-decoration-none text-muted me-2 hover-text-info"><i class="bi bi-arrow-left"></i></a>
            <i class="bi bi-building me-2 text-info"></i><span id="header-company-name" th:text="#{customer.detail}">顧客詳細</span>
        </h2>
        <button class="btn btn-info text-white shadow-sm" data-bs-toggle="modal" data-bs-target="#activityModal">
            <i class="bi bi-plus-lg me-1"></i><th:block th:text="#{customer.activity.add}">活動記録を追加</th:block>
        </button>
    </div>

    <div class="row mb-4 g-4">
        <!-- 基本情報カード -->
        <div class="col-md-5">
            <div class="card bg-card border-dark shadow-sm h-100">
                <div class="card-header border-dark bg-dark">
                    <h5 class="mb-0 text-light"><i class="bi bi-info-circle me-2"></i><th:block th:text="#{common.basicInfo}">基本情報</th:block></h5>
                </div>
                <div class="card-body text-light">
                    <table class="table table-borderless table-dark table-sm mb-0">
                        <tbody>
                            <tr><th style="width: 120px;" class="text-muted" th:text="#{customer.companyName}">会社名</th><td id="info-companyName">-</td></tr>
                            <tr><th class="text-muted" th:text="#{customer.address}">住所</th><td id="info-address">-</td></tr>
                            <tr><th class="text-muted" th:text="#{customer.commercialFlow}">商流</th><td id="info-commercialFlow">-</td></tr>
                            <tr><th class="text-muted" th:text="#{customer.trustLevel}">信頼度</th><td id="info-trustLevel">-</td></tr>
                            <tr><th class="text-muted" th:text="#{customer.contactPerson}">担当者</th><td id="info-contactPerson">-</td></tr>
                            <tr><th class="text-muted" th:text="#{customer.contactPhone}">電話番号</th><td id="info-contactPhone">-</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- KPI サマリ -->
        <div class="col-md-7">
            <div class="card bg-card border-dark shadow-sm h-100">
                <div class="card-header border-dark bg-dark">
                    <h5 class="mb-0 text-light"><i class="bi bi-bar-chart me-2"></i><th:block th:text="#{customer.performanceSummary}">実績サマリ</th:block></h5>
                </div>
                <div class="card-body">
                    <div class="row text-center g-3">
                        <div class="col-sm-3">
                            <div class="p-3 bg-dark rounded border border-secondary h-100">
                                <div class="text-muted small mb-1" th:text="#{customer.kpi.projectCount}">案件数</div>
                                <div class="fs-4 text-light fw-bold" id="kpi-projectCount">-</div>
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="p-3 bg-dark rounded border border-secondary h-100">
                                <div class="text-muted small mb-1" th:text="#{customer.kpi.proposalCount}">提案数</div>
                                <div class="fs-4 text-light fw-bold" id="kpi-proposalCount">-</div>
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="p-3 bg-dark rounded border border-secondary h-100">
                                <div class="text-muted small mb-1" th:text="#{customer.kpi.winRate}">成約率</div>
                                <div class="fs-4 text-info fw-bold" id="kpi-winRate">-</div>
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="p-3 bg-dark rounded border border-secondary h-100">
                                <div class="text-muted small mb-1" th:text="#{customer.kpi.activeContractCount}">稼動中契約</div>
                                <div class="fs-4 text-success fw-bold" id="kpi-activeContractCount">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 顧客担当者・関連商機（連絡先は新contactテーブルを正とする） -->
    <div class="row g-4 mb-4">
        <div class="col-lg-7">
            <div class="card bg-card border-dark shadow-sm h-100">
                <div class="card-header border-dark bg-dark d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-light"><i class="bi bi-person-lines-fill me-2"></i><th:block th:text="#{customer.contacts.title}">顧客担当者</th:block></h5>
                    <div><button class="btn btn-sm btn-info me-1" type="button" onclick="openContactModal()"><i class="bi bi-plus-lg me-1"></i><th:block th:text="#{customer.contacts.add}">担当者追加</th:block></button><a class="btn btn-sm btn-outline-info" id="contact-export" href="#"><i class="bi bi-download me-1"></i><th:block th:text="#{customer.contacts.export}">CSV出力</th:block></a></div>
                </div>
                <div class="table-responsive">
                    <table class="table table-dark table-sm table-hover mb-0" id="customer-contact-table">
                        <thead><tr><th th:text="#{customer.contacts.name}">氏名</th><th th:text="#{customer.contacts.department}">部署・役職</th><th th:text="#{customer.contacts.email}">メール</th><th th:text="#{customer.contacts.status}">状態</th><th></th></tr></thead>
                        <tbody><tr><td colspan="4" class="text-center text-muted py-3" th:text="#{common.loading}">読み込み中...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card bg-card border-dark shadow-sm h-100">
                <div class="card-header border-dark bg-dark"><h5 class="mb-0 text-light"><i class="bi bi-kanban me-2"></i><th:block th:text="#{customer.opportunities.title}">関連商機</th:block></h5></div>
                <div class="card-body" id="customer-opportunity-list"><div class="text-muted" th:text="#{common.loading}">読み込み中...</div></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content bg-card text-light border-dark">
            <div class="modal-header border-dark"><h5 class="modal-title" th:text="#{customer.contacts.form.title}">担当者</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><form id="contact-form"><input type="hidden" id="contact-id"><input type="hidden" id="contact-version">
                <div class="row g-3"><div class="col-md-6"><label class="form-label" th:text="#{customer.contacts.name}">氏名</label><input id="contact-name" class="form-control bg-dark text-light border-secondary" required></div><div class="col-md-6"><label class="form-label" th:text="#{customer.contacts.nameKana}">氏名カナ</label><input id="contact-name-kana" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-6"><label class="form-label" th:text="#{customer.contacts.department}">部署</label><input id="contact-department" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-6"><label class="form-label" th:text="#{customer.contacts.position}">役職</label><input id="contact-position" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-8"><label class="form-label" th:text="#{customer.contacts.roles}">役割</label><div id="contact-roles" class="d-flex flex-wrap gap-3 pt-2"><label class="form-check"><input class="form-check-input" type="checkbox" value="決裁者"><span class="form-check-label">決裁者</span></label><label class="form-check"><input class="form-check-input" type="checkbox" value="現場"><span class="form-check-label">現場</span></label><label class="form-check"><input class="form-check-input" type="checkbox" value="調達"><span class="form-check-label">調達</span></label><label class="form-check"><input class="form-check-input" type="checkbox" value="請求"><span class="form-check-label">請求</span></label><label class="form-check"><input class="form-check-input" type="checkbox" value="契約"><span class="form-check-label">契約</span></label></div></div><div class="col-md-4"><label class="form-label" th:text="#{customer.contacts.email}">メール</label><input id="contact-email" type="email" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-6"><label class="form-label" th:text="#{customer.contacts.phone}">電話</label><input id="contact-phone" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-4"><label class="form-label" th:text="#{customer.contacts.validFrom}">有効開始日</label><input id="contact-valid-from" type="date" class="form-control bg-dark text-light border-secondary" required></div><div class="col-md-4"><label class="form-label" th:text="#{customer.contacts.validTo}">有効終了日</label><input id="contact-valid-to" type="date" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-4 form-check mt-5 ms-2"><input id="contact-primary" type="checkbox" class="form-check-input"><label class="form-check-label" for="contact-primary" th:text="#{customer.contacts.primary}">主担当</label></div></div>
            </form></div><div class="modal-footer border-dark"><button class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">キャンセル</button><button class="btn btn-info" onclick="saveContact()" th:text="#{common.save}">保存</button></div>
        </div></div>
    </div>

    <!-- 活動タイムライン -->
    <div class="card bg-card border-dark shadow-sm">
        <div class="card-header border-dark bg-dark d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-light"><i class="bi bi-clock-history me-2"></i><th:block th:text="#{customer.activity.timeline}">活動タイムライン</th:block></h5>
        </div>
        <div class="card-body" id="timeline-container">
            <!-- Timeline items injected by JS -->
        </div>
        <!-- ページネーション -->
        <div class="card-footer border-dark bg-transparent py-3 d-flex justify-content-between align-items-center" id="activity-pagination">
        </div>
    </div>

    <!-- Activity Modal -->
    <div class="modal fade" id="activityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-card border-dark shadow-lg">
                <div class="modal-header border-dark bg-dark">
                    <h5 class="modal-title text-white fw-bold"><i class="bi bi-pencil-square me-2 text-info"></i><th:block th:text="#{customer.activity.record}">活動記録</th:block></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="activity-form">
                        <input type="hidden" id="act-id">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small"><th:block th:text="#{customer.activity.date}">活動日</th:block> <span class="text-danger">*</span></label>
                                <input type="date" id="act-date" class="form-control form-control-dark bg-secondary text-white border-dark" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small"><th:block th:text="#{customer.activity.type}">活動種別</th:block> <span class="text-danger">*</span></label>
                                <select id="act-type" class="form-select form-select-dark bg-secondary text-white border-dark" required>
                                    <option value="商談" th:text="#{customer.activity.type.meeting}">商談</option>
                                    <option value="訪問" th:text="#{customer.activity.type.visit}">訪問</option>
                                    <option value="電話" th:text="#{customer.activity.type.phone}">電話</option>
                                    <option value="メール" th:text="#{customer.activity.type.email}">メール</option>
                                    <option value="その他" th:text="#{customer.activity.type.other}">その他</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small"><th:block th:text="#{customer.activity.title}">タイトル</th:block> <span class="text-danger">*</span></label>
                            <input type="text" id="act-title" class="form-control form-control-dark bg-secondary text-white border-dark" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small" th:text="#{customer.activity.content}">内容</label>
                            <textarea id="act-content" class="form-control form-control-dark bg-secondary text-white border-dark" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small" th:text="#{customer.activity.nextDate}">次回アクション予定日</label>
                            <input type="date" id="act-next-date" class="form-control form-control-dark bg-secondary text-white border-dark">
                        </div>
                        <div class="row g-2">
                            <div class="col-md-4"><label class="form-label text-muted small" th:text="#{customer.contacts.name}">担当者</label><select id="act-contact" class="form-select bg-secondary text-white border-dark"><option value="">-</option></select></div>
                            <div class="col-md-4"><label class="form-label text-muted small" th:text="#{crm.opportunity.name}">商機</label><select id="act-opportunity" class="form-select bg-secondary text-white border-dark"><option value="">-</option></select></div>
                            <div class="col-md-4"><label class="form-label text-muted small" th:text="#{crm.opportunity.owner}">担当営業</label><select id="act-assignee" class="form-select bg-secondary text-white border-dark"><option value="">-</option></select></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-dark bg-dark">
                    <button type="button" class="btn btn-outline-secondary text-muted hover-text-white border-dark" data-bs-dismiss="modal" th:text="#{common.cancel}">キャンセル</button>
                    <button type="button" class="btn btn-info text-white border-0 shadow-sm px-4" onclick="saveActivity()">
                        <i class="bi bi-check-lg me-1"></i><th:block th:text="#{common.save}">保存</th:block>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/customer-detail.js}"></script>
    <script>
        document.getElementById('activityModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('activity-form').reset();
            document.getElementById('act-id').value = '';
            document.getElementById('act-date').value = SES.util.getLocalDateString();
        });
        document.getElementById('activityModal').addEventListener('show.bs.modal', function () {
            if (!document.getElementById('act-id').value) {
                document.getElementById('act-date').value = SES.util.getLocalDateString();
            }
        });
    </script>
</th:block>
</body>
</html>
