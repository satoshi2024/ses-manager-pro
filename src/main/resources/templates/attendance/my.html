<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{attendance.my.title}">雇用勤怠入力</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
                <div>
                    <label for="attendanceMonth" class="form-label" th:text="#{attendance.month}">対象月</label>
                    <input id="attendanceMonth" type="month" class="form-control">
                </div>
                <button id="attendanceSubmit" type="button" class="btn btn-primary" th:text="#{attendance.submit}">提出</button>
            </div>
            <div id="attendanceState" class="mb-3" aria-live="polite"></div>
            <div id="attendanceError" class="alert alert-danger d-none" role="alert"></div>
            <div class="table-responsive">
                <table class="table table-sm align-middle" id="attendanceDayTable">
                    <thead><tr>
                        <th th:text="#{attendance.date}">日付</th>
                        <th th:text="#{attendance.clockIn}">出勤</th>
                        <th th:text="#{attendance.clockOut}">退勤</th>
                        <th th:text="#{attendance.breakMinutes}">休憩(分)</th>
                        <th th:text="#{attendance.workType}">勤務区分</th>
                        <th th:text="#{attendance.actions}">操作</th>
                    </tr></thead>
                    <tbody id="attendanceDayBody"></tbody>
                </table>
            </div>
            <div class="border-top pt-3 mt-3">
                <h6 th:text="#{attendance.addDay}">日次勤怠を追加/更新</h6>
                <form id="attendanceDayForm" class="row g-2 align-items-end">
                    <div class="col-12 col-md-2"><label class="form-label" for="attendanceDate" th:text="#{attendance.date}">日付</label><input id="attendanceDate" type="date" class="form-control" required></div>
                    <div class="col-6 col-md-2"><label class="form-label" for="attendanceClockIn" th:text="#{attendance.clockIn}">出勤</label><input id="attendanceClockIn" type="time" class="form-control"></div>
                    <div class="col-6 col-md-2"><label class="form-label" for="attendanceClockOut" th:text="#{attendance.clockOut}">退勤</label><input id="attendanceClockOut" type="time" class="form-control"></div>
                    <div class="col-6 col-md-2"><label class="form-label" for="attendanceBreak" th:text="#{attendance.breakMinutes}">休憩(分)</label><input id="attendanceBreak" type="number" min="0" value="0" class="form-control"></div>
                    <div class="col-6 col-md-2"><label class="form-label" for="attendanceWorkType" th:text="#{attendance.workType}">勤務区分</label><select id="attendanceWorkType" class="form-select"><option value="通常" th:text="#{attendance.workType.normal}">通常</option><option value="所定休日" th:text="#{attendance.workType.scheduledHoliday}">所定休日</option><option value="法定休日" th:text="#{attendance.workType.legalHoliday}">法定休日</option></select></div>
                    <div class="col-12 col-md-2"><button type="submit" class="btn btn-success w-100" th:text="#{attendance.save}">保存</button></div>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="page-js"><script src="/js/modules/attendance-my.js"></script></th:block>
</body>
</html>
