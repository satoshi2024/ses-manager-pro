<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{attendance.management.title}">雇用勤怠管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2 align-items-end mb-3">
                <div><label for="managementMonth" class="form-label" th:text="#{attendance.month}">対象月</label><input id="managementMonth" type="month" class="form-control"></div>
                <button id="managementReload" class="btn btn-secondary" type="button" th:text="#{common.btn.search}">検索</button>
            </div>
            <div id="managementError" class="alert alert-danger d-none" role="alert"></div>
            <div class="table-responsive">
                <table class="table table-sm align-middle" id="attendanceManagementTable">
                    <thead><tr><th th:text="#{attendance.engineer}">要員</th><th th:text="#{attendance.status}">状態</th><th th:text="#{attendance.totalMinutes}">実働(分)</th><th th:text="#{attendance.actions}">操作</th></tr></thead>
                    <tbody id="attendanceManagementBody"></tbody>
                </table>
            </div>
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2">
                <div id="attendanceManagementPageInfo" class="text-muted small"></div>
                <div class="btn-group btn-group-sm">
                    <button type="button" class="btn btn-outline-secondary" id="attendanceManagementPrev" th:text="#{common.page.prev}">前へ</button>
                    <button type="button" class="btn btn-outline-secondary" id="attendanceManagementNext" th:text="#{common.page.next}">次へ</button>
                </div>
            </div>
        </div>
    </div>
    <!-- T072: freee/provider同期（承認/締め済みの冪等送信とread-only照合） -->
    <div class="card mt-3" th:if="${attendanceMode == 'management'}">
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                <h2 class="h6 mb-0" th:text="#{attendance.sync.title}">外部勤怠同期</h2>
                <span id="attendanceSyncProvider" class="badge text-bg-secondary"></span>
            </div>
            <div id="attendanceSyncError" class="alert alert-danger d-none" role="alert"></div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <label class="form-label mb-0" for="syncMonth" th:text="#{attendance.month}">対象月</label>
                <input id="syncMonth" type="month" class="form-control" style="max-width: 12rem">
                <button id="syncRunPush" type="button" class="btn btn-primary btn-sm"
                        th:if="${canSync}" th:text="#{attendance.sync.push}">送信</button>
                <button id="syncRunPull" type="button" class="btn btn-primary btn-sm"
                        th:if="${canSync}" th:text="#{attendance.sync.pull}">照合取得</button>
                <a id="syncExportCsv" class="btn btn-outline-secondary btn-sm"
                   href="#" th:text="#{attendance.sync.exportCsv}">CSV出力</a>
            </div>
            <div id="attendanceSyncResult" class="mt-3 small" aria-live="polite"></div>
        </div>
    </div>
    <!-- T073: 客先工数差異（read-only比較・理由確認。請求金額は変わらない） -->
    <div class="card mt-3">
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                <h2 class="h6 mb-0" th:text="#{attendance.discrepancy.title}">客先工数差異</h2>
                <span class="badge text-bg-secondary" th:text="#{attendance.discrepancy.readOnly}">read-only</span>
            </div>
            <div id="attendanceDiscrepancyError" class="alert alert-danger d-none" role="alert"></div>
            <div class="table-responsive">
                <table class="table table-sm align-middle" id="attendanceDiscrepancyTable">
                    <thead><tr>
                        <th th:text="#{attendance.engineer}">要員</th>
                        <th class="text-end" th:text="#{attendance.discrepancy.attendanceMinutes}">雇用勤怠(分)</th>
                        <th class="text-end" th:text="#{attendance.discrepancy.contractMinutes}">契約工数(分)</th>
                        <th class="text-end" th:text="#{attendance.discrepancy.diffMinutes}">差異(分)</th>
                        <th th:text="#{attendance.discrepancy.status}">状態</th>
                        <th th:text="#{attendance.discrepancy.reason}">確認理由</th>
                        <th th:text="#{attendance.actions}">操作</th>
                    </tr></thead>
                    <tbody id="attendanceDiscrepancyBody"></tbody>
                </table>
            </div>
            <div id="attendanceDiscrepancyHint" class="small text-muted" th:text="#{attendance.discrepancy.hint}"></div>
        </div>
    </div>
</div>
<div id="attendanceRoleFlags" class="d-none" th:data-can-approve="${canApprove}" th:data-can-close="${canClose}" th:data-can-reopen="${canReopen}" th:data-can-sync="${canSync}"></div>
<th:block layout:fragment="page-js"><script src="/js/modules/attendance-management.js"></script></th:block>
</body>
</html>
