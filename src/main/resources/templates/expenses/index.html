<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{expense.title}">経費管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-light"><i class="bi bi-receipt-cutoff me-2 text-primary"></i><th:block th:text="#{expense.title}">経費管理</th:block></h2>
    </div>

    <!-- 検索フィルター -->
    <div class="card bg-card border-dark shadow-sm mb-4">
        <div class="card-body">
            <form id="searchForm" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="searchEngineerName" class="form-label text-muted small" th:text="#{expense.engineerName}">要員名</label>
                    <input type="text" class="form-control bg-dark border-secondary text-light" id="searchEngineerName" th:placeholder="#{expense.engineerName.placeholder}">
                </div>
                <div class="col-md-3">
                    <label for="searchStatus" class="form-label text-muted small" th:text="#{common.status}">状態</label>
                    <select class="form-select bg-dark border-secondary text-light" id="searchStatus">
                        <option value="" th:text="#{common.all}">すべて</option>
                        <option value="下書き" th:text="#{expense.status.draft}">下書き</option>
                        <option value="申請中" th:text="#{expense.status.applied}">申請中</option>
                        <option value="承認済" th:text="#{expense.status.approved}">承認済</option>
                        <option value="会計連携済" th:text="#{expense.status.accountingSent}">会計連携済</option>
                        <option value="支払済" th:text="#{expense.status.paid}">支払済</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="bi bi-filter me-1"></i><th:block th:text="#{common.filter}">絞り込み</th:block>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 一覧 -->
    <div class="card bg-card border-dark shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark-header border-bottom border-dark">
                        <tr>
                            <th scope="col" class="ps-4" th:text="#{expense.no}">経費番号</th>
                            <th scope="col" th:text="#{expense.engineerName}">要員名</th>
                            <th scope="col" th:text="#{expense.date}">発生日</th>
                            <th scope="col" th:text="#{expense.category}">科目</th>
                            <th scope="col" class="text-end" th:text="#{expense.amount}">金額(円)</th>
                            <th scope="col" th:text="#{expense.receipt}">領収書</th>
                            <th scope="col" th:text="#{common.status}">状態</th>
                            <th scope="col" class="text-end pe-4" th:text="#{common.actions}">操作</th>
                        </tr>
                    </thead>
                    <tbody id="expense-table-body">
                        <!-- JS will populate results here -->
                    </tbody>
                </table>
            </div>
            <div class="card-footer border-dark bg-transparent py-3 d-flex justify-content-between align-items-center">
                <div class="text-muted small ps-2" id="expense-page-info">-</div>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0 pe-2" id="expense-pagination"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script src="/js/modules/expense-management.js"></script>
</th:block>
</body>
</html>
