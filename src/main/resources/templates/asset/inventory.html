<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>資産棚卸し管理 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid p-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0 text-white"><i class="bi bi-clipboard-check me-2"></i>資産棚卸し管理</h4>
            <p class="text-muted small mb-0">現物確認・理論在庫差異照合・棚卸しスナップショット固定</p>
        </div>
        <button class="btn btn-primary btn-sm" id="btnOpenStartModal">
            <i class="bi bi-plus-lg me-1"></i>新規棚卸し計画開始
        </button>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs mb-4 border-secondary">
        <li class="nav-item">
            <a class="nav-link text-secondary" href="/asset/list">
                <i class="bi bi-pc-display me-1"></i>資産台帳
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link active fw-bold text-white bg-tertiary" href="/asset/inventory">
                <i class="bi bi-clipboard-check me-1"></i>棚卸し管理
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-secondary" href="/asset/accounts">
                <i class="bi bi-shield-lock me-1"></i>外部アカウント・ライセンス
            </a>
        </li>
    </ul>

    <!-- 棚卸し実施履歴カード -->
    <div class="card bg-secondary border-secondary mb-4">
        <div class="card-header border-secondary d-flex justify-content-between align-items-center">
            <span class="fw-bold">棚卸し実施履歴</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 align-middle">
                    <thead class="table-dark text-secondary small">
                        <tr>
                            <th>棚卸しコード</th>
                            <th>名称</th>
                            <th>基準日</th>
                            <th>ステータス</th>
                            <th>総資産数</th>
                            <th>一致</th>
                            <th>差異</th>
                            <th>所在不明</th>
                            <th>完了日時</th>
                            <th class="text-end">操作</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryRunTableBody">
                        <tr><td colspan="10" class="text-center py-4 text-muted">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 棚卸し実地照合ワークスペース (選択時に表示) -->
    <div class="card bg-secondary border-secondary d-none" id="detailCard">
        <div class="card-header border-secondary d-flex justify-content-between align-items-center">
            <div>
                <span class="fw-bold fs-6" id="detailTitle">棚卸し実地照合</span>
                <span class="badge bg-primary ms-2" id="detailStatus">IN_PROGRESS</span>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm" id="btnCloseDetail">閉じる</button>
                <button class="btn btn-success btn-sm" id="btnCompleteRun">
                    <i class="bi bi-check-all me-1"></i>棚卸し完了・確定
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 align-middle small">
                    <thead class="table-dark text-secondary">
                        <tr>
                            <th>資産ID</th>
                            <th>台帳ステータス</th>
                            <th>台帳保管場所</th>
                            <th>実地確認ステータス</th>
                            <th>実地保管場所</th>
                            <th>差異区分</th>
                            <th>差異理由 / 是正措置</th>
                            <th>確認者 / 日時</th>
                            <th class="text-end">照合操作</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryItemTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 新規棚卸し開始モーダル -->
    <div class="modal fade" id="startModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">新規棚卸し計画開始</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="startForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small text-muted">棚卸しコード <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="startCode" required placeholder="例: INV-2026-H1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">棚卸し名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="startTitle" required placeholder="例: 2026年度上期 定期棚卸し">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">基準日 <span class="text-danger">*</span></label>
                            <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="startDate" required>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-primary btn-sm">棚卸し開始</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 実地照合入力モーダル -->
    <div class="modal fade" id="checkModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">実地確認入力</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="checkForm">
                    <input type="hidden" id="checkItemId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small text-muted">実地確認ステータス</label>
                            <select class="form-select form-select-sm bg-dark text-white border-secondary" id="checkObservedStatus">
                                <option value="IN_STOCK">IN_STOCK (保管中)</option>
                                <option value="ASSIGNED">ASSIGNED (貸与中)</option>
                                <option value="UNDER_MAINTENANCE">UNDER_MAINTENANCE (修理中)</option>
                                <option value="LOST">LOST (所在不明/紛失)</option>
                                <option value="RESERVED">RESERVED (予約済)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">実地確認場所</label>
                            <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="checkObservedLocation" placeholder="確認した場所を入力">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">差異区分 <span class="text-danger">*</span></label>
                            <select class="form-select form-select-sm bg-dark text-white border-secondary" id="checkDiscrepancyType" required>
                                <option value="MATCH">MATCH (一致・問題なし)</option>
                                <option value="DISCREPANCY">DISCREPANCY (差異あり - 場所・状態相違)</option>
                                <option value="MISSING">MISSING (所在不明・紛失疑い)</option>
                                <option value="UNREGISTERED">UNREGISTERED (未登録資産)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">差異理由</label>
                            <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="checkDiscrepancyReason" placeholder="例: 拠点間移管の未申請">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">是正措置</label>
                            <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="checkResolutionAction" placeholder="例: 台帳場所更新、返却手続き">
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-primary btn-sm">照合結果保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/asset-inventory.js}"></script>
</th:block>
</body>
</html>
