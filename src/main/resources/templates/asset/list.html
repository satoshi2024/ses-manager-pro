<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>資産台帳管理 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid p-4">

    <!-- Header & Navigation Tabs -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0 text-white"><i class="bi bi-laptop me-2"></i>資産・アカウント管理</h4>
            <p class="text-muted small mb-0">社内情報資産、外部SaaSアカウント、有償ライセンスのライフサイクル統制</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/api/assets/export" class="btn btn-outline-secondary btn-sm" id="btnExportCsv">
                <i class="bi bi-download me-1"></i>CSVエクスポート
            </a>
            <button class="btn btn-primary btn-sm" id="btnOpenCreateModal">
                <i class="bi bi-plus-lg me-1"></i>資産新規登録
            </button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs mb-4 border-secondary">
        <li class="nav-item">
            <a class="nav-link active fw-bold text-white bg-tertiary" href="/asset/list">
                <i class="bi bi-pc-display me-1"></i>資産台帳
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-secondary" href="/asset/inventory">
                <i class="bi bi-clipboard-check me-1"></i>棚卸し管理
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-secondary" href="/asset/accounts">
                <i class="bi bi-shield-lock me-1"></i>外部アカウント・ライセンス
            </a>
        </li>
    </ul>

    <!-- Filter Card -->
    <div class="card bg-secondary border-secondary mb-4">
        <div class="card-body py-3">
            <form id="searchForm" class="row g-2 align-items-center">
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                           id="searchKeyword" placeholder="資産タグ、名称、シリアル、場所で検索...">
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm bg-dark text-white border-secondary" id="searchCategory">
                        <option value="">全区分</option>
                        <option value="PC">PC (ノート/デスクトップ)</option>
                        <option value="MONITOR">MONITOR (ディスプレイ)</option>
                        <option value="SMARTPHONE">SMARTPHONE (スマートフォン)</option>
                        <option value="TABLET">TABLET (タブレット)</option>
                        <option value="SECURITY_KEY">SECURITY_KEY (セキュリティキー)</option>
                        <option value="OTHER">OTHER (その他)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm bg-dark text-white border-secondary" id="searchStatus">
                        <option value="">全ステータス</option>
                        <option value="IN_STOCK">IN_STOCK (保管中/貸出可)</option>
                        <option value="ASSIGNED">ASSIGNED (貸与中)</option>
                        <option value="UNDER_MAINTENANCE">UNDER_MAINTENANCE (修理/保守中)</option>
                        <option value="LOST">LOST (紛失)</option>
                        <option value="DISPOSED">DISPOSED (廃棄済)</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-search me-1"></i>検索</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btnResetSearch">リセット</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table Card -->
    <div class="card bg-secondary border-secondary">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 align-middle">
                    <thead class="table-dark text-secondary small">
                        <tr>
                            <th style="width: 150px;">資産タグ</th>
                            <th>資産名称</th>
                            <th style="width: 120px;">区分</th>
                            <th>シリアルNo</th>
                            <th style="width: 120px;">ステータス</th>
                            <th>保管場所 / 貸与先</th>
                            <th>取得日 / 価格</th>
                            <th style="width: 200px;" class="text-end">操作</th>
                        </tr>
                    </thead>
                    <tbody id="assetTableBody">
                        <tr>
                            <td colspan="8" class="text-center py-4 text-muted">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-secondary border-secondary d-flex justify-content-between align-items-center py-2">
            <span class="text-muted small" id="paginationInfo">全 0 件</span>
            <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
        </div>
    </div>

    <!-- 資産作成/編集モーダル -->
    <div class="modal fade" id="assetModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-secondary text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="assetModalTitle">資産新規登録</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="assetForm">
                    <input type="hidden" id="assetId">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted">資産タグ <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="inputAssetTag" required placeholder="例: AST-PC-2026-0001">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">資産名称 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="inputAssetName" required placeholder="例: ThinkPad T14 Gen4">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">資産区分 <span class="text-danger">*</span></label>
                                <select class="form-select form-select-sm bg-dark text-white border-secondary" id="inputCategory" required>
                                    <option value="PC">PC (ノート/デスクトップ)</option>
                                    <option value="MONITOR">MONITOR (ディスプレイ)</option>
                                    <option value="SMARTPHONE">SMARTPHONE (スマートフォン)</option>
                                    <option value="TABLET">TABLET (タブレット)</option>
                                    <option value="SECURITY_KEY">SECURITY_KEY (セキュリティキー)</option>
                                    <option value="OTHER">OTHER (その他)</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">シリアルNo</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="inputSerialNo" placeholder="製造番号">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">保管場所/拠点</label>
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="inputLocation" placeholder="東京本社 倉庫A">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">取得日</label>
                                <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="inputPurchaseDate">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">取得価格 (円)</label>
                                <input type="number" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="inputPurchasePrice" placeholder="150000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small text-muted">リース満了日</label>
                                <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="inputLeaseExpiry">
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-muted">備考</label>
                                <textarea class="form-control form-control-sm bg-dark text-white border-secondary"
                                          id="inputNote" rows="2" placeholder="スペック、付属品情報など"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-primary btn-sm">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 貸与モーダル -->
    <div class="modal fade" id="assignModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">資産貸与</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="assignForm">
                    <input type="hidden" id="assignAssetId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small text-muted">対象資産</label>
                            <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="assignAssetSummary" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">貸与先区分 <span class="text-danger">*</span></label>
                            <select class="form-select form-select-sm bg-dark text-white border-secondary" id="assignType" required>
                                <option value="ENGINEER">要員 (Engineer)</option>
                                <option value="USER">社内ユーザー (SysUser)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">貸与先ID (要員ID / ユーザーID) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="assignTargetId" required placeholder="対象IDを入力">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted">貸与開始日 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="assignStartDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">返却予定日</label>
                                <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                                       id="assignExpectedReturnDate">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">貸与メモ</label>
                            <textarea class="form-control form-control-sm bg-dark text-white border-secondary"
                                      id="assignNote" rows="2" placeholder="貸与理由、付属品受渡しなど"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-primary btn-sm">貸与確定</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 返却モーダル -->
    <div class="modal fade" id="returnModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">資産返却確認</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="returnForm">
                    <input type="hidden" id="returnAssignmentId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small text-muted">返却日 <span class="text-danger">*</span></label>
                            <input type="date" class="form-control form-control-sm bg-dark text-white border-secondary"
                                   id="returnActualDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">返却メモ</label>
                            <textarea class="form-control form-control-sm bg-dark text-white border-secondary"
                                      id="returnNote" rows="2" placeholder="端末状態、付属品返却確認など"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-success btn-sm">返却完了</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 履歴モーダル -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-secondary text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="historyModalTitle">資産履歴</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-pills mb-3" id="historyTab">
                        <li class="nav-item">
                            <button class="nav-link active btn-sm" data-bs-toggle="pill" data-bs-target="#tabEvents">イベント監査ログ</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link btn-sm" data-bs-toggle="pill" data-bs-target="#tabAssignments">貸与・返却履歴</button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tabEvents">
                            <div class="table-responsive">
                                <table class="table table-dark table-sm table-bordered border-secondary">
                                    <thead>
                                        <tr>
                                            <th>日時</th>
                                            <th>種別</th>
                                            <th>状態遷移</th>
                                            <th>要約</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyEventsBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="tabAssignments">
                            <div class="table-responsive">
                                <table class="table table-dark table-sm table-bordered border-secondary">
                                    <thead>
                                        <tr>
                                            <th>貸与先</th>
                                            <th>開始日</th>
                                            <th>予定日</th>
                                            <th>返却日</th>
                                            <th>状態</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyAssignmentsBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/asset.js}"></script>
</th:block>
</body>
</html>
