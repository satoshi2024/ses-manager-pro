<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>受信インボイス レビュー</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-inbox"></i> 受信インボイス (Peppol)</h2>
    </div>

    <div class="card bg-dark text-light border-secondary">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle" id="inboundInvoiceTable">
                    <thead>
                        <tr>
                            <th>Message ID</th>
                            <th>Provider Message ID</th>
                            <th>受信日時</th>
                            <th>ステータス</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JSで描画 -->
                    </tbody>
                </table>
            </div>
            <div id="pagination" class="mt-3 d-flex justify-content-center"></div>
        </div>
    </div>
</div>

<div layout:fragment="page-js">
    <script th:src="@{/js/modules/inbound-invoice.js}"></script>
</div>
</body>
</html>
