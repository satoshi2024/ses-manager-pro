<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{lifecycle.templateManagement} + ' - ' + #{app.name}">テンプレート管理 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <!-- パンくずリスト & ヘッダー -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1">
                    <li class="breadcrumb-item"><a th:href="@{/lifecycle}" class="text-decoration-none">ライフサイクル管理</a></li>
                    <li class="breadcrumb-item active" aria-current="page">テンプレート管理</li>
                </ol>
            </nav>
            <h2 class="h3 mb-0">
                <i class="bi bi-diagram-3 me-2 text-primary"></i>ライフサイクルテンプレート管理
            </h2>
        </div>
        <div>
            <button class="btn btn-primary" onclick="SES.lifecycle.openTemplateModal()">
                <i class="bi bi-plus-lg me-1"></i>新規テンプレート
            </button>
        </div>
    </div>

    <!-- テンプレート一覧テーブル -->
    <div class="card bg-card border-theme shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-theme table-hover table-striped mb-0 align-middle">
                    <thead class="table-theme-header border-bottom border-theme">
                        <tr>
                            <th scope="col" class="ps-4">テンプレート名</th>
                            <th scope="col">種別</th>
                            <th scope="col">バージョン</th>
                            <th scope="col">適用開始日</th>
                            <th scope="col">タスク数</th>
                            <th scope="col">ステータス</th>
                            <th scope="col" class="text-end pe-4">操作</th>
                        </tr>
                    </thead>
                    <tbody id="templatesTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-4 text-muted">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<!-- テンプレート新規作成・改定モーダル -->
<div class="modal fade" id="templateModal" tabindex="-1" aria-labelledby="templateModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content bg-card border-theme">
            <div class="modal-header bg-tertiary border-theme">
                <h5 class="modal-title" id="templateModalTitle">テンプレート新規作成</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
            </div>
            <div class="modal-body">
                <form id="templateForm">
                    <input type="hidden" id="templateId">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="templateType" class="form-label">テンプレート種別</label>
                            <select id="templateType" class="form-select border-theme" required>
                                <option value="">選択してください</option>
                                <option value="JOIN">入社</option>
                                <option value="ASSIGNMENT">現場配属</option>
                                <option value="TRANSFER">所属異動</option>
                                <option value="LEAVE">休職</option>
                                <option value="REINSTATEMENT">復職</option>
                                <option value="RESIGNATION">退社</option>
                            </select>
                            <div class="form-text">改定時は既存バージョンと同じ種別で保存されます。</div>
                        </div>
                        <div class="col-md-8">
                            <label for="templateName" class="form-label">テンプレート名</label>
                            <input type="text" id="templateName" class="form-control border-theme" required>
                        </div>
                        <div class="col-12">
                            <label for="templateDescription" class="form-label">説明</label>
                            <textarea id="templateDescription" class="form-control border-theme" rows="2"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="templateValidFrom" class="form-label">適用開始日</label>
                            <input type="date" id="templateValidFrom" class="form-control border-theme" required>
                        </div>
                        <div class="col-md-6">
                            <label for="templateValidTo" class="form-label">適用終了日（任意）</label>
                            <input type="date" id="templateValidTo" class="form-control border-theme">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="mb-0">タスク定義</h6>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="SES.lifecycle.addTemplateTask()">
                            <i class="bi bi-plus-lg me-1"></i>タスクを追加
                        </button>
                    </div>
                    <div id="templateTasks"></div>
                </form>
            </div>
            <div class="modal-footer bg-tertiary border-theme">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn btn-primary" id="templateSaveButton" onclick="SES.lifecycle.saveTemplate()">作成</button>
            </div>
        </div>
    </div>
</div>

</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/lifecycle.js}"></script>
</th:block>
</body>
</html>
