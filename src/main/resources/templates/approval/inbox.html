<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title th:text="#{approval.inbox.title} + ' - SES Manager Pro'">承認inbox - SES Manager Pro</title></head>
<body>
<div layout:fragment="content" class="container-fluid py-3 approval-page">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div><h1 class="h3 mb-1"><i class="bi bi-inbox me-2 text-info"></i><span th:text="#{approval.inbox.title}">承認inbox</span></h1><p class="text-muted small mb-0" th:text="#{approval.inbox.subtitle}">自分の申請と承認待ちを確認します。</p></div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#approvalCreateModal"><i class="bi bi-plus-lg me-1"></i><span th:text="#{approval.create.button}">申請を作成</span></button>
  </div>
  <div class="card shadow-sm border-0 mb-4"><div class="card-body"><form id="approvalSearchForm" class="row g-2 align-items-end">
    <div class="col-12 col-md-4"><label class="form-label small" for="approvalStatus" th:text="#{approval.filter.status}">状態</label><select id="approvalStatus" class="form-select form-select-sm"><option value="" th:text="#{approval.status.all}">すべて</option><option value="in_review" th:text="#{approval.status.inReview}">承認待ち</option><option value="returned" th:text="#{approval.status.returned}">差戻し</option><option value="approved" th:text="#{approval.status.approved}">承認済み</option><option value="rejected" th:text="#{approval.status.rejected}">却下</option></select></div>
    <div class="col-12 col-md-auto"><button class="btn btn-outline-primary btn-sm" type="submit"><i class="bi bi-search me-1"></i><span th:text="#{common.btn.search}">検索</span></button></div>
  </form></div></div>
  <div class="card shadow-sm border-0"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0" id="approvalTable"><thead class="table-light"><tr><th th:text="#{approval.table.requestNo}">申請番号</th><th th:text="#{approval.table.type}">対象</th><th th:text="#{approval.table.applicant}">申請者</th><th th:text="#{approval.table.amount}">金額</th><th th:text="#{approval.table.status}">状態</th><th th:text="#{approval.table.requestedAt}">申請日時</th><th></th></tr></thead><tbody id="approvalTableBody"><tr><td colspan="7" class="text-center py-4 text-muted" th:text="#{common.loading}">読み込み中...</td></tr></tbody></table></div></div><div class="card-footer d-flex justify-content-between align-items-center"><span id="approvalPaginationInfo" class="small text-muted"></span><nav id="approvalPagination"></nav></div></div>
  <div class="modal fade" id="approvalCreateModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content bg-secondary text-light"><div class="modal-header border-dark"><h5 class="modal-title" th:text="#{approval.create.title}">承認申請を作成</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="approvalCreateForm" class="row g-3"><div class="col-md-6"><label class="form-label" th:text="#{approval.create.requestType}">申請種別</label><input name="requestType" class="form-control" required placeholder="CONTRACT"></div><div class="col-md-6"><label class="form-label" th:text="#{approval.create.targetType}">対象種別</label><input name="targetType" class="form-control" required placeholder="CONTRACT"></div><div class="col-md-6"><label class="form-label" th:text="#{approval.create.targetId}">対象ID</label><input name="targetId" type="number" class="form-control"></div><div class="col-md-6"><label class="form-label" th:text="#{approval.create.targetVersion}">対象version</label><input name="targetVersion" type="number" class="form-control"></div><div class="col-md-6"><label class="form-label" th:text="#{approval.create.organizationId}">組織ID</label><input name="organizationId" type="number" class="form-control"></div><div class="col-md-6"><label class="form-label" th:text="#{approval.create.amount}">金額（税込・円）</label><input name="amountSnapshot" type="number" step="0.01" class="form-control"></div><div class="col-12"><label class="form-label" th:text="#{approval.create.payload}">申請payload JSON</label><textarea name="payload" class="form-control" rows="3">{}</textarea></div><div class="col-12"><label class="form-label" th:text="#{approval.create.diff}">差分JSON</label><textarea name="diff" class="form-control" rows="3">{}</textarea></div></form></div><div class="modal-footer border-dark"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">キャンセル</button><button type="button" class="btn btn-primary" onclick="createApprovalRequest()" th:text="#{approval.create.submit}">申請する</button></div></div></div></div>
</div>
<th:block layout:fragment="page-js"><script th:src="@{/js/modules/approval.js}"></script></th:block>
</body></html>
