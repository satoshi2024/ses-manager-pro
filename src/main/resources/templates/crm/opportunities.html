<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>商機管理 - SES Manager Pro</title>
    <th:block layout:fragment="page-css"><style>
        .crm-kanban { display:flex; gap:1rem; overflow-x:auto; padding-bottom:1rem; }
        .crm-kanban-column { flex:0 0 260px; min-height:360px; }
        .crm-kanban-list { min-height:300px; }
        .crm-opportunity-card { cursor:grab; }
        .crm-opportunity-card.crm-dragging { opacity:.45; }
        @media (max-width:576px) { .crm-kanban-column { flex-basis:230px; } .crm-opportunity-card { font-size:.9rem; } }
    </style></th:block>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><h2 class="h3 text-light mb-0"><i class="bi bi-kanban me-2 text-info"></i>商機管理</h2><div><a class="btn btn-outline-info me-2" href="/crm/opportunities/kpi"><i class="bi bi-bar-chart me-1"></i>CRM KPI</a><button class="btn btn-info" onclick="openOpportunityModal()"><i class="bi bi-plus-lg me-1"></i>新規商機</button></div></div>
    <div class="crm-kanban" id="opportunity-board">
        <div th:each="stage : ${ {'見込','要件確認','提案準備','見積提出','交渉','受注','失注'} }" class="crm-kanban-column card bg-card border-dark" th:data-stage="${stage}"><div class="card-header border-dark d-flex justify-content-between"><span th:text="${stage}">見込</span><span class="badge bg-secondary" data-count>0</span></div><div class="card-body crm-kanban-list p-2" th:data-stage="${stage}"></div></div>
    </div>
    <div class="small text-muted mt-2">カードを別の列へ移動すると状態変更を行います。失敗時は元の列へ戻ります。</div>

    <div class="modal fade" id="opportunityModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content bg-card text-light border-dark"><div class="modal-header border-dark"><h5 class="modal-title">商機登録</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="opportunity-form"><input type="hidden" id="opportunity-id"><input type="hidden" id="opportunity-version"><div class="row g-3"><div class="col-md-6"><label class="form-label">顧客ID *</label><input id="opportunity-customer" type="number" class="form-control bg-dark text-light border-secondary" required></div><div class="col-md-6"><label class="form-label">商機名 *</label><input id="opportunity-title" class="form-control bg-dark text-light border-secondary" required></div><div class="col-md-4"><label class="form-label">開始予定月</label><input id="opportunity-month" type="month" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-4"><label class="form-label">募集人数</label><input id="opportunity-count" type="number" min="1" class="form-control bg-dark text-light border-secondary" value="1"></div><div class="col-md-4"><label class="form-label">想定単価</label><input id="opportunity-price" type="number" min="0" class="form-control bg-dark text-light border-secondary"></div></div></form></div><div class="modal-footer border-dark"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button><button class="btn btn-info" onclick="saveOpportunity()">保存</button></div></div></div></div>
</div>
<th:block layout:fragment="page-js"><script th:src="@{/js/modules/crm-opportunities.js}"></script></th:block>
</body>
</html>
