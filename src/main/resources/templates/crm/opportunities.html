<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{crm.opportunity.title}">商機管理 - SES Manager Pro</title>
    <th:block layout:fragment="page-css"><style>
        .crm-kanban { display:flex; gap:1rem; overflow-x:auto; padding-bottom:1rem; }
        .crm-kanban-column { flex:0 0 260px; min-height:360px; }
        .crm-kanban-list { min-height:300px; }
        .crm-opportunity-card { cursor:grab; }
        .crm-opportunity-card.crm-dragging { opacity:.45; }
        @media (max-width:576px) { .crm-kanban-column { flex-basis:230px; } .crm-opportunity-card { font-size:.9rem; } }
    </style></th:block>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><h2 class="h3 text-light mb-0"><i class="bi bi-kanban me-2 text-info"></i><span th:text="#{crm.opportunity.title}">商機管理</span></h2><div><a class="btn btn-outline-info me-2" href="/crm/opportunities/kpi"><i class="bi bi-bar-chart me-1"></i><span th:text="#{crm.kpi.title}">CRM KPI</span></a><button class="btn btn-info" onclick="openOpportunityModal()"><i class="bi bi-plus-lg me-1"></i><span th:text="#{crm.opportunity.new}">新規商機</span></button></div></div>
    <div class="card bg-card border-dark shadow-sm mb-4"><div class="card-body"><form id="searchForm" class="row g-2" onsubmit="event.preventDefault(); applyOpportunityFilters();"><div class="col-md-4"><label class="form-label small text-muted" th:text="#{crm.opportunity.filter.customer}">顧客</label><select id="opportunity-customer-filter" class="form-select bg-dark text-light border-secondary"><option value="" th:text="#{crm.opportunity.filter.all}">すべて</option></select></div><div class="col-md-4"><label class="form-label small text-muted" th:text="#{crm.opportunity.filter.stage}">ステージ</label><select id="opportunity-stage-filter" class="form-select bg-dark text-light border-secondary"><option value="" th:text="#{crm.opportunity.filter.all}">すべて</option><option th:each="stage : ${ {'見込','要件確認','提案準備','見積提出','交渉','受注','失注'} }" th:value="${stage}" th:text="${@enumLabels.label('opportunityStage', stage)}">見込</option></select></div><div class="col-md-4 d-flex align-items-end"><button class="btn btn-outline-info w-100" th:text="#{crm.opportunity.filter.apply}">絞り込み</button></div></form></div></div>
    <div class="crm-kanban" id="opportunity-board">
        <div th:each="stage : ${ {'見込','要件確認','提案準備','見積提出','交渉','受注','失注'} }" class="crm-kanban-column card bg-card border-dark" th:data-stage="${stage}"><div class="card-header border-dark d-flex justify-content-between"><span th:text="${@enumLabels.label('opportunityStage', stage)}">見込</span><span class="badge bg-secondary" data-count>0</span></div><div class="card-body crm-kanban-list p-2" th:data-stage="${stage}"></div></div>
    </div>
    <div id="opportunity-pagination" class="small text-muted mt-2 text-end"></div>

    <div class="modal fade" id="opportunityModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content bg-card text-light border-dark"><div class="modal-header border-dark"><h5 class="modal-title" th:text="#{crm.opportunity.form.title}">商機</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="opportunity-form"><input type="hidden" id="opportunity-id"><input type="hidden" id="opportunity-version"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="opportunity-customer" th:text="#{crm.opportunity.customer}">顧客 *</label><select id="opportunity-customer" class="form-select bg-dark text-light border-secondary" required><option value="" th:text="#{crm.opportunity.selectCustomer}">顧客を選択...</option></select></div><div class="col-md-6"><label class="form-label" for="opportunity-owner" th:text="#{crm.opportunity.owner}">担当営業</label><select id="opportunity-owner" class="form-select bg-dark text-light border-secondary"><option value="" th:text="#{crm.opportunity.unassigned}">未割当</option></select></div><div class="col-md-6"><label class="form-label" for="opportunity-title" th:text="#{crm.opportunity.name}">商機名 *</label><input id="opportunity-title" class="form-control bg-dark text-light border-secondary" required></div><div class="col-md-4"><label class="form-label" for="opportunity-month" th:text="#{crm.opportunity.startMonth}">開始予定月</label><input id="opportunity-month" type="month" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-4"><label class="form-label" for="opportunity-duration" th:text="#{crm.opportunity.duration}">想定期間(月)</label><input id="opportunity-duration" type="number" min="1" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-4"><label class="form-label" for="opportunity-count" th:text="#{crm.opportunity.count}">募集人数</label><input id="opportunity-count" type="number" min="1" class="form-control bg-dark text-light border-secondary" value="1"></div><div class="col-md-4"><label class="form-label" for="opportunity-price" th:text="#{crm.opportunity.unitPrice}">想定単価</label><input id="opportunity-price" type="number" min="0" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-4"><label class="form-label" for="opportunity-amount" th:text="#{crm.opportunity.expectedAmount}">見込金額</label><input id="opportunity-amount" type="number" min="0" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-4"><label class="form-label" for="opportunity-probability" th:text="#{crm.opportunity.probability}">確度(%)</label><input id="opportunity-probability" type="number" min="0" max="100" class="form-control bg-dark text-light border-secondary" value="20"></div><div class="col-md-6"><label class="form-label" for="opportunity-next-action" th:text="#{crm.opportunity.nextAction}">次回アクション</label><input id="opportunity-next-action" type="date" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-6"><label class="form-label" for="opportunity-competitor" th:text="#{crm.opportunity.competitor}">競合</label><input id="opportunity-competitor" class="form-control bg-dark text-light border-secondary"></div><div class="col-12"><label class="form-label" for="opportunity-override-reason" th:text="#{crm.opportunity.overrideReason}">確度上書き理由</label><input id="opportunity-override-reason" class="form-control bg-dark text-light border-secondary"></div></div></form></div><div class="modal-footer border-dark"><button class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">キャンセル</button><button class="btn btn-info" onclick="saveOpportunity()" th:text="#{common.save}">保存</button></div></div></div></div>
</div>
<th:block layout:fragment="page-js"><script th:src="@{/js/modules/crm-opportunities.js}"></script></th:block>
</body>
</html>
