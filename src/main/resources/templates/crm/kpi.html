<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title th:text="#{crm.kpi.title}">CRM KPI - SES Manager Pro</title></head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><h2 class="h3 text-light mb-0"><i class="bi bi-bar-chart-line me-2 text-info"></i><span th:text="#{crm.kpi.title}">CRM KPI</span></h2><a href="/crm/opportunities" class="btn btn-outline-secondary" th:text="#{crm.kpi.back}">商機kanbanへ戻る</a></div>
    <div class="row g-3 mb-4"><div class="col-12 col-xl-6"><div class="card bg-card border-dark h-100"><div class="card-header border-dark"><span th:text="#{crm.kpi.forecast.title}">Forecast（別系列）</span></div><div class="card-body"><div class="row text-center"><div class="col-6"><div class="small text-muted" th:text="#{crm.kpi.forecast.opportunity}">商機forecast</div><div id="kpi-opportunity-forecast" class="fs-4 text-info">-</div></div><div class="col-6"><div class="small text-muted" th:text="#{crm.kpi.forecast.proposal}">提案forecast</div><div id="kpi-proposal-forecast" class="fs-4 text-success">-</div></div></div><div class="small text-muted mt-3" th:text="#{crm.kpi.forecast.note}">変換済み商機は商機系列から除外します。</div></div></div></div><div class="col-12 col-xl-6"><div class="card bg-card border-dark h-100"><div class="card-header border-dark" th:text="#{crm.kpi.owner.title}">担当別転換率</div><div class="table-responsive"><table class="table table-dark table-sm mb-0"><thead><tr><th th:text="#{crm.kpi.owner}">担当</th><th th:text="#{crm.kpi.lead}">lead</th><th th:text="#{crm.kpi.converted}">転換</th><th th:text="#{crm.kpi.rate}">率</th><th th:text="#{crm.kpi.wonRate}">受注率</th></tr></thead><tbody id="kpi-owner-body"></tbody></table></div></div></div></div>
    <div class="row g-3"><div class="col-12 col-xl-8"><div class="card bg-card border-dark"><div class="card-header border-dark" th:text="#{crm.kpi.stage.title}">Stage別商機</div><div class="table-responsive"><table class="table table-dark table-hover mb-0"><thead><tr><th th:text="#{crm.kpi.stage}">Stage</th><th th:text="#{crm.kpi.count}">件数</th><th th:text="#{crm.kpi.amount}">金額</th><th th:text="#{crm.kpi.weighted}">加重forecast</th><th th:text="#{crm.kpi.stagnation}">滞留日数</th><th th:text="#{crm.kpi.noActivity}">活動なし</th></tr></thead><tbody id="kpi-stage-body"></tbody></table></div></div></div><div class="col-12 col-xl-4"><div class="card bg-card border-dark mb-3"><div class="card-header border-dark" th:text="#{crm.kpi.lost.title}">失注理由</div><div class="table-responsive"><table class="table table-dark table-sm mb-0"><tbody id="kpi-lost-body"></tbody></table></div></div><div class="card bg-card border-dark"><div class="card-header border-dark" th:text="#{crm.kpi.source.title}">Source ROI</div><div class="table-responsive"><table class="table table-dark table-sm mb-0"><tbody id="kpi-source-body"></tbody></table></div></div></div></div>
</div>
<th:block layout:fragment="page-js"><script th:src="@{/js/modules/crm-kpi.js}"></script></th:block>
</body></html>
