<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="#{crm.lead.title}">リード管理 - SES Manager Pro</title></head>
<body>
<div layout:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="h3 text-light mb-0"><i class="bi bi-person-lines-fill me-2 text-info"></i><span th:text="#{crm.lead.title}">リード管理</span></h2>
        <button class="btn btn-info" onclick="openLeadModal()"><i class="bi bi-plus-lg me-1"></i><span th:text="#{crm.lead.new}">新規リード</span></button>
    </div>
    <div class="card bg-card border-dark shadow-sm mb-4"><div class="card-body">
        <form id="lead-filter" class="row g-2" onsubmit="event.preventDefault(); loadLeads();">
            <div class="col-md-5"><label class="form-label small text-muted" th:text="#{crm.lead.company}">会社名</label><input id="lead-company-filter" class="form-control bg-dark text-light border-secondary"></div>
            <div class="col-md-4"><label class="form-label small text-muted" th:text="#{crm.lead.status}">ステータス</label><select id="lead-status-filter" class="form-select bg-dark text-light border-secondary"><option value="">すべて</option><option>未対応</option><option>対応中</option><option>転換済</option><option>破棄</option></select></div>
            <div class="col-md-3 d-flex align-items-end"><button class="btn btn-outline-info w-100" th:text="#{common.search}">絞り込み</button></div>
        </form>
    </div></div>
    <div class="card bg-card border-dark shadow-sm"><div class="table-responsive"><table class="table table-dark table-hover mb-0 align-middle">
        <thead><tr><th th:text="#{crm.lead.company}">会社名</th><th th:text="#{crm.lead.contact}">担当者</th><th th:text="#{crm.lead.source}">ソース</th><th th:text="#{crm.lead.status}">ステータス</th><th class="text-end" th:text="#{common.actions}">操作</th></tr></thead>
        <tbody id="lead-table-body"><tr><td colspan="5" class="text-center text-muted py-4">読み込み中...</td></tr></tbody>
    </table></div><div id="lead-pagination" class="card-footer border-dark bg-transparent text-end"></div></div>

    <div class="modal fade" id="leadModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-card text-light border-dark">
        <div class="modal-header border-dark"><h5 class="modal-title" id="lead-modal-title">リード登録</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="lead-form"><input type="hidden" id="lead-id"><input type="hidden" id="lead-version">
            <div class="mb-3"><label class="form-label" th:text="#{crm.lead.companyRequired}">会社名 *</label><input id="lead-company" class="form-control bg-dark text-light border-secondary" required></div>
            <div class="mb-3"><label class="form-label">担当者名</label><input id="lead-contact-name" class="form-control bg-dark text-light border-secondary"></div>
            <div class="row g-2"><div class="col-md-6"><label class="form-label">メール</label><input id="lead-email" type="email" class="form-control bg-dark text-light border-secondary"></div><div class="col-md-6"><label class="form-label">電話</label><input id="lead-phone" class="form-control bg-dark text-light border-secondary"></div></div>
            <div class="mt-3"><label class="form-label" th:text="#{crm.lead.owner}">担当営業</label><select id="lead-owner" class="form-select bg-dark text-light border-secondary"><option value="">未割当</option></select></div>
            <div class="mt-3"><label class="form-label" th:text="#{crm.lead.source}">ソース</label><input id="lead-source" class="form-control bg-dark text-light border-secondary"><label class="form-label mt-2" th:text="#{crm.lead.sourceCost}">獲得原価</label><input id="lead-source-cost" type="number" min="0" class="form-control bg-dark text-light border-secondary"><label class="form-label mt-2" th:text="#{crm.lead.status}">ステータス</label><select id="lead-status" class="form-select bg-dark text-light border-secondary"><option>未対応</option><option>対応中</option><option>転換済</option><option>破棄</option></select></div>
        </form><div id="lead-duplicate-warning" class="alert alert-warning mt-3 d-none">重複候補があります。自動統合は行いません。内容を確認して登録してください。</div></div>
        <div class="modal-footer border-dark"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button><button class="btn btn-info" onclick="saveLead()">保存</button></div>
    </div></div></div>
</div>
<th:block layout:fragment="page-js"><script th:src="@{/js/modules/crm-leads.js}"></script></th:block>
</body>
</html>
