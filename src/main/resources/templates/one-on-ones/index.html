<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{menu.oneOnOneManagement}">1on1管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-light"><i class="bi bi-chat-dots me-2 text-primary"></i><th:block th:text="#{menu.oneOnOneManagement}">1on1管理</th:block></h2>
    </div>

    <div class="card bg-card border-dark shadow-sm mb-4">
        <div class="card-body">
            <form id="searchForm" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="searchEngineerName" class="form-label text-muted small" th:text="#{oneOnOne.engineerName}">要員名</label>
                    <input type="text" class="form-control bg-dark border-secondary text-light" id="searchEngineerName">
                </div>
                <div class="col-md-3">
                    <label for="searchStatus" class="form-label text-muted small" th:text="#{oneOnOne.status}">状態</label>
                    <select class="form-select bg-dark border-secondary text-light" id="searchStatus">
                        <option value="" th:text="#{common.all}">すべて</option>
                        <option value="申請" th:text="#{oneOnOne.status.requested}">申請</option>
                        <option value="日程確定" th:text="#{oneOnOne.status.scheduled}">日程確定</option>
                        <option value="実施済" th:text="#{oneOnOne.status.done}">実施済</option>
                        <option value="取消" th:text="#{oneOnOne.status.cancelled}">取消</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100" th:text="#{common.search}">検索</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card bg-card border-dark shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle small">
                    <thead>
                    <tr><th th:text="#{oneOnOne.engineerName}">要員</th><th th:text="#{oneOnOne.counterpart}">相手</th>
                        <th th:text="#{oneOnOne.dates}">候補日</th><th th:text="#{oneOnOne.scheduled}">確定日程</th>
                        <th th:text="#{oneOnOne.status}">状態</th><th th:text="#{oneOnOne.privateNote}">confidential</th>
                        <th th:text="#{common.actions}">操作</th></tr>
                    </thead>
                    <tbody id="oneonone-body"></tbody>
                </table>
            </div>
            <div id="oneonone-pagination" class="d-flex justify-content-between align-items-center small text-muted mt-2"></div>
        </div>
    </div>

    <!-- 詳細・操作モーダル -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{oneOnOne.detail}">1on1詳細</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body small" id="detail-body">…</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{common.close}">閉じる</button>
            </div>
        </div>
    </div>
</div>

</div>

<th:block layout:fragment="page-js">
    <script src="/js/modules/one-on-one-management.js" th:src="@{/js/modules/one-on-one-management.js}"></script>
</th:block>
</body>
</html>
