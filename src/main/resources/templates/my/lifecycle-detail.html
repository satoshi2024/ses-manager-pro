<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>マイライフサイクル詳細 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4" th:attr="data-case-id=${caseId}">
    <!-- パンくずリスト -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/my/lifecycle}" class="text-decoration-none">マイライフサイクル</a></li>
            <li class="breadcrumb-item active text-light" aria-current="page" id="myBreadcrumbCaseNo">手続き詳細</li>
        </ol>
    </nav>

    <!-- 案件概要ヘッダーカード -->
    <div class="card bg-card border-dark shadow-sm mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                <div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="badge bg-secondary px-2 py-1 fs-6" id="myCaseTypeBadge">-</span>
                        <h3 class="h4 mb-0 text-light" id="myCaseTitleHeader">読み込み中...</h3>
                        <span class="badge bg-primary" id="myCaseStatusBadge">-</span>
                    </div>
                    <div class="d-flex flex-wrap gap-4 text-muted small mt-2">
                        <div><i class="bi bi-calendar-event me-1"></i>基準日: <strong class="text-light" id="myAnchorDateHeader">-</strong></div>
                        <div><i class="bi bi-clock me-1"></i>起票日: <span class="text-light" id="myCreatedAtHeader">-</span></div>
                    </div>
                </div>
            </div>

            <!-- 全体進捗バー -->
            <div class="mt-4 pt-3 border-top border-secondary">
                <div class="d-flex justify-content-between align-items-center mb-1 small">
                    <span class="text-muted">タスク完了進捗: <strong class="text-light" id="myProgressSummary">0 / 0 完了</strong></span>
                    <span class="text-primary fw-bold" id="myProgressPercentage">0%</span>
                </div>
                <div class="progress bg-dark" style="height: 10px;">
                    <div class="progress-bar bg-success progress-bar-striped" role="progressbar" id="myProgressBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 本人公開タスク一覧セクション -->
    <div class="card bg-card border-dark shadow-sm mb-4">
        <div class="card-header bg-dark border-dark py-3">
            <h5 class="card-title text-light mb-0 fs-6">
                <i class="bi bi-list-check me-2 text-primary"></i>提出・対応タスク一覧
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark-header border-bottom border-dark">
                        <tr>
                            <th scope="col" class="ps-4" style="width: 60px;">順序</th>
                            <th scope="col">タスク名</th>
                            <th scope="col">期日</th>
                            <th scope="col">ステータス</th>
                            <th scope="col">確認・完了メモ</th>
                            <th scope="col" class="text-end pe-4">操作</th>
                        </tr>
                    </thead>
                    <tbody id="myTasksTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- タスク完了モーダル -->
    <div class="modal fade" id="myDetailCompleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="bi bi-check2-circle me-2 text-success"></i>タスク完了・提出報告</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="myDetailCompleteForm" onsubmit="event.preventDefault(); SES.myLifecycle.submitDetailComplete();">
                    <div class="modal-body">
                        <input type="hidden" id="myDetailTaskId">
                        <div class="mb-3">
                            <label class="form-label text-light">完了報告コメント / 備考</label>
                            <textarea class="form-control bg-dark border-secondary text-light" id="myDetailCompletionComment" rows="3" placeholder="提出内容・受領確認メモ等"></textarea>
                        </div>
                        <div class="mb-3" id="myDetailDocIdSection" style="display:none;">
                            <label class="form-label text-light">提出文書ID (DOCUMENT_LINK)</label>
                            <input type="number" class="form-control bg-dark border-secondary text-light" id="myDetailDocumentId" placeholder="添付文書ID">
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-success"><i class="bi bi-send me-1"></i>完了報告を送信</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/my-lifecycle.js}"></script>
</th:block>
</body>
</html>
