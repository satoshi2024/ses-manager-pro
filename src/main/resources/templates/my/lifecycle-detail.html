<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>マイライフサイクル詳細 - SES Manager Pro</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-4" th:attr="data-case-id=${caseId}">
    <!-- パンくずリスト -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/my/lifecycle}" class="text-decoration-none">マイライフサイクル</a></li>
            <li class="breadcrumb-item active text-light" aria-current="page" id="myBreadcrumbCaseNo">手続き詳細</li>
        </ol>
    </nav>

    <!-- 案件概要ヘッダーカード -->
    <div class="card bg-card border-dark shadow-sm mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                <div>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="badge bg-secondary px-2 py-1 fs-6" id="myCaseTypeBadge">-</span>
                        <h3 class="h4 mb-0 text-light" id="myCaseTitleHeader">読み込み中...</h3>
                        <span class="badge bg-primary" id="myCaseStatusBadge">-</span>
                    </div>
                    <div class="d-flex flex-wrap gap-4 text-muted small mt-2">
                        <div><i class="bi bi-calendar-event me-1"></i>基準日: <strong class="text-light" id="myAnchorDateHeader">-</strong></div>
                        <div><i class="bi bi-clock me-1"></i>起票日: <span class="text-light" id="myCreatedAtHeader">-</span></div>
                    </div>
                </div>
            </div>

            <!-- 全体進捗バー -->
            <div class="mt-4 pt-3 border-top border-secondary">
                <div class="d-flex justify-content-between align-items-center mb-1 small">
                    <span class="text-muted">タスク完了進捗: <strong class="text-light" id="myProgressSummary">0 / 0 完了</strong></span>
                    <span class="text-primary fw-bold" id="myProgressPercentage">0%</span>
                </div>
                <div class="progress bg-dark" style="height: 10px;">
                    <div class="progress-bar bg-success progress-bar-striped" role="progressbar" id="myProgressBar" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 本人公開タスク一覧セクション -->
    <div class="card bg-card border-dark shadow-sm mb-4">
        <div class="card-header bg-dark border-dark py-3">
            <h5 class="card-title text-light mb-0 fs-6">
                <i class="bi bi-list-check me-2 text-primary"></i>提出・対応タスク一覧
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover table-striped mb-0 align-middle">
                    <thead class="table-dark-header border-bottom border-dark">
                        <tr>
                            <th scope="col" class="ps-4" style="width: 60px;">順序</th>
                            <th scope="col">タスク名</th>
                            <th scope="col">期日</th>
                            <th scope="col">ステータス</th>
                            <th scope="col">確認・完了メモ</th>
                            <th scope="col" class="text-end pe-4">操作</th>
                        </tr>
                    </thead>
                    <tbody id="myTasksTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-4 text-muted">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- タスク完了モーダル -->
    <div class="modal fade" id="myDetailCompleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="bi bi-check2-circle me-2 text-success"></i>タスク完了・提出報告</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="myDetailCompleteForm" onsubmit="event.preventDefault(); SES.myLifecycle.submitDetailComplete();">
                    <div class="modal-body">
                        <input type="hidden" id="myDetailTaskId">
                        <div class="mb-3">
                            <label class="form-label text-light">完了報告コメント / 備考</label>
                            <textarea class="form-control bg-dark border-secondary text-light" id="myDetailCompletionComment" rows="3" placeholder="提出内容・受領確認メモ等"></textarea>
                        </div>
                        <div class="mb-3" id="myDetailDocIdSection" style="display:none;">
                            <label class="form-label text-light" for="myDetailDocumentId">提出文書ID (DOCUMENT_LINK)</label>
                            <div class="input-group">
                                <input type="number" class="form-control bg-dark border-secondary text-light" id="myDetailDocumentId" placeholder="添付文書ID"
                                       onchange="SES.myLifecycle.resetEvidenceVersions('myDetailDocumentVersionId')">
                                <button type="button" class="btn btn-outline-info"
                                        onclick="SES.myLifecycle.loadEvidenceVersions('myDetailTaskId', 'myDetailDocumentId', 'myDetailDocumentVersionId')"
                                        title="文書の版を読み込む" aria-label="文書の版を読み込む">
                                    <i class="bi bi-arrow-repeat me-1"></i>版を読み込む
                                </button>
                            </div>
                            <label class="form-label text-light mt-2" for="myDetailDocumentVersionId">提出する版</label>
                            <select class="form-select bg-dark border-secondary text-light" id="myDetailDocumentVersionId" disabled>
                                <option value="">文書IDを入力して版を読み込んでください</option>
                            </select>
                            <div class="form-text text-muted">ウイルス検査済み（CLEAN）の版だけが表示されます。版を選ばない提出はできません。</div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-success"><i class="bi bi-send me-1"></i>完了報告を送信</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 二者確認の提出モーダル（本人）。確認・差戻しの欄は持たない。子スイッチ nf01-dual-confirmation がOFFなら描画しない（W3-21b） -->
    <div th:unless="${disabledFeatures != null and disabledFeatures.contains('nf01-dual-confirmation')}"
         class="modal fade" id="dualConfirmModal" tabindex="-1" aria-hidden="true" aria-labelledby="dualConfirmModalTitle"
         data-dual-api-base="/api/my/lifecycle">
        <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
            <div class="modal-content bg-card text-theme border-theme">
                <div class="modal-header border-theme">
                    <h5 class="modal-title" id="dualConfirmModalTitle"><i class="bi bi-people me-2 text-info"></i><span th:text="#{lifecycle.dual.modal.selfTitle}">証跡の提出（二者確認）</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" th:attr="aria-label=#{common.close}"></button>
                </div>
                <div class="modal-body">
                    <div class="fw-bold mb-2" id="dualTaskName"></div>
                    <div id="dualSummary" aria-live="polite"></div>
                    <div class="small text-muted mt-2" id="dualNotice" hidden></div>

                    <section class="mt-3 pt-3 border-top border-theme" id="dualSubmitSection" hidden>
                        <h6 class="mb-2" th:text="#{lifecycle.dual.section.submit}">証跡の提出</h6>
                        <label class="form-label small" for="dualCandidateSelect" th:text="#{lifecycle.dual.field.candidate}">証跡にするスキルシートの版</label>
                        <select class="form-select border-theme" id="dualCandidateSelect" disabled
                                onchange="SES.lifecycleDual.renderControls()"></select>
                        <div class="form-text" th:text="#{lifecycle.dual.field.candidateHelp}">CLEANの版だけが表示されます</div>
                        <label class="form-label small mt-2" for="dualSubmitComment" th:text="#{lifecycle.dual.field.submitComment}">提出コメント</label>
                        <textarea class="form-control border-theme" id="dualSubmitComment" rows="3" maxlength="1000"></textarea>
                        <div class="form-text" th:text="#{lifecycle.dual.field.commentPrivacy}">コメントの閲覧範囲</div>
                        <div class="d-flex flex-wrap justify-content-end gap-2 mt-2">
                            <button type="button" class="btn btn-primary" id="dualSubmitButton" disabled onclick="SES.lifecycleDual.submit()">
                                <i class="bi bi-send me-1"></i><span th:text="#{lifecycle.dual.action.submit}">提出する</span>
                            </button>
                        </div>
                    </section>
                </div>
                <div class="modal-footer border-theme">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{common.close}">閉じる</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:unless="${disabledFeatures != null and disabledFeatures.contains('nf01-dual-confirmation')}" th:src="@{/js/modules/lifecycle-dual.js}"></script>
    <script th:src="@{/js/modules/my-lifecycle.js}"></script>
</th:block>
</body>
</html>
