<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE" th:text="#{app.title}">SES Manager Pro</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    
    <!-- Bootstrap 5 CSS -->
    <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link th:href="@{/css/common.css}" rel="stylesheet">
    
    <!-- Theme Initialization Script to prevent FOUC (Flash of Unstyled Content) -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('ses_theme') || 'light';
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) {}
        })();
    </script>
    
    <!-- Additional CSS from specific pages -->
    <th:block layout:fragment="page-css"></th:block>
</head>
<body>
    
    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060; pointer-events: none;"></div>

    <!-- 要員PWAの未送信queue/競合。業務データのキャッシュではなく、最小commandの状態だけを表示する。 -->
    <div sec:authorize="hasRole('要員')" id="pwa-queue-panel" class="pwa-queue-panel no-print" hidden>
        <div class="d-flex align-items-center justify-content-between gap-2 pb-1 border-bottom border-secondary mb-1">
            <div class="d-flex align-items-center gap-2">
                <span class="bi bi-cloud-arrow-up fs-5" aria-hidden="true"></span>
                <span class="fw-bold small" id="pwa-queue-title">同期キュー</span>
            </div>
            <div class="d-flex align-items-center gap-1">
                <button type="button" id="pwa-sync-now" class="btn btn-sm btn-outline-primary py-0 px-2">同期</button>
                <button type="button" id="pwa-panel-toggle" class="btn btn-sm btn-outline-secondary py-0 px-2" aria-expanded="true" aria-controls="pwa-panel-body" title="表示切替">
                    <span class="bi bi-chevron-down" id="pwa-panel-toggle-icon" aria-hidden="true"></span>
                </button>
            </div>
        </div>
        <div id="pwa-panel-body">
            <div id="pwa-queue-status" role="status" aria-live="polite" class="small"></div>
            <div id="pwa-conflicts" class="mt-2"></div>
        </div>
    </div>

    <!-- Password Change Modal -->
    <div class="modal fade" id="passwordChangeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-secondary text-white border-dark">
                <div class="modal-header border-dark">
                    <h5 class="modal-title fw-bold" th:text="#{common.password.change}">パスワード変更</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="pw-current" class="form-label text-muted small" th:text="#{common.password.current}">現在のパスワード</label>
                        <input type="password" class="form-control bg-dark text-white border-secondary" id="pw-current" autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label for="pw-new" class="form-label text-muted small" th:text="#{common.password.new}">新しいパスワード</label>
                        <input type="password" class="form-control bg-dark text-white border-secondary" id="pw-new" autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label for="pw-confirm" class="form-label text-muted small" th:text="#{common.password.confirmNew}">新しいパスワード(確認)</label>
                        <input type="password" class="form-control bg-dark text-white border-secondary" id="pw-confirm" autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer border-dark">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">キャンセル</button>
                    <button type="button" class="btn btn-primary bg-gradient-blue border-0" id="btn-save-password" th:text="#{common.save}">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 横断検索 (Command Palette) モーダル -->
    <div sec:authorize="!hasRole('要員')" class="modal fade" id="globalSearchModal" tabindex="-1" aria-labelledby="globalSearchModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content bg-secondary text-white border-dark">
                <div class="modal-header border-dark py-2">
                    <label for="global-search-input" id="globalSearchModalLabel" class="visually-hidden" th:text="#{header.globalSearch.title}">横断検索</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="global-search-input" th:placeholder="#{header.globalSearch.placeholder}" placeholder="要員、顧客、案件、契約、請求、提案、見積を検索... (2文字以上)" autocomplete="off">
                    </div>
                    <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3" id="global-search-results" style="min-height: 250px;">
                    <div class="text-center text-muted py-5" id="global-search-placeholder">
                        <i class="bi bi-search fs-1 mb-2 d-block opacity-50"></i>
                        <span th:text="#{header.globalSearch.hint}">キーワードを2文字以上入力してください</span>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" th:replace="~{layout/sidebar :: sidebar}"></aside>

        <!-- Mobile Sidebar Backdrop -->
        <div class="sidebar-backdrop no-print" id="sidebar-backdrop"></div>

        <!-- Main Content Wrapper -->
        <div class="main-wrapper">
            <!-- Header -->
            <header th:replace="~{layout/header :: header}"></header>
            
            <!-- Page Content -->
            <main class="content-area p-4">
                <div layout:fragment="content">
                    <!-- Page specific content goes here -->
                </div>
            </main>
            
            <!-- Footer -->
            <footer class="footer mt-auto py-3 px-4 text-muted text-end">
                <small th:text="#{footer.copyright}">&copy; 2026 SES Manager Pro</small>
            </footer>
        </div>
    </div>

    <!-- jQuery -->
    <script src="/lib/jquery/jquery.min.js"></script>
    
    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 -->
    <link href="/lib/sweetalert2/sweetalert2.min.css" rel="stylesheet">
    <script src="/lib/sweetalert2/sweetalert2.all.min.js"></script>
    
    <!-- Chart.js (Loaded globally for convenience, used mainly in dashboard) -->
    <script src="/lib/chartjs/chart.umd.min.js"></script>
    
    <!-- Custom JS -->
    <script th:src="@{/js/i18n.js(lang=${#locale.toLanguageTag()},v=${#dates.createNow().getTime()})}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/pwa-queue.js}"></script>
    <script th:src="@{/js/profile.js}"></script>
    
    <!-- Additional JS from specific pages -->
    <th:block layout:fragment="page-js"></th:block>

</body>
</html>
