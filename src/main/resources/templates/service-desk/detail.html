<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{servicedesk.detail.pageTitle}">サービスデスク詳細</title>
    <style>
        .comment-internal {
            background-color: #2b2818;
            border-left: 4px solid #f59e0b;
        }
        .comment-portal {
            background-color: #1e293b;
            border-left: 4px solid #3b82f6;
        }
        .sla-card-running {
            border-top: 3px solid #10b981;
        }
        .sla-card-paused {
            border-top: 3px solid #f59e0b;
        }
        .sla-card-breached {
            border-top: 3px solid #ef4444;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4 py-3" th:data-request-id="${requestId}">
        <!-- Breadcrumb & Back -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/service-desk/requests}" class="text-secondary text-decoration-none" th:text="#{servicedesk.title}">サービスデスク</a></li>
                    <li class="breadcrumb-item active text-white" aria-current="page" id="breadcrumbReqNo" th:text="#{servicedesk.detail.breadcrumb}">リクエスト詳細</li>
                </ol>
            </nav>
            <a th:href="@{/service-desk/requests}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i><span th:text="#{servicedesk.detail.backToList}">一覧に戻る</span>
            </a>
        </div>

        <!-- Request Summary Header Card -->
        <div class="card bg-secondary border-0 mb-4 shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="badge bg-dark fs-6" id="requestNoBadge">REQ-XXXX</span>
                            <span class="badge" id="priorityBadge">P2</span>
                            <span class="badge" id="categoryBadge" th:text="#{servicedesk.field.category}">カテゴリ</span>
                            <span class="badge" id="statusBadge" th:text="#{common.status}">ステータス</span>
                            <!-- 顧客ポータルへ出す範囲か（顧客公開対象／社内限定）。JSで描画する -->
                            <span id="portalVisibilityBadge"></span>
                        </div>
                        <h2 class="h4 text-white fw-bold mb-1" id="subjectHeader" th:text="#{common.loading}">読み込み中...</h2>
                        <div class="text-secondary small d-flex gap-3 flex-wrap">
                            <span><i class="bi bi-building me-1"></i><span id="customerName">-</span></span>
                            <span><i class="bi bi-person me-1"></i><span th:text="#{servicedesk.detail.ownerLabel}">担当:</span> <span id="ownerUserName" th:text="#{servicedesk.detail.unassigned}">未割当</span></span>
                            <span><i class="bi bi-calendar-event me-1"></i><span th:text="#{servicedesk.detail.createdAtLabel}">起票:</span> <span id="createdAt">-</span></span>
                        </div>
                    </div>
                    <!-- Status Actions Dropdown / Buttons -->
                    <div class="d-flex gap-2" id="statusActionButtons">
                        <!-- JSで動的レンダリング -->
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Details & Timeline -->
            <div class="col-lg-8">
                <!-- Description Card -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-card-text me-2 text-accent-blue"></i><span th:text="#{servicedesk.detail.descriptionCard}">問い合わせ詳細内容</span>
                    </div>
                    <div class="card-body">
                        <p class="text-white mb-0" id="descriptionText" style="white-space: pre-wrap;" th:text="#{common.loading}">読み込み中...</p>
                    </div>
                </div>

                <!-- Timeline / Comments Section -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark d-flex justify-content-between align-items-center">
                        <span class="text-white fw-bold">
                            <i class="bi bi-chat-left-text me-2 text-accent-blue"></i><span th:text="#{servicedesk.detail.timeline}">タイムライン・コメント履歴</span>
                        </span>
                    </div>
                    <div class="card-body p-3" id="commentsContainer">
                        <div class="text-center py-3 text-secondary" th:text="#{servicedesk.detail.commentsLoading}">コメントを読み込み中...</div>
                    </div>
                </div>

                <!-- Add Comment Form Card -->
                <div class="card bg-secondary border-0 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-pencil-square me-2 text-accent-blue"></i><span th:text="#{servicedesk.detail.postComment}">コメント・返信の投稿</span>
                    </div>
                    <div class="card-body">
                        <form id="commentForm">
                            <div class="mb-3">
                                <label class="form-label text-secondary small fw-bold" th:text="#{servicedesk.detail.visibility}">公開範囲</label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="visibility" id="visPortal" value="PORTAL_VISIBLE" checked>
                                        <label class="form-check-label text-white" for="visPortal">
                                            <i class="bi bi-globe me-1 text-primary"></i><span th:text="#{servicedesk.detail.visPortal}">顧客ポータル公開返信</span>
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="visibility" id="visInternal" value="INTERNAL">
                                        <label class="form-check-label text-warning" for="visInternal">
                                            <i class="bi bi-lock-fill me-1"></i><span th:text="#{servicedesk.detail.visInternal}">社内限定メモ (顧客には非公開)</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <textarea class="form-control" id="commentTextInput" rows="3" th:placeholder="#{servicedesk.detail.commentPlaceholder}" placeholder="コメントまたは社内メモを入力してください..." required></textarea>
                            </div>
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary" id="submitCommentBtn">
                                    <i class="bi bi-send me-1"></i><span th:text="#{servicedesk.detail.submitComment}">投稿する</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column: SLA & Metadata & CSAT -->
            <div class="col-lg-4">
                <!-- SLA Status Card -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm" id="slaCard">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-clock-history me-2 text-accent-blue"></i><span th:text="#{servicedesk.detail.slaCard}">SLA計時・遵守状況</span>
                    </div>
                    <div class="card-body" id="slaCardBody">
                        <div class="text-center py-2 text-secondary" th:text="#{servicedesk.detail.slaLoading}">SLA情報を取得中...</div>
                    </div>
                </div>

                <!-- CSAT Card (if answered) -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm d-none" id="csatCard">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-star-fill me-2 text-warning"></i><span th:text="#{servicedesk.detail.csatCard}">顧客満足度評価 (CSAT)</span>
                    </div>
                    <div class="card-body" id="csatCardBody">
                        <div class="fs-4 text-warning mb-1" id="csatStars">★★★★★</div>
                        <p class="text-white small mb-0" id="csatCommentText"></p>
                    </div>
                </div>

                <!-- Request Metadata Card -->
                <div class="card bg-secondary border-0 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-info-circle me-2 text-accent-blue"></i><span th:text="#{servicedesk.detail.metaCard}">関連メタデータ</span>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush bg-transparent">
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span th:text="#{servicedesk.detail.metaContact}">顧客担当者:</span>
                                <span class="text-white" id="metaContactName">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span th:text="#{servicedesk.detail.metaContract}">関連契約:</span>
                                <span class="text-white" id="metaContractCode">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span th:text="#{servicedesk.detail.metaProject}">関連案件:</span>
                                <span class="text-white" id="metaProjectName">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span th:text="#{servicedesk.detail.metaEngineer}">関連要員:</span>
                                <span class="text-white" id="metaEngineerName">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span th:text="#{servicedesk.detail.metaChannel}">受付経路:</span>
                                <span class="text-white" id="metaChannel">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span th:text="#{servicedesk.detail.metaReopenCount}">再オープン回数:</span>
                                <span class="text-white" id="metaReopenCount">0</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/service-desk.js}"></script>
</th:block>
</body>
</html>
