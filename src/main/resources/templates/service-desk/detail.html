<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>サービスデスク詳細 - SES Manager Pro</title>
    <style>
        .comment-internal {
            background-color: #2b2818;
            border-left: 4px solid #f59e0b;
        }
        .comment-portal {
            background-color: #1e293b;
            border-left: 4px solid #3b82f6;
        }
        .sla-card-running {
            border-top: 3px solid #10b981;
        }
        .sla-card-paused {
            border-top: 3px solid #f59e0b;
        }
        .sla-card-breached {
            border-top: 3px solid #ef4444;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4 py-3" th:data-request-id="${requestId}">
        <!-- Breadcrumb & Back -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/service-desk/requests}" class="text-secondary text-decoration-none">サービスデスク</a></li>
                    <li class="breadcrumb-item active text-white" aria-current="page" id="breadcrumbReqNo">リクエスト詳細</li>
                </ol>
            </nav>
            <a th:href="@{/service-desk/requests}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>一覧に戻る
            </a>
        </div>

        <!-- Request Main Header Card -->
        <div class="card bg-secondary border-0 mb-4 shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span class="fs-4 fw-bold text-white" id="reqNoText">REQ-XXXXXX</span>
                            <span id="statusBadge" class="badge bg-primary fs-6">RECEIVED</span>
                            <span id="priorityBadge" class="badge bg-danger fs-6">P1</span>
                            <span id="categoryBadge" class="badge bg-dark fs-6">CONTRACT</span>
                        </div>
                        <h2 class="h4 text-white fw-bold mb-1" id="subjectText">件名読み込み中...</h2>
                        <div class="text-secondary small">
                            <span class="me-3"><i class="bi bi-building me-1"></i>顧客: <strong class="text-white" id="customerNameText">-</strong></span>
                            <span class="me-3"><i class="bi bi-calendar me-1"></i>起票日時: <span id="createdAtText">-</span></span>
                            <span><i class="bi bi-person me-1"></i>社内担当: <span id="ownerUserNameText">未設定</span></span>
                        </div>
                    </div>
                    <!-- Status Actions Dropdown / Buttons -->
                    <div class="d-flex gap-2" id="statusActionButtons">
                        <!-- JSで動的レンダリング -->
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Details & Timeline -->
            <div class="col-lg-8">
                <!-- Description Card -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-card-text me-2 text-accent-blue"></i>問い合わせ詳細内容
                    </div>
                    <div class="card-body">
                        <p class="text-white mb-0" id="descriptionText" style="white-space: pre-wrap;">読み込み中...</p>
                    </div>
                </div>

                <!-- Timeline / Comments Section -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark d-flex justify-content-between align-items-center">
                        <span class="text-white fw-bold">
                            <i class="bi bi-chat-left-text me-2 text-accent-blue"></i>タイムライン・コメント履歴
                        </span>
                    </div>
                    <div class="card-body p-3" id="commentsContainer">
                        <div class="text-center py-3 text-secondary">コメントを読み込み中...</div>
                    </div>
                </div>

                <!-- Add Comment Form Card -->
                <div class="card bg-secondary border-0 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-pencil-square me-2 text-accent-blue"></i>コメント・返信の投稿
                    </div>
                    <div class="card-body">
                        <form id="commentForm">
                            <div class="mb-3">
                                <label class="form-label text-secondary small fw-bold">公開範囲</label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="visibility" id="visPortal" value="PORTAL_VISIBLE" checked>
                                        <label class="form-check-label text-white" for="visPortal">
                                            <i class="bi bi-globe me-1 text-primary"></i>顧客ポータル公開返信
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="visibility" id="visInternal" value="INTERNAL">
                                        <label class="form-check-label text-warning" for="visInternal">
                                            <i class="bi bi-lock-fill me-1"></i>社内限定メモ (顧客には非公開)
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <textarea class="form-control" id="commentTextInput" rows="3" placeholder="コメントまたは社内メモを入力してください..." required></textarea>
                            </div>
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary" id="submitCommentBtn">
                                    <i class="bi bi-send me-1"></i>投稿する
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Column: SLA & Metadata & CSAT -->
            <div class="col-lg-4">
                <!-- SLA Status Card -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm" id="slaCard">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-clock-history me-2 text-accent-blue"></i>SLA計時・遵守状況
                    </div>
                    <div class="card-body" id="slaCardBody">
                        <div class="text-center py-2 text-secondary">SLA情報を取得中...</div>
                    </div>
                </div>

                <!-- CSAT Card (if answered) -->
                <div class="card bg-secondary border-0 mb-4 shadow-sm d-none" id="csatCard">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-star-fill me-2 text-warning"></i>顧客満足度評価 (CSAT)
                    </div>
                    <div class="card-body" id="csatCardBody">
                        <div class="fs-4 text-warning mb-1" id="csatStars">★★★★★</div>
                        <p class="text-white small mb-0" id="csatCommentText"></p>
                    </div>
                </div>

                <!-- Request Metadata Card -->
                <div class="card bg-secondary border-0 shadow-sm">
                    <div class="card-header bg-transparent border-bottom border-dark text-white fw-bold">
                        <i class="bi bi-info-circle me-2 text-accent-blue"></i>関連メタデータ
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush bg-transparent">
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span>顧客担当者:</span>
                                <span class="text-white" id="metaContactName">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span>関連契約:</span>
                                <span class="text-white" id="metaContractCode">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span>関連案件:</span>
                                <span class="text-white" id="metaProjectName">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span>関連要員:</span>
                                <span class="text-white" id="metaEngineerName">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span>受付経路:</span>
                                <span class="text-white" id="metaChannel">-</span>
                            </li>
                            <li class="list-group-item bg-transparent text-secondary d-flex justify-content-between">
                                <span>再オープン回数:</span>
                                <span class="text-white" id="metaReopenCount">0</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/service-desk.js}"></script>
</th:block>
</body>
</html>
