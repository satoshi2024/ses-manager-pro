<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="#{servicedesk.list.pageTitle}">サービスデスク・問い合わせ管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid px-4 py-3">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0 text-white fw-bold">
                    <i class="bi bi-headset me-2 text-accent-blue"></i><span th:text="#{servicedesk.list.pageTitle}">サービスデスク・問い合わせ管理</span>
                </h1>
                <p class="text-secondary small mb-0" th:text="#{servicedesk.list.subtitle}">顧客からの問い合わせ・課題の一元管理とSLA監視</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" id="btnExportCsv">
                    <i class="bi bi-download me-1"></i><span th:text="#{servicedesk.list.exportCsv}">CSVエクスポート</span>
                </button>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newRequestModal">
                    <i class="bi bi-plus-lg me-1"></i><span th:text="#{servicedesk.list.newRequest}">新規起票</span>
                </button>
            </div>
        </div>

        <!-- Search & Filter Card -->
        <div class="card bg-secondary border-0 mb-4 shadow-sm">
            <div class="card-body">
                <form id="searchForm" class="row g-3 align-items-center">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="keyword" th:placeholder="#{servicedesk.list.keywordPlaceholder}" placeholder="番号・件名・本文で検索">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="statusFilter">
                            <option value="" th:text="#{servicedesk.list.allStatuses}">全てのステータス</option>
                            <option value="RECEIVED" th:text="|#{servicedesk.status.received} (RECEIVED)|">受付 (RECEIVED)</option>
                            <option value="IN_PROGRESS" th:text="|#{servicedesk.status.inProgress} (IN_PROGRESS)|">対応中 (IN_PROGRESS)</option>
                            <option value="WAITING_CUSTOMER" th:text="|#{servicedesk.status.waitingCustomer} (WAITING_CUSTOMER)|">顧客確認待ち (WAITING_CUSTOMER)</option>
                            <option value="RESOLVED" th:text="|#{servicedesk.status.resolved} (RESOLVED)|">解決 (RESOLVED)</option>
                            <option value="CLOSED" th:text="|#{servicedesk.status.closed} (CLOSED)|">終了 (CLOSED)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="priorityFilter">
                            <option value="" th:text="#{servicedesk.list.allPriorities}">全ての優先度</option>
                            <option value="P0" th:text="#{servicedesk.priority.p0}">緊急 (P0)</option>
                            <option value="P1" th:text="#{servicedesk.priority.p1}">高 (P1)</option>
                            <option value="P2" th:text="#{servicedesk.priority.p2}">中 (P2)</option>
                            <option value="P3" th:text="#{servicedesk.priority.p3}">低 (P3)</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="categoryFilter">
                            <option value="" th:text="#{servicedesk.list.allCategories}">全てのカテゴリ</option>
                            <option value="CONTRACT" th:text="#{servicedesk.category.contract}">契約関連</option>
                            <option value="BILLING" th:text="#{servicedesk.category.billing}">請求関連</option>
                            <option value="ATTENDANCE" th:text="#{servicedesk.category.attendance}">勤怠関連</option>
                            <option value="QUALITY" th:text="#{servicedesk.category.quality}">品質・成果物</option>
                            <option value="SYSTEM" th:text="#{servicedesk.category.system}">システム障害</option>
                            <option value="OTHER" th:text="#{servicedesk.category.other}">その他</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-accent-blue flex-grow-1">
                            <i class="bi bi-search me-1"></i><span th:text="#{common.search}">検索</span>
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="resetBtn" th:text="#{common.reset}">リセット</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Requests Table Card -->
        <div class="card bg-secondary border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-white" id="requestsTable">
                        <thead class="table-dark">
                            <tr>
                                <th th:text="#{servicedesk.col.requestNo}">リクエスト番号</th>
                                <th th:text="#{servicedesk.col.customer}">顧客名</th>
                                <th th:text="#{servicedesk.col.category}">カテゴリ</th>
                                <th th:text="#{servicedesk.col.priority}">優先度</th>
                                <th th:text="#{servicedesk.col.subject}">件名</th>
                                <th th:text="#{servicedesk.col.owner}">担当者</th>
                                <th th:text="#{common.status}">ステータス</th>
                                <th th:text="#{servicedesk.col.resolveDeadline}">SLA解決期限</th>
                                <th th:text="#{servicedesk.col.createdAt}">登録日時</th>
                                <th class="text-end" th:text="#{common.actions}">操作</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody">
                            <tr>
                                <td colspan="10" class="text-center py-4 text-secondary">
                                    <div class="spinner-border spinner-border-sm me-2" role="status"></div><span th:text="#{common.loading}">読み込み中...</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Pagination -->
            <div class="card-footer bg-secondary border-0 d-flex justify-content-between align-items-center py-3">
                <span class="small text-secondary" id="pageInfo" th:text="#{servicedesk.list.pageInfo(0, 0, 0)}">0 件中 0 - 0 件を表示</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- New Request Modal -->
    <div class="modal fade" id="newRequestModal" tabindex="-1" aria-labelledby="newRequestModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-secondary text-white border-0 shadow">
                <div class="modal-header border-bottom border-dark">
                    <h5 class="modal-title fw-bold" id="newRequestModalLabel">
                        <i class="bi bi-plus-circle me-2 text-accent-blue"></i><span th:text="#{servicedesk.list.newRequestTitle}">新規問い合わせ起票</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" th:aria-label="#{common.close}" aria-label="Close"></button>
                </div>
                <form id="newRequestForm">
                    <div class="modal-body row g-3">
                        <div class="col-md-6">
                            <label class="form-label required"><span th:text="#{servicedesk.field.customer}">顧客</span> <span class="text-danger">*</span></label>
                            <select class="form-select" id="newCustomerId" required>
                                <option value="" th:text="#{servicedesk.field.selectCustomer}">顧客を選択してください</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" th:text="#{servicedesk.field.channel}">受付チャネル</label>
                            <select class="form-select" id="newChannel">
                                <option value="PORTAL" th:text="#{servicedesk.channel.portal}">ポータル</option>
                                <option value="EMAIL" selected th:text="#{servicedesk.channel.email}">メール</option>
                                <option value="PHONE" th:text="#{servicedesk.channel.phone}">電話</option>
                                <option value="MEETING" th:text="#{servicedesk.channel.meeting}">定例会・対面</option>
                                <option value="INTERNAL" th:text="#{servicedesk.channel.internal}">社内起票</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required"><span th:text="#{servicedesk.field.category}">カテゴリ</span> <span class="text-danger">*</span></label>
                            <select class="form-select" id="newCategory" required>
                                <option value="CONTRACT" th:text="#{servicedesk.category.contract}">契約関連</option>
                                <option value="BILLING" th:text="#{servicedesk.category.billing}">請求関連</option>
                                <option value="ATTENDANCE" th:text="#{servicedesk.category.attendance}">勤怠関連</option>
                                <option value="QUALITY" th:text="#{servicedesk.category.quality}">品質・成果物</option>
                                <option value="SYSTEM" th:text="#{servicedesk.category.system}">システム障害</option>
                                <option value="OTHER" selected th:text="#{servicedesk.category.other}">その他</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required"><span th:text="#{servicedesk.field.prioritySla}">優先度 (SLAポリシー)</span> <span class="text-danger">*</span></label>
                            <select class="form-select" id="newPriority" required>
                                <option value="P0" th:text="#{servicedesk.priority.p0Sla}">緊急 (P0: 応答1h / 解決4h)</option>
                                <option value="P1" th:text="#{servicedesk.priority.p1Sla}">高 (P1: 応答2h / 解決8h)</option>
                                <option value="P2" selected th:text="#{servicedesk.priority.p2Sla}">中 (P2: 応答4h / 解決24h)</option>
                                <option value="P3" th:text="#{servicedesk.priority.p3Sla}">低 (P3: 応答8h / 解決48h)</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label required"><span th:text="#{servicedesk.field.subject}">件名</span> <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="newSubject" th:placeholder="#{servicedesk.field.subjectPlaceholder}" placeholder="問い合わせの概要を入力" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label required"><span th:text="#{servicedesk.field.description}">詳細内容</span> <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="newDescription" rows="4" th:placeholder="#{servicedesk.field.descriptionPlaceholder}" placeholder="詳細な内容や背景を入力してください" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-dark">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">キャンセル</button>
                        <button type="submit" class="btn btn-primary" id="saveRequestBtn">
                            <i class="bi bi-check-lg me-1"></i><span th:text="#{servicedesk.list.submitRequest}">起票する</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script th:src="@{/js/modules/service-desk.js}"></script>
</th:block>
</body>
</html>
