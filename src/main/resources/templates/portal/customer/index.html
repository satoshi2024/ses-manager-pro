<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{portal.customer.title}">顧客ポータル</title>
    <link rel="stylesheet" th:href="@{/portal/css/portal.css}">
    <link rel="stylesheet" th:href="@{/lib/bootstrap/css/bootstrap.min.css}">
</head>
<body class="portal-body">
<header class="portal-header">
    <span class="portal-header-brand" th:text="#{app.title}">SES管理プロ</span>
    <span class="portal-header-user" id="portalHeaderUser"></span>
    <label class="portal-notify-toggle"><input type="checkbox" id="notifyEmailToggle"> <span th:text="#{portal.notification.preferenceLabel}">通知</span></label>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="logoutButton"
            th:text="#{portal.logout}">ログアウト</button>
</header>

<nav class="portal-tabs" aria-label="メニュー">
    <button type="button" class="portal-tab active" data-tab="acceptances"
            th:text="#{portal.customer.tab.acceptances}">検収</button>
    <button type="button" class="portal-tab" data-tab="contracts"
            th:text="#{portal.customer.tab.contracts}">契約</button>
    <button type="button" class="portal-tab" data-tab="invoices"
            th:text="#{portal.customer.tab.invoices}">請求</button>
    <button type="button" class="portal-tab" data-tab="quotations"
            th:text="#{portal.customer.tab.quotations}">見積</button>
    <button type="button" class="portal-tab" data-tab="sales-orders"
            th:text="#{portal.customer.tab.salesOrders}">注文請</button>
    <button type="button" class="portal-tab" data-tab="service-desk" id="tabBtnServiceDesk">問い合わせ</button>
</nav>

<main class="portal-container" role="main">
    <div class="alert alert-danger d-none" id="portalError" role="alert" aria-live="polite"></div>

    <!-- 検収 -->
    <section id="tab-acceptances" class="portal-tab-panel">
        <h2 th:text="#{portal.customer.acceptances.title}">月次作業報告・検収</h2>
        <p class="portal-muted" th:text="#{portal.customer.acceptances.guide}">作業報告を確認し、検収または差戻しを行ってください。</p>
        <div class="portal-list" id="acceptanceList"></div>
    </section>

    <!-- 契約 -->
    <section id="tab-contracts" class="portal-tab-panel d-none">
        <h2 th:text="#{portal.customer.contracts.title}">契約</h2>
        <div class="portal-list" id="contractList"></div>
    </section>

    <!-- 請求 -->
    <section id="tab-invoices" class="portal-tab-panel d-none">
        <h2 th:text="#{portal.customer.invoices.title}">請求</h2>
        <p class="portal-muted" th:text="#{portal.customer.invoices.guide}">受領確認・支払予定日・問い合わせを登録できます。</p>
        <div class="portal-list" id="invoiceList"></div>
    </section>

    <!-- 見積 -->
    <section id="tab-quotations" class="portal-tab-panel d-none">
        <h2 th:text="#{portal.customer.quotations.title}">見積</h2>
        <div class="portal-list" id="quotationList"></div>
    </section>

    <!-- 注文請 -->
    <section id="tab-sales-orders" class="portal-tab-panel d-none">
        <h2 th:text="#{portal.customer.salesOrders.title}">注文請</h2>
        <div class="portal-list" id="salesOrderList"></div>
    </section>

    <!-- 問い合わせ (サービスデスク) -->
    <section id="tab-service-desk" class="portal-tab-panel d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2>問い合わせ・サポート</h2>
                <p class="portal-muted mb-0">サポート窓口への問い合わせ起票・進捗確認・返信を行えます。</p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="btnOpenNewRequestModal" data-bs-toggle="modal" data-bs-target="#portalNewRequestModal">
                ＋ 新規問い合わせ起票
            </button>
        </div>
        <div class="portal-list" id="serviceDeskList">
            <div class="text-muted small py-3">読み込み中...</div>
        </div>
    </section>
</main>

<!-- 検収操作モーダル -->
<div class="modal fade" id="acceptanceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="acceptanceModalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <dl class="portal-detail" id="acceptanceModalBody"></dl>
                <div class="alert alert-danger d-none" id="acceptanceModalError" role="alert" aria-live="polite"></div>
                <div class="mb-3 d-none" id="rejectCommentGroup">
                    <label for="rejectComment" class="form-label" th:text="#{portal.customer.rejectComment}">差戻し理由</label>
                    <textarea class="form-control" id="rejectComment" rows="3" maxlength="1000"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" id="acceptButton"
                        th:text="#{portal.customer.accept}">検収する</button>
                <button type="button" class="btn btn-warning" id="rejectButton"
                        th:text="#{portal.customer.reject}">差戻す</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                        th:text="#{portal.close}">閉じる</button>
            </div>
        </div>
    </div>
</div>

<!-- 請求登録モーダル -->
<div class="modal fade" id="invoiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="invoiceModalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <dl class="portal-detail" id="invoiceModalBody"></dl>
                <div class="alert alert-danger d-none" id="invoiceModalError" role="alert" aria-live="polite"></div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="invoiceReceived">
                    <label class="form-check-label" for="invoiceReceived"
                           th:text="#{portal.customer.invoice.received}">受領確認済みにする</label>
                </div>
                <div class="mb-3">
                    <label for="invoicePaymentDate" class="form-label"
                           th:text="#{portal.customer.invoice.paymentDate}">支払予定日</label>
                    <input type="date" class="form-control" id="invoicePaymentDate">
                </div>
                <div class="mb-3">
                    <label for="invoiceInquiry" class="form-label"
                           th:text="#{portal.customer.invoice.inquiry}">問い合わせ</label>
                    <textarea class="form-control" id="invoiceInquiry" rows="3" maxlength="1000"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="invoiceSaveButton"
                        th:text="#{portal.save}">登録</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                        th:text="#{portal.close}">閉じる</button>
            </div>
        </div>
    </div>
</div>

<!-- ポータル新規問い合わせ起票モーダル -->
<div class="modal fade" id="portalNewRequestModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新規問い合わせ起票</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="portalNewRequestForm">
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="portalReqModalError" role="alert"></div>
                    <div class="mb-3">
                        <label class="form-label required">カテゴリ <span class="text-danger">*</span></label>
                        <select class="form-select" id="portalNewCategory" required>
                            <option value="CONTRACT">契約関連</option>
                            <option value="BILLING">請求関連</option>
                            <option value="ATTENDANCE">勤怠関連</option>
                            <option value="QUALITY">品質・成果物</option>
                            <option value="SYSTEM">システム障害</option>
                            <option value="OTHER" selected>その他</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">優先度 <span class="text-danger">*</span></label>
                        <select class="form-select" id="portalNewPriority" required>
                            <option value="P0">緊急 (P0: 業務停止・重大障害)</option>
                            <option value="P1">高 (P1: 重要業務への影響)</option>
                            <option value="P2" selected>中 (P2: 通常のお問い合わせ)</option>
                            <option value="P3">低 (P3: 軽微なご相談)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">件名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="portalNewSubject" placeholder="お問い合わせ件名" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required">詳細内容 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="portalNewDescription" rows="4" placeholder="詳細な内容やご要望を入力してください" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" id="btnSubmitPortalReq">起票する</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- CSAT 満足度アンケート回答モーダル -->
<div class="modal fade" id="portalCsatModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">サポート満足度アンケート</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="portalCsatForm">
                <input type="hidden" id="csatRequestId">
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="portalCsatModalError" role="alert"></div>
                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold d-block mb-2">対応はいかがでしたか？</label>
                        <div class="btn-group" role="group" aria-label="CSAT rating">
                            <input type="radio" class="btn-check" name="csatScore" id="score1" value="1" autocomplete="off">
                            <label class="btn btn-outline-danger" for="score1">1 不満</label>

                            <input type="radio" class="btn-check" name="csatScore" id="score2" value="2" autocomplete="off">
                            <label class="btn btn-outline-warning" for="score2">2 やや不満</label>

                            <input type="radio" class="btn-check" name="csatScore" id="score3" value="3" autocomplete="off">
                            <label class="btn btn-outline-secondary" for="score3">3 普通</label>

                            <input type="radio" class="btn-check" name="csatScore" id="score4" value="4" autocomplete="off">
                            <label class="btn btn-outline-info" for="score4">4 満足</label>

                            <input type="radio" class="btn-check" name="csatScore" id="score5" value="5" autocomplete="off" checked>
                            <label class="btn btn-outline-success" for="score5">5 大変満足</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">フィードバック・ご意見 (任意)</label>
                        <textarea class="form-control" id="csatCommentInput" rows="3" placeholder="対応へのご意見や感謝のメッセージ等があればご記入ください"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success" id="btnSubmitCsat">回答を送信する</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/lib/jquery/jquery.min.js}"></script>
<script th:src="@{/lib/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/portal/js/portal.js}"></script>
<script th:src="@{/portal/js/portal-service-desk.js}"></script>
<script>
    PortalAuth.initCustomerPage();
    PortalServiceDesk.init();
</script>
</body>
</html>
