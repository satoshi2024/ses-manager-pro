<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{closing.title}">月次締めチェックリスト</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <form id="searchForm" class="row mb-3 align-items-end" onsubmit="event.preventDefault();">
                <div class="col-md-3">
                    <input type="month" id="closingMonth" name="month" class="form-control">
                </div>
                <div class="col-md-6">
                    <button type="button" id="btnLoadClosing" class="btn btn-secondary" th:text="#{common.btn.search}">検索</button>
                    <button type="button" th:if="${canConfirm}" id="btnConfirmClosing" class="btn btn-success" th:text="#{approval.request}">締めを申請</button>
                    <button type="button" th:if="${canReopen}" id="btnReopenClosing" class="btn btn-outline-warning d-none" th:text="#{approval.request}">再開を申請</button>
                </div>
            </form>
            <div id="closedBanner" class="alert alert-info d-none"></div>
            <div id="diffWarning" class="alert alert-warning d-none" th:text="#{closing.status.diffWarning}"></div>
            <div id="closingCards" class="row g-3"></div>
            <div id="closingDetail" class="mt-3"></div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js">
    <script src="/js/modules/monthly-closing.js"></script>
</th:block>
</body>
</html>
