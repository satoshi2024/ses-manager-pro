# ========================================
# SES Manager Pro - メイン設定
# ========================================
server:
  port: 8080
  forward-headers-strategy: framework
  # ===== 同時接続の受け口 =====
  # threads.max を超えた分は accept-count まで待たされ、それも超えると接続拒否になる。
  # ただし実際の上限は DB コネクションプール(spring.datasource.hikari.maximum-pool-size)であり、
  # スレッドだけ増やしても待ち行列が伸びるだけなので、両者は必ずセットで見直すこと。
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
  # ===== エラー表示（顧客に生の情報を見せない） =====
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-exception: false

# 組織スコープ(R3)。V60が既存ユーザーと既存要員をLEGACY組織へbackfillするため、
# 適用直後でも誰も空scopeにならない。したがって既定で有効にする。
# 段階導入したい場合のみ ORGANIZATION_SCOPE_ENABLED=false で無効化できる。
# 無効時は全ロールが組織条件なしになる（従来どおりmenu権限とDataScopeだけが効く）。
organization:
  scope:
    enabled: ${ORGANIZATION_SCOPE_ENABLED:true}

spring:
  profiles:
    active: dev

  # ===== マルチパート（ファイルアップロード）上限 =====
  # 個別ファイルはFileKindでさらに厳格に検証する（スキルシート10MB/写真2MB）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  # ===== データソース（接続情報は環境変数で上書き可能。既定値はローカル開発用） =====
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ses_manager_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 接続プールは「大きいほど速い」ものではない。MySQL側のCPU/ディスク並列度を超えると
      # コンテキストスイッチで逆に遅くなるため、目安は (DBのコア数 * 2) 程度。
      # 環境ごとにDBのスペックが違うので env で上書きできるようにしてある。
      # ここが同時実行数の実質的な上限になる: 1リクエストが複数クエリを打つ間は接続を保持するため、
      # 「同時アクセス数 >> pool-size」の状況では待ちが connection-timeout まで積み上がり
      # SQLTransientConnectionException で 500 になる。高負荷対策は pool を上げることではなく
      # 1リクエストあたりのクエリ数を減らす/キャッシュすること。
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      # 接続が返却されずに滞留している箇所を検知する(0=無効)。既定60秒。
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:60000}

  # H2 Console (Disabled since we use MySQL now)
  h2:
    console:
      enabled: false

  # ===== Flyway（DBマイグレーション。旧「001〜009を手動実行」手順を自動化） =====
  # 既存の手動構築済みDBに対して初めて導入する場合は baseline-on-migrate により
  # 「既にV9まで適用済み」とみなして以降のマイグレーションのみ実行する。
  # prod では application-prod.yml が db/migration-prod を追加ロケーションとして
  # 差し込み、admin初期パスワードのBCrypt化(Repeatable)のみ prod 限定で適用する。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 過去番号の未適用migrationを後から適用しない。legacy preflightはFlyway外のrunbookで実行する。
    out-of-order: false
    baseline-on-migrate: true
    baseline-version: 9
    baseline-description: "手動SQL(001-009)適用済みベースライン"

  # ===== Thymeleaf =====
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # ===== メッセージリソース =====
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false   # 必須: サーバーOSロケールへ落ちるのを防ぐ
    use-code-as-default-message: true  # キー欠落でも画面が死なない(欠落はテストで検出)

  # ===== Jackson (JSON) =====
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Tokyo
    serialization:
      write-dates-as-timestamps: false

  # ===== メール送信（SMTP。host未設定時はドライラン動作） =====
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ===== MyBatis Plus =====
# 本プロジェクトはXMLマッパーを持たない（クエリはLambdaQueryWrapper/@Selectで完結）ため
# mapper-locations は設定しない。
mybatis-plus:
  type-aliases-package: com.ses.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null

# ===== ログ =====
logging:
  level:
    root: INFO
    com.ses: DEBUG
    com.baomidou.mybatisplus: DEBUG

# ===== アプリ固有設定 =====
app:
  scheduler:
    lock:
      # 本番の共有DBロックはDBサーバ時刻を使う。H2 test profileだけfalseで上書きする。
      use-db-time: ${SCHEDULER_LOCK_USE_DB_TIME:true}
  # ===== 一覧エクスポート =====
  # 大量データはキーセットページング＋レスポンス直書きで処理し、同時実行数も制限する。
  export:
    batch-size: ${EXPORT_BATCH_SIZE:500}
    max-rows: ${EXPORT_MAX_ROWS:50000}
    max-scan-rows: ${EXPORT_MAX_SCAN_ROWS:100000}
    max-concurrent: ${EXPORT_MAX_CONCURRENT:2}
  # ===== ダッシュボード集計のキャッシュ =====
  # ダッシュボードは1リクエストで十数本のクエリを撃つ最重量画面。中身はKPIの集計値で
  # 秒単位の鮮度は不要なため短時間キャッシュする。0以下でキャッシュ無効。
  # キャッシュキーにはデータスコープ(閲覧者ごとの母集団)を含めている(CacheConfig参照)。
  cache:
    dashboard-ttl-seconds: ${DASHBOARD_CACHE_TTL:60}
    dashboard-max-size: ${DASHBOARD_CACHE_MAX:500}
  security:
    require-https: false
    # X-Forwarded-For を読むのは remoteAddr がこのリストに含まれるときだけ（CIDR可。空=常に remoteAddr）
    trusted-proxies: ${TRUSTED_PROXIES:}
    oidc:
      enabled: ${OIDC_ENABLED:false}
      local-login-enabled: ${LOCAL_LOGIN_ENABLED:true}
      break-glass-login-enabled: ${BREAK_GLASS_LOGIN_ENABLED:true}
      tenant-id: ${OIDC_TENANT_ID:default}
      provider-registration-id: ${OIDC_PROVIDER_REGISTRATION_ID:enterprise}
      issuer-uri: ${OIDC_ISSUER_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      require-mfa-assurance: ${OIDC_REQUIRE_MFA_ASSURANCE:true}
      break-glass-usernames: ${BREAK_GLASS_USERNAMES:}
    mfa:
      enabled: ${MFA_ENABLED:true}
      required-for-break-glass: ${MFA_REQUIRED_FOR_BREAK_GLASS:true}
      issuer: ${MFA_ISSUER:SES Manager Pro}
      digits: ${MFA_DIGITS:6}
      period-seconds: ${MFA_PERIOD_SECONDS:30}
      clock-skew-steps: ${MFA_CLOCK_SKEW_STEPS:1}
      recovery-code-count: ${MFA_RECOVERY_CODE_COUNT:10}
      current-key-version: ${MFA_CURRENT_KEY_VERSION:v1}
      # rotation時はMFA_KEYRING_<VERSION>等をアプリ設定へ安全に注入し、旧versionも一定期間保持する。
      encryption-key: ${MFA_ENCRYPTION_KEY:dev-only-change-this-mfa-key}
    session:
      enabled: ${PERSISTENT_SESSION_ENABLED:true}
      idle-timeout-minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:30}
      max-lifetime-hours: ${SESSION_MAX_LIFETIME_HOURS:12}
      max-concurrent-sessions: ${SESSION_MAX_CONCURRENT:5}
      allow-untracked-sessions: ${ALLOW_UNTRACKED_SESSIONS:true}
      hash-key: ${SESSION_HASH_KEY:dev-only-change-this-session-key}
  # ファイルアップロード保存先（相対パスはアプリ起動ディレクトリ基準）
  upload:
    base-path: ${UPLOAD_BASE_PATH:./uploads}
    scanner-enabled: ${FILE_SCANNER_ENABLED:true}
    scanner-host: ${FILE_SCANNER_HOST:localhost}
    scanner-port: ${FILE_SCANNER_PORT:3310}
    scanner-connect-timeout-ms: ${FILE_SCANNER_CONNECT_TIMEOUT_MS:2000}
    scanner-read-timeout-ms: ${FILE_SCANNER_READ_TIMEOUT_MS:10000}
    legacy-migration-enabled: ${LEGACY_MIGRATION_ENABLED:true}
    contract-backfill-enabled: ${CONTRACT_BACKFILL_ENABLED:true}
  # メール差出人
  mail:
    from: ${MAIL_FROM:noreply@example.com}
  # ===== 一括操作 preview token HMAC（S05-P1-01） =====
  # 本番は BATCH_TOKEN_SECRET を secret store から注入すること。prod 未設定は起動 fail-fast。
  batch:
    token-secret: ${BATCH_TOKEN_SECRET:dev-only-change-this-batch-token-secret}
  # ===== デジタルインボイス（JP PINT。dev/test 既定は mock。prod は application-prod.yml） =====
  digital-invoice:
    provider: ${DIGITAL_INVOICE_PROVIDER:mock}
    webhook-hmac-secret: ${DIGITAL_INVOICE_WEBHOOK_HMAC_SECRET:dev-only-change-this-digital-invoice-hmac}
  # ===== 外部顧客/BPポータル（S13。内部管理画面と分離したchain/session/rate limit: G3） =====
  portal:
    # portal session cookie名（内部JSESSIONIDと分離）
    session-cookie-name: ${PORTAL_SESSION_COOKIE:PORTAL_SESSION}
    # session絶対期限（時間）
    session-max-lifetime-hours: ${PORTAL_SESSION_MAX_HOURS:12}
    # sessionアイドル期限（分）
    session-idle-timeout-minutes: ${PORTAL_SESSION_IDLE_MINUTES:30}
    # 同一userの同時session上限
    session-max-concurrent: ${PORTAL_SESSION_MAX_CONCURRENT:5}
    rate-limit:
      # login API（IPあたり/分）
      login-per-minute: ${PORTAL_RATE_LOGIN:10}
      # 招待受諾API（IPあたり/分）
      invite-per-minute: ${PORTAL_RATE_INVITE:10}
      # download API（userあたり/分）
      download-per-minute: ${PORTAL_RATE_DOWNLOAD:60}
      # upload API（userあたり/分）
      upload-per-minute: ${PORTAL_RATE_UPLOAD:20}
      # 検収API（userあたり/分）
      acceptance-per-minute: ${PORTAL_RATE_ACCEPTANCE:20}
      # MFA有効化API（IP+emailあたり/分。S13-P1-02）
      mfa-complete-per-minute: ${PORTAL_RATE_MFA_COMPLETE:10}
      # login失敗のアカウントロック（同一email。S13-XFF-01）
      login-failure-lock-threshold: ${PORTAL_LOGIN_LOCK_THRESHOLD:5}
      login-failure-lock-minutes: ${PORTAL_LOGIN_LOCK_MINUTES:15}
  # ===== PDF設定 =====
  pdf:
    # PDF出力用のCJKフォントパス（明示指定用）。
    # 未指定時は主要Linuxディストリビューションの標準パス（Noto Sans CJK等）を試行します。
    # Windowsローカル開発環境等の場合は "C:/Windows/Fonts/msgothic.ttc,0" 等を指定してください。
    font-path: ""
  # ===== スキルシート取込設定 =====
  resume:
    retention-days: 30

# ===== AI設定（将来のAPI接続用） =====
ai:
  enabled: true
  provider: mock
  external-send-enabled: false
  retention:
    redacted-days: 730
    raw-prompt-days: 0
  evaluation:
    min-segment-count: 5
    max-regression-pp: 5
    max-latency-p95-multiplier: 2.0
  # 以下は将来のAPI接続時に有効化
  # api-key: ${AI_API_KEY:}
  # api-url: https://your-resource.openai.azure.com/
  # model: gpt-4o
  # max-tokens: 4096

# ===== CloudSign（電子署名。本番enableはHFP-02総合gate PASS後） =====
cloudsign:
  # kill switch。falseの間は新規queue/dispatch/pollが動かない（ローカルPDF参照は維持）。
  enabled: ${CLOUDSIGN_ENABLED:false}
  # 接続先環境（SANDBOX / PRODUCTION）。公式allow-listのみ。
  environment: ${CLOUDSIGN_ENVIRONMENT:sandbox}
  # 公式allow-list外のURLを設定しない（prodで任意URLは拒否される）。
  base-url: ${CLOUDSIGN_BASE_URL:}
  # client ID（secret）。env/secret managerから注入する。平文をDB/log/APIへ出さない。
  client-id: ${CLOUDSIGN_CLIENT_ID:}
  # token有効期限(3600秒)から引く安全余裕
  token-safety-margin-seconds: ${CLOUDSIGN_TOKEN_SAFETY_MARGIN_SECONDS:60}
  connect-timeout-ms: ${CLOUDSIGN_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${CLOUDSIGN_READ_TIMEOUT_MS:15000}
  # 公式 body 50MB 上限と自システム上限の小さい方
  max-pdf-bytes: ${CLOUDSIGN_MAX_PDF_BYTES:52428800}
  # 同一token毎分のrequest上限（公式800を超えない）
  rate-limit-per-minute: ${CLOUDSIGN_RATE_LIMIT_PER_MINUTE:500}
  # mutation後のprovider反映待機（公式ガイド: 数秒〜10秒）
  mutation-reflect-wait-ms: ${CLOUDSIGN_MUTATION_REFLECT_WAIT_MS:3000}
  poll-batch-size: ${CLOUDSIGN_POLL_BATCH_SIZE:50}
  stale-claim-minutes: ${CLOUDSIGN_STALE_CLAIM_MINUTES:15}
  max-attempts: ${CLOUDSIGN_MAX_ATTEMPTS:5}
  instance-id: ${CLOUDSIGN_INSTANCE_ID:}
  # dispatch workerの実行cron（ShedLock付き）
  dispatch-cron: ${CLOUDSIGN_DISPATCH_CRON:*/5 * * * * *}
  # 状態pollingの実行cron（ShedLock付き）
  poll-cron: ${CLOUDSIGN_POLL_CRON:0 */2 * * * *}

# ===== freee連携（HFP-01: 給与・賞与参照。S11勤怠/S15会計も同じOAuth基盤を利用） =====
# 秘密値は環境変数からのみ供給する。api-base-url はS11/S15が使う会計API等の共通resource base（意味不変）。
# OAuthはaccounts host、人事労務APIはhr host へ分離する（HFP-01-R02/R03）。
freee:
  client-id: ${FREEE_CLIENT_ID:}
  client-secret: ${FREEE_CLIENT_SECRET:}
  redirect-uri: ${FREEE_REDIRECT_URI:http://localhost:8080/integrations/freee/callback}
  api-base-url: ${FREEE_API_BASE_URL:https://api.freee.co.jp}
  hr-api-base-url: ${FREEE_HR_API_BASE_URL:https://api.freee.co.jp/hr}
  oauth-base-url: ${FREEE_OAUTH_BASE_URL:https://accounts.secure.freee.co.jp/public_api}
  token-encryption-key: ${FREEE_TOKEN_ENCRYPTION_KEY:change-me-change-me-change-me-1234}

# ===== G2外部Review資格credential暗号化（§6.5） =====
# 値はdeployment secret storeから注入すること。prodプロファイルでは未設定・不正な鍵で起動時にfail-fastする。
# dev/testプロファイルは未設定時、テスト用の既定鍵v1へフォールバックする（本番へ持ち込まないこと）。
compliance:
  gate:
    credential-crypto:
      # 現在の鍵バージョン（^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$）
      current-key-version: ${COMPLIANCE_CREDENTIAL_CURRENT_KEY_VERSION:}
      # 鍵バージョンごとのAES-256鍵（32バイトをunpadded base64urlで指定。'='padding・空白禁止）
      keys:
        # v1: ${COMPLIANCE_CREDENTIAL_KEY_V1:}

# ===== G2 reviewer fingerprint HMAC鍵（§9・R23-P1-01） =====
# tenant別専用key namespace: compliance.gate.fingerprint-keys.{tenantId}
# 値はdeployment secret storeから注入すること。prodプロファイルではtenant設定の欠損・不正で起動時にfail-fastする。
# dev/testプロファイルはtenant未設定時のみテスト用の既定鍵v1へフォールバックする（本番へ持ち込まないこと）。
    fingerprint-keys:
      # default:
      #   current-key-version: ${COMPLIANCE_FINGERPRINT_CURRENT_KEY_VERSION:}
      #   keys:
      #     v1: ${COMPLIANCE_FINGERPRINT_KEY_V1:}
