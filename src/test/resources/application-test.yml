spring:
  datasource:
    # ACC-TEST-P1-004: 共有 mem DB。alphabetical 順序依存は禁止。更新テストは @Transactional でロールバックすること。
    # 並行更新の正しさは mysql タグの Testcontainers で検証する（H2 では証明しない）。
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations:
        - classpath:sql/test-schema-import-precleanup-h2.sql
        - classpath:db/migration/V1__create_tables.sql
        - classpath:db/migration/V2__init_master_data.sql
        - classpath:db/migration/V4__create_notification.sql
        - classpath:db/migration/V22__notification_visibility_and_menu_routes.sql
        - classpath:db/migration/V5__create_work_record_billing.sql
        - classpath:db/migration/V6__create_sales_activity.sql
        - classpath:db/migration/V7__create_analytics_report.sql
        - classpath:db/migration/V8__user_security_columns.sql
        - classpath:db/migration/V9__system_config_and_menu.sql
        - classpath:sql/schema-candidate-h2.sql
        - classpath:sql/schema-external-api-resource-isolation-h2.sql
        - classpath:sql/schema-organization-accounting-h2.sql
        - classpath:sql/schema-engineer-sales-h2.sql
        - classpath:db/migration/V34__data_scope_config.sql
        - classpath:sql/schema-audit-log-h2.sql
        - classpath:sql/schema-invoice-duedate-h2.sql
        - classpath:sql/schema-invoice-taxrate-h2.sql
        - classpath:sql/schema-contract-document-h2.sql
        - classpath:sql/schema-freee-payroll-h2.sql
        - classpath:sql/schema-ar-management-h2.sql
        # V52: 入金消込（FR-09）の銀行入金明細。入金消込のfreee反映をH2統合テストで通すために用意する
        - classpath:sql/schema-bank-deposit-h2.sql
        - classpath:sql/schema-quotation-h2.sql
        - classpath:sql/schema-self-service-h2.sql
        - classpath:sql/schema-price-history-h2.sql
        - classpath:sql/schema-resume-ingestion-h2.sql
        - classpath:sql/schema-project-ingestion-h2.sql
        - classpath:sql/schema-bp-availability-h2.sql
        - classpath:sql/schema-contract-renewal-h2.sql
        - classpath:sql/schema-labor-compliance-h2.sql
        - classpath:sql/schema-engineer-followup-h2.sql
        - classpath:sql/schema-shedlock-h2.sql
        - classpath:sql/schema-enterprise-identity-h2.sql
        - classpath:sql/schema-document-archive-h2.sql
        - classpath:sql/schema-productivity-h2.sql
        - classpath:sql/schema-bp-company-h2.sql
        - classpath:sql/schema-crm-h2.sql
        - classpath:sql/schema-approval-h2.sql
        - classpath:sql/schema-order-acceptance-h2.sql
        - classpath:sql/schema-attendance-h2.sql
        - classpath:sql/schema-dispatch-compliance-h2.sql
        - classpath:sql/schema-staffing-h2.sql
        - classpath:sql/schema-portal-h2.sql
        - classpath:sql/schema-engineer-selfservice-h2.sql
        - classpath:sql/schema-accounting-integration-h2.sql
        - classpath:sql/schema-jp-pint-h2.sql
        - classpath:sql/schema-ai-feedback-h2.sql
        - classpath:sql/schema-optimistic-lock-core-h2.sql
        - classpath:sql/schema-pwa-selfservice-h2.sql
        - classpath:sql/schema-lifecycle-workflow-h2.sql
        - classpath:sql/schema-lifecycle-case-sequence-h2.sql
        - classpath:sql/schema-scheduled-management-reporting-h2.sql
        - classpath:sql/schema-certification-learning-skill-gap-h2.sql
        # NF-09のactor_type/confirmation_sourceと相互制約はV1およびH2統合schemaで同期する。
        - classpath:sql/schema-asset-account-license-lifecycle-h2.sql
        - classpath:sql/schema-integration-hub-f1-h2.sql
        - classpath:sql/schema-integration-hub-f2-h2.sql
        - classpath:sql/schema-integration-hub-a1-h2.sql
        - classpath:sql/schema-integration-hub-b2-h2.sql
        - classpath:sql/schema-service-desk-h2.sql
        - classpath:sql/schema-nf02-nf03-tenant-ownership-h2.sql
        - classpath:sql/schema-import-center-f1a-h2.sql
        # V186: 初回ログイン時のパスワード変更要求（sys_user.password_change_required）
        - classpath:sql/schema-sys-user-password-change-h2.sql
        # V187: 同一要員の未終結退社案件を1件に限定する生成列と一意index（tenant_id付与より後）
        - classpath:sql/schema-lifecycle-resignation-unique-h2.sql
        # V188: ポータルユーザーと要員の紐付け（schema-portal-h2.sqlがポータル表を作り直した後）
        - classpath:sql/schema-portal-user-engineer-link-h2.sql
        # V189: NF01 細粒度認可epoch（全体epoch表・5 anchor列・複合一意key。tenant_id付与と文書表の作り直しより後）
        - classpath:sql/schema-authorization-epoch-h2.sql
        # V190/V191: NF07 F1表（catalog / policy / hold projection / DSAR）と W-5 権限seed（privacy-admin・privacy.* deny・menu）
        - classpath:sql/schema-privacy-f1-h2.sql
        - classpath:sql/schema-privacy-permission-h2.sql
        # V192: 外部API監査の保存期限（retention_expires_at・UTC化・purge索引）
        - classpath:sql/schema-integration-hub-external-audit-retention-h2.sql
        # V193: NF-06 取込センター画面のmenuと import.metadata.manage（管理者専用groupの明示許可・他groupのdeny）
        - classpath:sql/schema-import-center-menu-permission-h2.sql
        # V194: NF08 B2c-1 durable claim列・費用ledger 2表・監査の存在照会索引（t_ai_recommendation_run と t_audit_log の作成より後）
        - classpath:sql/schema-nf08-dispatch-claim-h2.sql
        # V195: NF01 B0 二者確認coordinatorの7表（triggerは置かず、不変6表の更新・削除はmapperで拒否する。V189相当の一意keyより後）
        - classpath:sql/schema-nf01-dual-confirmation-h2.sql
        # V196: NF07 F2 data element catalog seed（構造行と subject_attribution だけ。H2 でもそのまま実行できる。
        #       sys_user の tenant と全 m_document_type の作成・seed より後）
        - classpath:db/migration/V196__nf07_privacy_data_element_catalog_seed.sql
        # V197: 履歴・スキルシート取込と取込センターCSVの文書種別と catalog 行（H2 でもそのまま実行できる。
        #       schema-document-archive-h2.sql も同じ2行を持つため NOT EXISTS で重複しない。V196 より後）
        - classpath:db/migration/V197__resume_ingestion_and_import_document_types.sql
        # V198: NF01 二者確認（B0）の7表と自由記述2列の catalog 行（構造行だけ。H2 でもそのまま実行できる。
        #       V195 の表と sys_user の tenant の作成・seed より後）
        - classpath:db/migration/V198__nf01_dual_confirmation_privacy_catalog.sql
        # V199 は欠番。
        # V200: t_document_version.storage_key の索引 idx_dv_storage_key は、上の schema-document-archive-h2.sql が
        #       作る（@Sql で同表を作り直す試験でも索引を保つため）。V200 の file を重ねて流すと索引名が重複して失敗するため
        #       ここには置かない。V200 と H2 schema の索引の一致は ImportStageStorageKeyIndexContractTest が固定する。
        # V201: NF07 F1 の状態・区分の列の CHECK（request の status・channel・delivery_method、hold の hold_kind）。
        #       context ごとの再実行で重複しないよう H2 変種は IF NOT EXISTS で足す（V190 の H2 変種より後）
        - classpath:sql/schema-privacy-status-check-h2.sql
      data-locations:
        - classpath:sql/dummy.sql

  h2:
    console:
      enabled: false

  # 001~008(現db/migration/V1~V9)は上のschema-locationsで直接投入するため、
  # MySQL向けのFlywayマイグレーションは適用しない(二重適用を防止)。
  flyway:
    enabled: false

integration:
  hub:
    public-api:
      enabled: false
      public-id-key: test-integration-hub-public-id-key-at-least-32-bytes
      cursor-ttl-seconds: 300
      retention-purge-batch-size: 100
      retention-purge-fixed-delay-ms: 60000
    external-transport:
      enabled: false
      batch-size: 32
      lease-seconds: 60
      fixed-delay-ms: 1000
      connect-timeout-ms: 3000
      read-timeout-ms: 3000
    provider:
      mode: MOCK
      approved-inbound-providers:
        - provider-a
        - provider-b2
    topology:
      mode: DEDICATED_DATABASE
      bound-tenant-id: default

organization:
  scope:
    enabled: true

# MyBatis Plus for test
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ses.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

app:
  # scheduler専用テスト以外では定期実行を止め、テスト中のDB更新と非決定性を防ぐ。
  scheduling:
    enabled: false
  scheduler:
    lock:
      # H2/unknown DB productでShedLock usingDbTime()の警告・例外を発生させない。
      use-db-time: false
  upload:
    base-path: ./target/test-uploads
  digital-invoice:
    provider: mock
    webhook-hmac-secret: test-digital-invoice-hmac-secret
  batch:
    token-secret: test-batch-token-hmac-secret
  pwa:
    context-secret: test-pwa-context-hmac-secret
  # NF-06 preview・error exportの行参照（鍵付きHMAC）。test専用の値（Base64で42 byte）
  import-center:
    row-reference:
      hmac-key: dGVzdC1vbmx5LW5mMDYtcm93LXJlZmVyZW5jZS1obWFjLWtleS0wMDAx
  security:
    webhook:
      allow-loopback: true
    oidc:
      enabled: false
      local-login-enabled: true
      tenant-id: default
      break-glass-usernames: []
  accounting:
    tenants:
      ids: default
  mail:
    from: test@example.com
  # 既存テストの意味を保つため、test profileでは段階公開の機能スイッチを全てONにする。
  # OFF時の遮断・既定値・独立性は com.ses.config.feature の機能スイッチテストで個別に検証する。
  features:
    nf01:
      enabled: true
    nf01-dual-confirmation:
      enabled: true
    nf02:
      enabled: true
    nf02-customer-portal:
      enabled: true
      # 既存のportalテストは社内起票の問い合わせをfixtureに使うため、全期間をportalの公開範囲にする。
      # 未設定時（portal起票のみ）の挙動は PortalServiceRequestVisibility*Test で個別に検証する。
      visible-since: "2000-01-01T00:00:00+09:00"
    nf03:
      enabled: true
    nf03-certification-pii:
      enabled: true
    nf04:
      enabled: true
    nf06:
      enabled: true
    nf10:
      enabled: true

# NF07: 既存テストの意味を保つため、機能スイッチ（Feature.NF07_RETENTION・NF07_DSAR）と同じく test profile ではONにする。
# OFF時の404・policy source読取0回は PrivacyAccessGuardTest / ProductionPolicyReadonlyQueryServiceTest で、
# DSAR の OFF は PrivacyDsarApiControllerTest / PrivacyDsarDeadlineSchedulerTest で検証する。
# DSAR の期限規則（privacy.dsar.due-days）は法的な値のため test profile でも設定しない（必要な test が個別に与える）。
privacy:
  retention:
    enabled: true
  dsar:
    enabled: true

ai:
  enabled: false
  management-copilot-enabled: false
  external-send-enabled: false
  retention:
    redacted-days: 730
    raw-prompt-days: 0
    scheduler-enabled: false
    purge-batch-size: 100
    purge-fixed-delay-ms: 86400000
  evaluation:
    min-segment-count: 5
    max-regression-pp: 5
    max-latency-p95-multiplier: 2.0

menu:
  cache:
    ttl-ms: 0

logging:
  level:
    # Mapper DEBUGは大量データテストで数十万行のSQLログを生成するため、既定では抑止する。
    com.ses: INFO
    com.ses.mapper: WARN
    org.flywaydb: WARN
