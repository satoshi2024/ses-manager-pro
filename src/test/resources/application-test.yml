spring:
  datasource:
    # ACC-TEST-P1-004: 共有 mem DB。alphabetical 順序依存は禁止。更新テストは @Transactional でロールバックすること。
    # 並行更新の正しさは mysql タグの Testcontainers で検証する（H2 では証明しない）。
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations:
        - classpath:db/migration/V1__create_tables.sql
        - classpath:db/migration/V2__init_master_data.sql
        - classpath:db/migration/V4__create_notification.sql
        - classpath:db/migration/V22__notification_visibility_and_menu_routes.sql
        - classpath:db/migration/V5__create_work_record_billing.sql
        - classpath:db/migration/V6__create_sales_activity.sql
        - classpath:db/migration/V7__create_analytics_report.sql
        - classpath:db/migration/V8__user_security_columns.sql
        - classpath:db/migration/V9__system_config_and_menu.sql
        - classpath:sql/schema-organization-accounting-h2.sql
        - classpath:sql/schema-engineer-sales-h2.sql
        - classpath:db/migration/V34__data_scope_config.sql
        - classpath:sql/schema-audit-log-h2.sql
        - classpath:sql/schema-invoice-duedate-h2.sql
        - classpath:sql/schema-invoice-taxrate-h2.sql
        - classpath:sql/schema-contract-document-h2.sql
        - classpath:sql/schema-freee-payroll-h2.sql
        - classpath:sql/schema-ar-management-h2.sql
        - classpath:sql/schema-quotation-h2.sql
        - classpath:sql/schema-self-service-h2.sql
        - classpath:sql/schema-price-history-h2.sql
        - classpath:sql/schema-resume-ingestion-h2.sql
        - classpath:sql/schema-project-ingestion-h2.sql
        - classpath:sql/schema-bp-availability-h2.sql
        - classpath:sql/schema-contract-renewal-h2.sql
        - classpath:sql/schema-labor-compliance-h2.sql
        - classpath:sql/schema-engineer-followup-h2.sql
        - classpath:sql/schema-shedlock-h2.sql
        - classpath:sql/schema-enterprise-identity-h2.sql
        - classpath:sql/schema-document-archive-h2.sql
        - classpath:sql/schema-productivity-h2.sql
        - classpath:sql/schema-bp-company-h2.sql
        - classpath:sql/schema-crm-h2.sql
        - classpath:sql/schema-approval-h2.sql
        - classpath:sql/schema-order-acceptance-h2.sql
        - classpath:sql/schema-attendance-h2.sql
        - classpath:sql/schema-dispatch-compliance-h2.sql
        - classpath:sql/schema-staffing-h2.sql
        - classpath:sql/schema-portal-h2.sql
        - classpath:sql/schema-engineer-selfservice-h2.sql
        - classpath:sql/schema-accounting-integration-h2.sql
        - classpath:sql/schema-jp-pint-h2.sql
        - classpath:sql/schema-ai-feedback-h2.sql
        - classpath:sql/schema-optimistic-lock-core-h2.sql
        - classpath:sql/schema-pwa-selfservice-h2.sql
        - classpath:sql/schema-lifecycle-workflow-h2.sql
        - classpath:sql/schema-scheduled-management-reporting-h2.sql
        - classpath:sql/schema-certification-learning-skill-gap-h2.sql
        # NF-09のactor_type/confirmation_sourceと相互制約はV1およびH2統合schemaで同期する。
        - classpath:sql/schema-asset-account-license-lifecycle-h2.sql
        - classpath:sql/schema-integration-hub-f1-h2.sql
        - classpath:sql/schema-integration-hub-f2-h2.sql
        - classpath:sql/schema-integration-hub-a1-h2.sql
        - classpath:sql/schema-integration-hub-b2-h2.sql
      data-locations:
        - classpath:sql/dummy.sql

  h2:
    console:
      enabled: false

  # 001~008(現db/migration/V1~V9)は上のschema-locationsで直接投入するため、
  # MySQL向けのFlywayマイグレーションは適用しない(二重適用を防止)。
  flyway:
    enabled: false

integration:
  hub:
    public-api:
      enabled: false
      public-id-key: test-integration-hub-public-id-key-at-least-32-bytes
      cursor-ttl-seconds: 300
    external-transport:
      enabled: false
      batch-size: 32
      lease-seconds: 60
      fixed-delay-ms: 1000
      connect-timeout-ms: 3000
      read-timeout-ms: 3000
    provider:
      mode: MOCK
      approved-inbound-providers:
        - provider-a
        - provider-b2

organization:
  scope:
    enabled: true

# MyBatis Plus for test
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ses.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

app:
  # scheduler専用テスト以外では定期実行を止め、テスト中のDB更新と非決定性を防ぐ。
  scheduling:
    enabled: false
  scheduler:
    lock:
      # H2/unknown DB productでShedLock usingDbTime()の警告・例外を発生させない。
      use-db-time: false
  upload:
    base-path: ./target/test-uploads
  digital-invoice:
    provider: mock
    webhook-hmac-secret: test-digital-invoice-hmac-secret
  batch:
    token-secret: test-batch-token-hmac-secret
  pwa:
    context-secret: test-pwa-context-hmac-secret
  security:
    webhook:
      allow-loopback: true
    oidc:
      enabled: false
      local-login-enabled: true
      tenant-id: default
      break-glass-usernames: []
  mail:
    from: test@example.com

ai:
  enabled: false
  external-send-enabled: false
  retention:
    redacted-days: 730
    raw-prompt-days: 0
  evaluation:
    min-segment-count: 5
    max-regression-pp: 5
    max-latency-p95-multiplier: 2.0

menu:
  cache:
    ttl-ms: 0

logging:
  level:
    # Mapper DEBUGは大量データテストで数十万行のSQLログを生成するため、既定では抑止する。
    com.ses: INFO
    com.ses.mapper: WARN
    org.flywaydb: WARN
