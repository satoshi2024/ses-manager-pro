# ============================================================
# SES Manager Pro 本番 専用Flyway job の設定（唯一の定義）
#
# 実行: mvn -B -Pprod-migrate clean compile flyway:migrate
#   （pom.xml の prod-migrate profile が本ファイルを flyway.configFiles として読む）
# 検証: FlywayProdFreshInstallMySqlTest（実MySQL）と ProductionFlywayJobConfigurationTest（Docker不要）が
#   本ファイルそのものを読む。jobとtestで設定を二重に書かない。
# 手順: .kiro/specs/production-launch/deploy-runbook.md
#
# 本ファイルに置かないもの（secret・環境依存値。環境変数で渡し、本ファイルの値より優先される）:
#   FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD               migrator用の接続情報
#   FLYWAY_PLACEHOLDERS_ADMIN_INITIAL_PASSWORD_HASH          初期管理者パスワードのBCrypt hash
# 上記以外の FLYWAY_* 環境変数・-Dflyway.* はjob実行環境に設定しないこと（本ファイルの値を上書きするため）。
# ============================================================

# classpath location（compile後の target/classes）。Java migration（db.migration.V74_3）は
# classpath locationからしか解決されないため filesystem: は使わない。
flyway.locations=classpath:db/migration,classpath:db/migration-prod

# 欠落したlocation（compile忘れ等）を空として扱わず失敗させる。
flyway.failOnMissingLocations=true

# ProductionAdminInitialPasswordFlywayCallback: 初期管理者パスワードhashの検査（migrationを1件も実行する前に失敗させる）。
# LegacyDatabaseFlywayCallback: 旧Spring Boot起動時migrateで登録されていたcallback bean（legacy DBの補償DDL）。
# 同じeventの実行順はFlywayがcallback名の昇順で決める（hash検査の名前 AdminInitialPasswordHashCheck が先）。
# main codeに Callback beanを追加したら、ここにも追加する（ProductionFlywayJobConfigurationTestが検出する）。
flyway.callbacks=com.ses.config.ProductionAdminInitialPasswordFlywayCallback,com.ses.config.LegacyDatabaseFlywayCallback

# 以下は従来のapplication.yml（spring.flyway.*）と同じ値。
flyway.outOfOrder=false
flyway.baselineOnMigrate=true
flyway.baselineVersion=9
flyway.baselineDescription=手動SQL(001-009)適用済みベースライン

# 本番DBに対する clean（全object削除）を常に拒否する。
flyway.cleanDisabled=true
