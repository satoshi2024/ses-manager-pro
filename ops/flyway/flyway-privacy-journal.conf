# ============================================================
# NF07 Journal インスタンス 専用Flyway job の設定（唯一の定義。NF07-A1J）
#
# 実行: mvn -B -o -Pprivacy-journal-migrate clean compile flyway:migrate
#   （pom.xml の privacy-journal-migrate profile が本ファイルを flyway.configFiles として読む）
# application DB の job（prod-migrate / flyway-prod.conf）とは混ぜない。同じ mvn 実行で両方の profile を指定しない。
# 検証: PrivacyJournalFlywayJobConfigurationTest（Docker不要）と、本ファイルで Journal schema を作る
#   ProductionPrivacyJournalAdapterMySqlTest・PrivacyJournalStartupVerifierMySqlTest（実MySQL）が本ファイルそのものを読む。
# 手順: .kiro/specs/production-launch/deploy-runbook.md §3.6
#
# 本ファイルに置かないもの（secret・環境依存値。環境変数で渡し、本ファイルの値より優先される）:
#   FLYWAY_URL / FLYWAY_USER / FLYWAY_PASSWORD   Journal migrator（nf07_journal_migrator）用の接続情報
# 上記以外の FLYWAY_* 環境変数・-Dflyway.* はjob実行環境に設定しないこと（本ファイルの値を上書きするため）。
# ============================================================

# Journal 用 location だけ。application の db/migration・db/migration-prod は含めない（版番号も履歴も独立）。
flyway.locations=classpath:db/privacy-journal

# 欠落したlocation（compile忘れ等）を空として扱わず失敗させる。
flyway.failOnMissingLocations=true

# application の flyway_schema_history と別の履歴表。application の起動時schema guardはこの表を見ない。
flyway.table=flyway_schema_history_privacy_journal

# 空の Journal schema へ V1 から適用する。非空schemaのbaselineはしない。
flyway.baselineOnMigrate=false
flyway.outOfOrder=false

# Journal は追記の正本。clean（全object削除）を常に拒否する。
flyway.cleanDisabled=true

# application の callback（初期管理者hash検査・legacy DB補償）は持たない（flyway.callbacks を書かない）。
