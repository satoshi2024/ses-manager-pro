# HFP-03-011 integration suite（実 MySQL PITR の自動検証）
#
# - pinned MySQL 8.4.13（production と同じ 8.4 LTS 系列。source/target を別コンテナ・専用 network で分離）。
#   tag だけでなく digest で固定する。
#   digest は従来と同じく manifest list（index）のもの（linux/amd64 の manifest digest
#   sha256:72c368d898861f3b3a07af0e6d690400f44f048799ed46822783d9224cc2c86d ではない）。2026-11-18 に統括が
#   Docker Hub の tag API（library/mysql:8.4.13、last_updated 2026-11-03）で確認した値。
#   （RB-W より前の 8.0.36 の digest は、.kiro/specs/database-backup-recovery/baseline.md §4.1 の docker inspect 実測と
#   Docker Hub の tag API の 2 つの出典で一致を確認していた。この file には 8.4.13 以外の MySQL image を書かない:
#   RB-MYSQL84 の MySqlTestImagesTest が、既定と違う tag の参照を例外の要否の判定に使うため。）Runner は docker pull 後の
#   docker image inspect --format '{{index .RepoDigests 0}}' mysql:8.4.13 で再確認する（8.4.13 は未取得）。
# - --binlog-format=ROW は指定しない（8.4 で非推奨。既定が ROW のため、外しても同じ）。
# - host port を公開しない（internal network）
# - パスワードは env（INTEGRATION_SRC_PW / INTEGRATION_TGT_PW）から注入する
#   synthetic secret（repo には値を書かない）
# - tool イメージは ops/backup/Dockerfile から build（Dockerfile の SHA-256 / fingerprint 検証込み）
# - 書込み静止は DB の protocol（quiesce-db・quiesce-app-stopped）で取る。app の instance の代わりに responder（tool image の
#   shell の loop）が信号表（V202）に応答する（RB-QUIESCE BWQ-012。file の heartbeat・ack の fake は使わない）
# - 共有 work ディレクトリ（INTEGRATION_WORK_DIR）に evidence を出力
name: ses-backup-integration

x-mysql-common: &mysql-common
  image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
  networks: [ses-bkup]
  restart: "no"

services:
  source:
    <<: *mysql-common
    container_name: ses-bkup-int-source
    command:
      - --log-bin=/var/lib/mysql/binlog
      - --server-id=100
      - --binlog-checksum=CRC32
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=86400
    environment:
      MYSQL_ROOT_PASSWORD: ${INTEGRATION_SRC_PW:?INTEGRATION_SRC_PW required}
      MYSQL_DATABASE: ses_manager_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${INTEGRATION_SRC_PW}"]
      interval: 2s
      timeout: 3s
      retries: 90

  target:
    <<: *mysql-common
    container_name: ses-bkup-int-target
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${INTEGRATION_TGT_PW:?INTEGRATION_TGT_PW required}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${INTEGRATION_TGT_PW}"]
      interval: 2s
      timeout: 3s
      retries: 90

  tool:
    image: ses-backup-tool:integration
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ses-bkup-int-tool
    networks: [ses-bkup]
    volumes:
      - ${INTEGRATION_WORK_DIR:?INTEGRATION_WORK_DIR required}:/work:rw
    environment:
      WORK_DIR: /work
    command: ["sleep", "infinity"]

  # 書込み静止の app の instance 相当（RB-QUIESCE BWQ-012。design.md §16）。app の静止応答と同じ信号表の SQL を、専用の合成
  # user で mysql client から実行する shell の loop（tests/integration-responder.sh。run-integration.sh が WORK の
  # responder/ へ写す）。integration-pitr.sh が user を作り、最初の full（--app-stopped）の後に /work/responder/start を
  # 置くまで DB に接続しない。負例では freeze-after-ack で静止の途中に応答を止める。
  responder:
    image: ses-backup-tool:integration
    container_name: ses-bkup-int-responder
    networks: [ses-bkup]
    restart: "no"
    volumes:
      - ${INTEGRATION_WORK_DIR:?INTEGRATION_WORK_DIR required}:/work:rw
    environment:
      RESPONDER_DIR: /work/responder
    command: ["bash", "/work/responder/integration-responder.sh"]

networks:
  ses-bkup:
    driver: bridge
    internal: true
