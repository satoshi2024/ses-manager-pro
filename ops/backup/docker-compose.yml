# ============================================================
# HFP-03 バックアップ job 定義（docker compose）
#
# 前提:
#   - .env.backup に接続先/リポジトリ等を設定（secret 値は書かない）
#   - secrets/mysql-password, secrets/restic-password を配置（0600）
#   - secrets/mysql-capath/ に hashed CA ディレクトリを配置
#     （c_rehash 済み: <subject_hash>.0 ファイル）
#   - ツールイメージは private registry を使わずに配布する（XB-10）。検証済みの build 機で
#     image/tool-image.sh build-record → save し、各ホストでは tool-image.sh load（tar の SHA-256 と
#     image ID を照合）で読み込む。この compose は build しない（build: を書かない）。
#   - 下記 x-ses-backup-tool-image-id に、記録した image ID（sha256:<16 進 64 桁>）を設定する。
#     占位値（UNPINNED）のまま、またはローカルの ses-backup-tool:8.0.46 の image ID と一致しない場合、
#     image/tool-image.sh check / compose が拒否する。job は必ず
#       ops/backup/image/tool-image.sh compose run --rm <service>
#     で起動する（docker compose を直接実行しない）。
#   - .env.backup の FLYWAY_VERSION（Flyway 形式。例: 185、185.1）、CONTENT_HASH_TABLES
#     （内容ハッシュを記録する主要 table）を設定する。README「設定」参照。
# ============================================================
# 要人手確認: 検証済み build の image ID を設定するまで production では使えない（fail-closed）。
x-ses-backup-tool-image-id: "sha256:UNPINNED"

x-backup-common: &backup-common
  image: ses-backup-tool:8.0.46
  pull_policy: never
  env_file: [.env.backup]
  secrets: [mysql_password, restic_password]
  volumes:
    - backup-data:/var/lib/ses-backup
    - uploads:/app/uploads:ro
    - ./secrets/mysql-capath:/etc/mysql-ssl-ca:ro

x-db-only: &db-only
  <<: *backup-common
  volumes:
    - backup-data:/var/lib/ses-backup
    - ./secrets/mysql-capath:/etc/mysql-ssl-ca:ro

services:
  # 環境契約検査（read-only）。deploy 前・障害時の事前確認に使う
  preflight:
    <<: *backup-common
    entrypoint: ["/usr/local/bin/preflight.sh"]
    command: ["--json"]

  # 日次 full（02:00 Asia/Tokyo 想定の scheduler から実行）
  backup:
    <<: *backup-common
    entrypoint: ["/usr/local/bin/backup-full.sh"]

  # 継続 binlog archive（常駐）。初回起点は backup-full が書き出す
  # FULL_COORDINATE_FILE（.env.backup で backup-data 上の共有 path を指定）
  binlog:
    <<: *db-only
    entrypoint: ["/usr/local/bin/archive-binlog.sh"]

  # 15 分間隔 checkpoint（DB/uploads 整合点）
  checkpoint:
    <<: *backup-common
    entrypoint: ["/usr/local/bin/create-checkpoint.sh"]

  # 閉じた binlog の immutable snapshot（checkpoint 連動）
  snapshot-binlog:
    <<: *db-only
    entrypoint: ["/usr/local/bin/snapshot-binlog.sh"]

  # watermark 監視（alert routing は外部 scheduler/monitor で受ける）
  check:
    <<: *db-only
    entrypoint: ["/usr/local/bin/check-backup.sh"]
    command: ["--json"]

  # 依存を壊さない retention（専用 role / maintenance 専用）
  retention:
    <<: *db-only
    entrypoint: ["/usr/local/bin/retention.sh"]

secrets:
  mysql_password: {file: ./secrets/mysql-password}
  restic_password: {file: ./secrets/restic-password}

volumes:
  uploads: {}
  backup-data: {}
